<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Rekap Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#241B12;
    --panel:#FFF9EC;
    --red:#E23F35;
    --red-dim:#B23A2E;
    --gold:#F2B705;
    --green:#3F9142;
    --line: rgba(36,27,18,0.14);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:#FDE9A8;color:var(--ink);font-family:'Nunito',sans-serif;
    min-height:100vh;padding:24px 14px;
  }
  .board{width:100%;max-width:480px;margin:0 auto;}
  .header{
    background:var(--ink);border-radius:16px 16px 0 0;padding:18px 22px;
    display:flex;align-items:center;justify-content:space-between;gap:10px;
  }
  .header .eyebrow{font-size:11px;letter-spacing:0.18em;color:var(--gold);text-transform:uppercase;font-weight:700;}
  .header .title{font-size:20px;font-weight:800;color:#FFF9EC;margin-top:2px;}
  .logout-btn{
    background:transparent;border:1px solid rgba(255,249,236,0.3);color:#FFF9EC;
    font-size:11px;font-weight:800;letter-spacing:0.04em;text-transform:uppercase;
    padding:8px 12px;border-radius:8px;cursor:pointer;flex-shrink:0;
  }
  .logout-btn:active{opacity:0.7;}
  .feedback-link{
    display:block;background:var(--panel);border:1px solid var(--line);border-top:none;
    text-align:center;padding:14px 18px;font-size:13.5px;font-weight:800;color:var(--ink);
    text-decoration:none;
  }
  .feedback-link:active{opacity:0.75;}
  .card{
    background:var(--panel);border:1px solid var(--line);padding:26px 22px;text-align:center;
  }
  .status-pill{
    display:inline-block;font-size:12px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;
    padding:8px 18px;border-radius:100px;margin-bottom:18px;
  }
  .status-pill.open{background:rgba(63,145,66,0.15);color:var(--green);}
  .status-pill.closed{background:rgba(226,63,53,0.15);color:var(--red);}
  h1{font-size:19px;font-weight:800;margin:0 0 8px;}
  p{font-size:13.5px;color:var(--red-dim);font-weight:600;line-height:1.6;margin:0 0 18px;}
  .btn{
    font-weight:800;letter-spacing:0.04em;text-transform:uppercase;font-size:14px;
    border:none;padding:15px 28px;border-radius:10px;cursor:pointer;width:100%;
    transition:opacity .15s, transform .1s;
  }
  .btn:active{transform:scale(0.98);}
  .btn.close-btn{background:var(--red);color:#FFF9EC;}
  .btn.open-btn{background:var(--green);color:#FFF9EC;}
  .btn.login-btn{background:var(--ink);color:#FFF9EC;margin-top:4px;}
  .btn:hover{opacity:0.9;}
  .btn:disabled{opacity:0.5;cursor:default;}
  .footer-note{
    background:var(--ink);color:rgba(255,249,236,0.55);font-size:11px;text-align:center;
    padding:12px 18px;border-radius:0 0 16px 16px;font-weight:600;
  }
  .loading{font-size:13px;color:var(--red-dim);font-weight:700;}
  .login-input{
    width:100%;background:#FFFFFF;border:1px solid var(--line);color:var(--ink);
    padding:13px 16px;border-radius:10px;font-size:15px;font-family:'Nunito',sans-serif;
    font-weight:600;margin-bottom:10px;text-align:left;
  }
  .login-input:focus{outline:none;border-color:var(--gold);}
  .login-error{
    font-size:12.5px;color:var(--red);font-weight:700;margin:-4px 0 14px;text-align:left;min-height:16px;
  }

  .section-card{
    background:var(--panel);border:1px solid var(--line);border-top:none;padding:22px;text-align:left;
  }
  .section-title{font-size:12.5px;font-weight:800;color:var(--ink);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:14px;}
  .exam-toggle-row{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
  .exam-toggle-btn{
    flex:1;min-width:110px;padding:12px;border:2px solid var(--line);border-radius:10px;background:#fff;
    font-family:'Nunito',sans-serif;font-weight:800;font-size:13px;cursor:pointer;color:var(--ink);
  }
  .exam-toggle-btn.selected-off{border-color:var(--green);background:rgba(63,145,66,0.1);color:var(--green);}
  .exam-toggle-btn.selected-on{border-color:var(--red-dim);background:rgba(226,63,53,0.1);color:var(--red-dim);}
  .exam-toggle-btn.selected-mandiri{border-color:var(--blue);background:rgba(43,108,176,0.1);color:var(--blue);}
  .chat-admin-item{
    border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:flex;justify-content:space-between;
    gap:8px;align-items:flex-start;background:#fff;
  }
  .chat-del-btn{border:none;background:none;color:var(--red-dim);cursor:pointer;font-size:16px;flex-shrink:0;font-weight:800;}
  .field-label{font-size:11px;font-weight:800;color:#8a7a5c;text-transform:uppercase;margin:14px 0 6px;letter-spacing:0.4px;}
  .select-row{display:flex;gap:8px;}
  select{
    flex:1;padding:10px;border:2px solid var(--line);border-radius:8px;font-family:'Nunito',sans-serif;
    font-weight:700;font-size:13.5px;color:var(--ink);background:#fff;
  }
  .save-exam-btn{
    width:100%;padding:13px;border:none;border-radius:10px;background:var(--ink);color:#FFF9EC;
    font-family:'Baloo 2',sans-serif;font-weight:700;font-size:14.5px;cursor:pointer;margin-top:16px;
  }
  .save-exam-btn:disabled{opacity:0.5;}
  .saved-msg{font-size:11.5px;color:var(--green);font-weight:800;margin-top:8px;display:none;text-align:center;}

  .lb-row{
    background:#FFF3D6;border-radius:8px;padding:9px 12px;font-size:13px;font-weight:700;
    margin-bottom:6px;display:flex;justify-content:space-between;
  }
  .lb-empty{font-size:12.5px;color:#8a7a5c;font-weight:600;}
  .reset-score-btn{
    width:100%;padding:12px;border:none;border-radius:10px;background:var(--red-dim);color:#FFF9EC;
    font-family:'Baloo 2',sans-serif;font-weight:700;font-size:13.5px;cursor:pointer;margin-top:14px;
  }

  .history-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .history-head h2{font-size:12.5px;font-weight:800;margin:0;text-transform:uppercase;letter-spacing:0.5px;}
  .history-count{font-size:11px;font-weight:800;color:var(--red-dim);background:rgba(226,63,53,0.1);padding:4px 10px;border-radius:100px;}
  .history-list{
    max-height:300px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding-right:2px;
  }
  .history-item{
    background:#FFFFFF;border:1px solid var(--line);border-radius:10px;
    padding:10px 12px;display:flex;flex-direction:column;gap:4px;
  }
  .history-item-top{display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .history-item .hname{font-size:13px;font-weight:800;color:var(--ink);}
  .history-item .htime{font-size:11px;font-weight:700;color:rgba(36,27,18,0.55);white-space:nowrap;}
  .history-item .hmeta{font-size:11px;font-weight:700;color:rgba(36,27,18,0.5);}
  .history-empty{font-size:12.5px;color:rgba(36,27,18,0.55);font-weight:600;padding:10px 0;}
  .clear-history-btn{
    font-size:11px;font-weight:800;letter-spacing:0.02em;background:transparent;color:var(--red-dim);
    border:1px solid var(--line);padding:8px 12px;border-radius:100px;cursor:pointer;margin-top:14px;width:100%;
  }
  .feedback-badge{
    display:inline-block;background:var(--red);color:#fff;font-size:11px;font-weight:800;
    border-radius:100px;padding:2px 8px;margin-left:6px;
  }
  .stat-row-item{
    background:#FFFFFF;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:6px;
  }
  .stat-row-top{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;font-weight:800;}
  .stat-row-sub{font-size:11px;color:rgba(36,27,18,0.55);font-weight:600;margin-top:2px;}
  .wrong-tag{color:var(--red-dim);}
  .schedule-row{display:flex;flex-direction:column;gap:8px;margin-top:10px;}
  .schedule-row label{font-size:11px;font-weight:800;color:#8a7a5c;text-transform:uppercase;letter-spacing:0.4px;}
  input[type="datetime-local"], input[type="color"], input[type="text"].plain-input{
    width:100%;padding:10px;border:2px solid var(--line);border-radius:8px;font-family:'Nunito',sans-serif;
    font-weight:700;font-size:13px;color:var(--ink);background:#fff;
  }
  .toggle-row{display:flex;gap:8px;margin:10px 0;}
  .toggle-btn{
    flex:1;padding:10px;border:2px solid var(--line);border-radius:10px;background:#fff;
    font-family:'Nunito',sans-serif;font-weight:800;font-size:12.5px;cursor:pointer;color:var(--ink);
  }
  .toggle-btn.on{border-color:var(--green);background:rgba(63,145,66,0.1);color:var(--green);}
  .banned-item{
    background:#FFFFFF;border:1px solid var(--line);border-radius:10px;padding:9px 12px;
    display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:8px;
  }
  .small-btn{
    font-size:11px;font-weight:800;border:none;border-radius:8px;padding:7px 10px;cursor:pointer;flex-shrink:0;
  }
  .small-btn.ban{background:var(--red);color:#fff;}
  .small-btn.unban{background:var(--green);color:#fff;}
  .export-btn{
    width:100%;padding:12px;border:none;border-radius:10px;background:var(--ink);color:#FFF9EC;
    font-family:'Nunito',sans-serif;font-weight:800;font-size:13px;cursor:pointer;margin-bottom:8px;
  }
</style>
</head>
<body>

<div class="board">
  <div class="header">
    <div class="brand">
      <div class="eyebrow">LC Language Center · Basic Camp</div>
      <div class="title">🔒 Panel Admin</div>
    </div>

  <div class="card" id="card">
    <div class="loading">Memuat...</div>
  </div>
  <a class="feedback-link" id="feedbackLink" href="masukan-1iamt4um1o.html" style="display:none;">💬 Lihat Masukan Peserta →</a>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyDPaWjx_MxF6Q8OT_P7FCn9h6MyfADnq8g",
    authDomain: "quizz-7bac3.firebaseapp.com",
    databaseURL: "https://quizz-7bac3-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "quizz-7bac3",
    storageBucket: "quizz-7bac3.firebasestorage.app",
    messagingSenderId: "105522344136",
    appId: "1:105522344136:web:3fde8250987b74ad9ff5fd"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.database();
  const card = document.getElementById('card');
  const extraSections = document.getElementById('extraSections');
  const logoutBtn = document.getElementById('logoutBtn');
  const feedbackLink = document.getElementById('feedbackLink');

  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, (c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function sanitizeNameForKey(name){
    return String(name).replace(/[.#$\[\]\/]/g, '_').trim();
  }

  /* ---------------- EXPORT CSV ---------------- */
  function toCsv(rows, headers){
    const esc = (v)=> `"${String(v===undefined||v===null?'':v).replace(/"/g,'""')}"`;
    const lines = [headers.map(esc).join(',')];
    rows.forEach(r=> lines.push(headers.map(h=>esc(r[h])).join(',')));
    return lines.join('\r\n');
  }
  function downloadCsv(filename, csvStr){
    const blob = new Blob(['\uFEFF' + csvStr], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  /* ---------------- LOGIN FORM ---------------- */
  function renderLoginForm(errorMsg){
    extraSections.innerHTML = '';
    card.innerHTML = `
      <div class="status-pill closed">🔐 Akses Terbatas</div>
      <h1>Masuk sebagai Admin</h1>
      <p>Halaman ini hanya bisa diakses oleh admin. Masukkan email &amp; password admin untuk melanjutkan.</p>
      <input type="email" id="adminEmail" class="login-input" placeholder="Email admin" autocomplete="username" />
      <input type="password" id="adminPass" class="login-input" placeholder="Password" autocomplete="current-password" />
      <div class="login-error">${errorMsg || ''}</div>
      <button class="btn login-btn" id="loginBtn">Masuk</button>
    `;
    logoutBtn.style.display = 'none';
    feedbackLink.style.display = 'none';
    const emailInput = document.getElementById('adminEmail');
    const passInput = document.getElementById('adminPass');
    const doLogin = ()=>{
      const email = emailInput.value.trim();
      const pass = passInput.value;
      if(!email || !pass){ renderLoginForm('Isi email dan password terlebih dahulu.'); return; }
      const btn = document.getElementById('loginBtn');
      btn.disabled = true; btn.textContent = 'Memeriksa...';
      auth.signInWithEmailAndPassword(email, pass).catch(()=>{
        renderLoginForm('Email atau password salah.');
      });
    };
    document.getElementById('loginBtn').onclick = doLogin;
    passInput.addEventListener('keydown', (e)=>{ if(e.key === 'Enter'){ e.preventDefault(); doLogin(); } });
    emailInput.focus();
  }

  /* ---------------- GATE (buka/tutup akses) ---------------- */
  function renderGate(isOpen){
    card.innerHTML = `
      <div class="status-pill ${isOpen ? 'open' : 'closed'}">${isOpen ? '🟢 Sedang Terbuka' : '🔴 Sedang Ditutup'}</div>
      <h1>${isOpen ? 'Soal saat ini bisa dikerjakan murid' : 'Soal saat ini TIDAK bisa dikerjakan murid'}</h1>
      <p>${isOpen ? 'Tap tombol di bawah untuk menutup akses soal buat semua murid.' : 'Tap tombol di bawah untuk membuka akses soal buat semua murid.'}</p>
      <button class="btn ${isOpen ? 'close-btn' : 'open-btn'}" id="toggleBtn">${isOpen ? '🔒 Tutup Soal' : '🔓 Buka Soal'}</button>
    `;
    document.getElementById('toggleBtn').onclick = ()=>{
      db.ref('settings/gateOpen').set(!isOpen);
    };
  }

  /* ---------------- EXAM MODE + LEADERBOARD + LOGIN HISTORY ---------------- */
  function renderExtraSections(){
    extraSections.innerHTML = `
      <div class="section-card">
        <div class="section-title">🎓 Mode Ujian</div>
        <div class="exam-toggle-row">
          <button class="exam-toggle-btn" id="examOffBtn" type="button">Mode Biasa</button>
          <button class="exam-toggle-btn" id="examAdminBtn" type="button">Diatur Admin</button>
          <button class="exam-toggle-btn" id="examMandiriBtn" type="button">Mandiri (Peserta Pilih)</button>
        </div>
        <p id="examMandiriHint" style="display:none;font-size:11.5px;margin:-6px 0 14px;color:#8a7a5c;">Peserta akan melihat tombol <b>🎓 Ujian Mandiri</b> di menu mereka dan bebas memilih sendiri cakupan &amp; tipe soal ujiannya. Pengaturan cakupan/tipe di bawah ini tidak dipakai di mode ini.</p>

        <div id="examScopeFieldsWrap">
          <div class="field-label">Cakupan Soal</div>
          <div class="select-row">
            <select id="scopeSelect">
              <option value="all">Semua Hari (32 hari)</option>
              <option value="day">Per Hari</option>
            </select>
          </div>

          <div id="dayFields" style="display:none;">
            <div class="field-label">Bulan &amp; Hari</div>
            <div class="select-row">
              <select id="monthSelect">
                <option value="1">Bulan 1</option>
                <option value="2">Bulan 2</option>
              </select>
              <select id="daySelect"></select>
            </div>
          </div>

          <div class="field-label">Tipe Soal</div>
          <div class="select-row">
            <select id="typeSelect">
              <option value="mc">Pilihan Ganda saja</option>
              <option value="essay">Esai saja</option>
              <option value="both">Campuran (PG &amp; Esai)</option>
            </select>
          </div>
        </div>

        <button class="save-exam-btn" id="saveExamBtn">Simpan Pengaturan Ujian</button>
        <div class="saved-msg" id="savedMsg">✓ Tersimpan &amp; langsung aktif</div>
      </div>

      <div class="section-card" style="border-top:1px dashed var(--line);">
        <div class="section-title">🏆 Papan Skor Ujian</div>
        <div id="leaderboard"><div class="lb-empty">Memuat...</div></div>
        <button class="reset-score-btn" id="resetScoresBtn">🗑 Hapus Semua Skor</button>
      </div>

      <div class="section-card" style="border-top:1px dashed var(--line);">
        <div class="section-title">💬 Chat Peserta</div>
        <div id="chatAdminList" style="max-height:280px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;margin-bottom:12px;"><div class="lb-empty">Memuat obrolan...</div></div>
        <div style="display:flex;gap:6px;">
          <input type="text" id="chatAdminInput" class="plain-input" placeholder="Kirim pesan sebagai Admin..." style="flex:1;" maxlength="300">
          <button class="save-exam-btn" id="chatAdminSendBtn" style="margin-top:0;width:auto;padding:0 16px;">Kirim</button>
        </div>
        <button class="clear-history-btn" id="clearChatBtn">🗑 Hapus Semua Chat</button>
      </div>

      <div class="section-card" style="border-top:1px dashed var(--line);">
        <div class="history-head">
          <h2>📋 Riwayat Login Peserta</h2>
          <span class="history-count" id="historyCount">0</span>
        </div>
        <div class="history-list" id="historyList"><div class="history-empty">Memuat riwayat...</div></div>
        <button class="clear-history-btn" id="clearHistoryBtn">Hapus semua riwayat</button>
      </div>

      <div class="section-card" style="border-top:1px dashed var(--line);">
        <div class="section-title">⏰ Jadwal Buka/Tutup Otomatis</div>
        <div class="toggle-row">
          <button class="toggle-btn" id="schedOffBtn" type="button">Nonaktif (manual)</button>
          <button class="toggle-btn" id="schedOnBtn" type="button">Aktif</button>

          <input type="datetime-local" id="schedCloseAt">
        </div>
        <p style="font-size:11.5px;margin:10px 0 0;">Kalau aktif, soal otomatis terbuka/tertutup sesuai jadwal ini di perangkat murid (mengabaikan tombol buka/tutup manual di atas). Kosongkan salah satu kalau tidak perlu.</p>
        <button class="save-exam-btn" id="saveSchedBtn">Simpan Jadwal</button>
        <div class="saved-msg" id="savedSchedMsg">✓ Jadwal tersimpan</div>
      </div>

      <div class="section-card" style="border-top:1px dashed var(--line);">
        <div class="section-title">🎨 Warna/Tema Web</div>
        <label style="font-size:11px;font-weight:800;color:#8a7a5c;text-transform:uppercase;">Warna Aksen (untuk peserta)</label>
        <div style="display:flex;gap:8px;margin-top:8px;align-items:center;">
          <input type="color" id="accentColorInput" value="#E23F35" style="width:56px;height:40px;padding:2px;">
          <button class="save-exam-btn" id="saveAccentBtn" style="margin-top:0;flex:1;">Simpan Warna</button>
        </div>
        <button class="clear-history-btn" id="resetAccentBtn" style="margin-top:10px;">Kembalikan ke warna default</button>
      </div>

      <div class="section-card" style="border-top:1px dashed var(--line);">
        <div class="section-title">📈 Statistik Soal Tersulit</div>
        <p style="font-size:11.5px;margin:0 0 10px;">Soal yang paling sering dijawab salah oleh peserta — bagus buat tahu materi mana yang perlu diulang.</p>
        <div id="questionStatsList"><div class="lb-empty">Memuat statistik...</div></div>
        <button class="clear-history-btn" id="resetStatsBtn" style="margin-top:10px;">🗑 Hapus Semua Statistik Soal</button>

      <div class="section-card" style="border-top:1px dashed var(--line);">
        <div class="section-title">📤 Export Data</div>
        <button class="export-btn" id="exportLoginBtn">⬇️ Riwayat Login (CSV)</button>
        <button class="export-btn" id="exportScoresBtn">⬇️ Skor Ujian (CSV)</button>

        <button class="export-btn" id="exportStatsBtn">⬇️ Statistik Soal (CSV)</button>
      </div>

      <div class="section-card" style="border-top:1px dashed var(--line);">
        <div class="section-title">🟢 Sedang Online (Presence)</div>
        <p style="font-size:11.5px;margin:0 0 10px;">Kalau ada nama yang nyangkut online padahal orangnya udah keluar (misal koneksi putus mendadak), hapus manual di sini.</p>
        <button class="clear-history-btn" id="clearAllPresenceBtn" style="margin-bottom:10px;">🧹 Hapus Semua Presence</button>
        <div id="presenceAdminList"><div class="history-empty">Memuat daftar online...</div></div>
      </div>

      <div class="section-card" style="border-top:1px dashed var(--line);">
        <div class="section-title">👥 Kelola Peserta (Ban/Blokir)</div>
        <div style="display:flex;gap:6px;margin-bottom:10px;">
          <input type="text" id="manualBanName" class="plain-input" placeholder="Nama peserta...">
        </div>
        <input type="text" id="manualBanReason" class="plain-input" placeholder="Alasan (opsional)..." style="margin-bottom:8px;">
        <button class="save-exam-btn" id="manualBanBtn" style="margin-top:0;">🚫 Blokir Nama Ini</button>
        <div style="margin-top:16px;" id="participantList"><div class="history-empty">Memuat daftar peserta...</div></div>
      </div>
    `;

    /* exam mode config */
    const examOffBtn = document.getElementById('examOffBtn');
    const examAdminBtn = document.getElementById('examAdminBtn');
    const examMandiriBtn = document.getElementById('examMandiriBtn');
    const examMandiriHint = document.getElementById('examMandiriHint');
    const examScopeFieldsWrap = document.getElementById('examScopeFieldsWrap');
    const scopeSelect = document.getElementById('scopeSelect');
    const dayFields = document.getElementById('dayFields');
    const monthSelect = document.getElementById('monthSelect');
    const daySelect = document.getElementById('daySelect');
    const typeSelect = document.getElementById('typeSelect');
    const saveExamBtn = document.getElementById('saveExamBtn');
    const savedMsg = document.getElementById('savedMsg');

    for(let d=1; d<=16; d++){
      const opt = document.createElement('option');
      opt.value = d;
      opt.textContent = `Day ${d}`;
      daySelect.appendChild(opt);
    }

    let localExamMode = false;
    let localExamControlMode = 'admin'; // 'admin' | 'mandiri'
    function setExamModeUI(isOn, controlMode){
      localExamMode = isOn;
      localExamControlMode = (controlMode === 'mandiri') ? 'mandiri' : 'admin';
      examOffBtn.classList.toggle('selected-off', !isOn);
      examAdminBtn.classList.toggle('selected-on', isOn && localExamControlMode === 'admin');
      examMandiriBtn.classList.toggle('selected-mandiri', isOn && localExamControlMode === 'mandiri');
      const showScopeFields = isOn && localExamControlMode === 'admin';
      examScopeFieldsWrap.style.display = showScopeFields ? 'block' : 'none';
      examMandiriHint.style.display = (isOn && localExamControlMode === 'mandiri') ? 'block' : 'none';
    }
    examOffBtn.addEventListener('click', ()=> setExamModeUI(false, localExamControlMode));
    examAdminBtn.addEventListener('click', ()=> setExamModeUI(true, 'admin'));
    examMandiriBtn.addEventListener('click', ()=> setExamModeUI(true, 'mandiri'));
    scopeSelect.addEventListener('change', ()=>{
      dayFields.style.display = scopeSelect.value === 'day' ? 'block' : 'none';
    });

    let firstConfigLoad = true;
    db.ref('settings').on('value', (snapshot)=>{
      const val = snapshot.val() || {};
      if(firstConfigLoad){
        firstConfigLoad = false;
        setExamModeUI(!!val.examMode, val.examControlMode || 'admin');
        const cfg = val.examConfig || { scope:'all', month:1, day:1, types:'mc' };
        scopeSelect.value = cfg.scope || 'all';
        dayFields.style.display = scopeSelect.value === 'day' ? 'block' : 'none';
        monthSelect.value = String(cfg.month || 1);
        daySelect.value = String(cfg.day || 1);
        typeSelect.value = cfg.types || 'mc';
      }
    });

    saveExamBtn.addEventListener('click', ()=>{
      saveExamBtn.disabled = true;
      const cfg = {
        scope: scopeSelect.value,
        month: parseInt(monthSelect.value, 10),
        day: parseInt(daySelect.value, 10),
        types: typeSelect.value
      };
      Promise.all([
        db.ref('settings/examMode').set(localExamMode),
        db.ref('settings/examControlMode').set(localExamControlMode),
        db.ref('settings/examConfig').set(cfg)
      ]).then(()=>{
        savedMsg.style.display = 'block';
        setTimeout(()=>{ savedMsg.style.display = 'none'; }, 2500);
      }).catch((err)=>{
        alert('Gagal menyimpan: ' + err.message);
      }).finally(()=>{
        saveExamBtn.disabled = false;
      });
    });

    /* chat peserta */
    const chatAdminList = document.getElementById('chatAdminList');
    const chatAdminInput = document.getElementById('chatAdminInput');
    const chatAdminSendBtn = document.getElementById('chatAdminSendBtn');
    const clearChatBtn = document.getElementById('clearChatBtn');

    db.ref('chat/messages').limitToLast(200).on('value', (snapshot)=>{
      const data = snapshot.val() || {};
      const entries = Object.entries(data).sort((a,b)=> (a[1].timestamp||0) - (b[1].timestamp||0));
      if(!chatAdminList) return;
      if(entries.length === 0){
        chatAdminList.innerHTML = '<div class="lb-empty">Belum ada obrolan.</div>';
        return;
      }
      chatAdminList.innerHTML = entries.map(([id, m])=>{
        const d = m.timestamp ? new Date(m.timestamp) : null;
        const timeStr = d ? d.toLocaleString('id-ID', { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' }) : '-';
        const isAdmin = m.isAdmin === true;
        return `<div class="chat-admin-item">
          <div style="min-width:0;">
            <div style="font-size:10.5px;font-weight:800;opacity:0.65;">${isAdmin ? '👑 Admin' : escapeHtml(m.name || 'Anonim')} · ${timeStr}</div>
            <div style="font-size:13px;word-break:break-word;">${escapeHtml(m.message || '')}</div>
          </div>
          <button class="chat-del-btn" data-id="${id}" type="button">✕</button>
        </div>`;
      }).join('');
      chatAdminList.querySelectorAll('.chat-del-btn').forEach(btn=>{
        btn.onclick = ()=> db.ref('chat/messages/' + btn.dataset.id).remove();
      });
    });

    function sendChatAsAdmin(){
      const val = chatAdminInput.value.trim();
      if(!val) return;
      db.ref('chat/messages').push({
        name: 'Admin',
        isAdmin: true,
        message: val.slice(0, 300),
        timestamp: firebase.database.ServerValue.TIMESTAMP
      });
      chatAdminInput.value = '';
    }
    chatAdminSendBtn.addEventListener('click', sendChatAsAdmin);
    chatAdminInput.addEventListener('keydown', (e)=>{ if(e.key === 'Enter'){ e.preventDefault(); sendChatAsAdmin(); } });
    clearChatBtn.addEventListener('click', ()=>{
      if(confirm('Yakin mau hapus SEMUA pesan chat? Tindakan ini tidak bisa dibatalkan.')){
        db.ref('chat/messages').remove();
      }
    });

    /* leaderboard */
    const RANK_MEDAL = { 0: '🥇', 1: '🥈', 2: '🥉' };
    function formatDuration(ms){
      if(ms === null || ms === undefined) return '-';
      const totalSec = Math.round(ms/1000);
      const m = Math.floor(totalSec/60);
      const s = totalSec%60;
      return m > 0 ? `${m}m ${s}d` : `${s}d`;
    }
    const leaderboardEl = document.getElementById('leaderboard');
    db.ref('examScores').on('value', (snapshot)=>{
      const data = snapshot.val() || {};
      const arr = Object.values(data).filter(u=>u && u.name).sort((a,b)=>{
        if(b.score !== a.score) return b.score - a.score;
        const da = (a.durationMs === null || a.durationMs === undefined) ? Infinity : a.durationMs;
        const db_ = (b.durationMs === null || b.durationMs === undefined) ? Infinity : b.durationMs;
        return da - db_;
      });
      if(arr.length === 0){
        leaderboardEl.innerHTML = '<div class="lb-empty">Belum ada yang menyelesaikan ujian.</div>';
        return;
      }
      leaderboardEl.innerHTML = arr.map((u,i)=>`<div class="lb-row"><span>${RANK_MEDAL[i] || (i+1)+'.'} ${escapeHtml(u.name)}${u.mandiri ? ' <span style="font-size:10px;color:var(--blue);font-weight:800;">(Mandiri)</span>' : ''}</span><span>${u.score}/${u.total} · ⏱ ${formatDuration(u.durationMs)}</span></div>`).join('');
    });
    document.getElementById('resetScoresBtn').addEventListener('click', ()=>{
      if(confirm('Yakin mau hapus SEMUA skor ujian? Tindakan ini tidak bisa dibatalkan.')){
        db.ref('examScores').remove();
      }
    });

    /* login history */
    const historyList = document.getElementById('historyList');
    const historyCount = document.getElementById('historyCount');
    db.ref('loginHistory').limitToLast(300).on('value', (snapshot)=>{
      const data = snapshot.val() || {};
      const entries = Object.values(data)
        .filter(e => e && e.name)
        .sort((a,b) => (b.timestamp||0) - (a.timestamp||0));
      historyCount.textContent = entries.length;
      if(entries.length === 0){
        historyList.innerHTML = '<div class="history-empty">Belum ada riwayat login.</div>';
        return;
      }
      historyList.innerHTML = entries.map(e=>{
        const d = e.timestamp ? new Date(e.timestamp) : null;
        const timeStr = d ? d.toLocaleString('id-ID', { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' }) : '-';
        const metaParts = [];
        if(e.device) metaParts.push(`📱 ${escapeHtml(e.device)}`);
        if(e.location) metaParts.push(`📍 ${escapeHtml(e.location)}`);
        const metaStr = metaParts.length ? `<div class="hmeta">${metaParts.join(' · ')}</div>` : '';
        return `<div class="history-item"><div class="history-item-top"><span class="hname">👤 ${escapeHtml(e.name)}</span><span class="htime">${timeStr}</span></div>${metaStr}</div>`;
      }).join('');
    });
    document.getElementById('clearHistoryBtn').onclick = ()=>{
      if(confirm('Hapus semua riwayat login? Tindakan ini tidak bisa dibatalkan.')){
        db.ref('loginHistory').remove();
      }
    };

    /* ---------------- JADWAL OTOMATIS ---------------- */
    const schedOffBtn = document.getElementById('schedOffBtn');
    const schedOnBtn = document.getElementById('schedOnBtn');
    const schedOpenAt = document.getElementById('schedOpenAt');
    const schedCloseAt = document.getElementById('schedCloseAt');
    const saveSchedBtn = document.getElementById('saveSchedBtn');
    const savedSchedMsg = document.getElementById('savedSchedMsg');
    let localSchedEnabled = false;
    function setSchedUI(isOn){
      localSchedEnabled = isOn;
      schedOffBtn.classList.toggle('on', !isOn);
      schedOnBtn.classList.toggle('on', isOn);
    }
    schedOffBtn.addEventListener('click', ()=> setSchedUI(false));
    schedOnBtn.addEventListener('click', ()=> setSchedUI(true));
    function toLocalInputValue(iso){
      if(!iso) return '';
      const d = new Date(iso);
      const pad = (n)=> String(n).padStart(2,'0');
      return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }
    let firstSchedLoad = true;
    db.ref('settings/schedule').on('value', (snapshot)=>{
      const val = snapshot.val() || {};
      if(firstSchedLoad){
        firstSchedLoad = false;
        setSchedUI(!!val.enabled);
        schedOpenAt.value = toLocalInputValue(val.openAt);
        schedCloseAt.value = toLocalInputValue(val.closeAt);
      }
    });
    saveSchedBtn.addEventListener('click', ()=>{
      saveSchedBtn.disabled = true;
      const cfg = {
        enabled: localSchedEnabled,
        openAt: schedOpenAt.value ? new Date(schedOpenAt.value).toISOString() : null,
        closeAt: schedCloseAt.value ? new Date(schedCloseAt.value).toISOString() : null
      };
      db.ref('settings/schedule').set(cfg).then(()=>{
        savedSchedMsg.style.display = 'block';
        setTimeout(()=>{ savedSchedMsg.style.display = 'none'; }, 2500);
      }).catch((err)=> alert('Gagal menyimpan jadwal: ' + err.message))
        .finally(()=>{ saveSchedBtn.disabled = false; });
    });

    /* ---------------- WARNA/TEMA ---------------- */
    const accentColorInput = document.getElementById('accentColorInput');
    db.ref('settings/accentColor').once('value').then((snap)=>{
      if(snap.val()) accentColorInput.value = snap.val();
    });
    document.getElementById('saveAccentBtn').onclick = ()=>{
      db.ref('settings/accentColor').set(accentColorInput.value);
    };
    document.getElementById('resetAccentBtn').onclick = ()=>{
      db.ref('settings/accentColor').remove();
    };

    /* ---------------- STATISTIK SOAL ---------------- */
    let questionStatsCache = [];
    db.ref('questionStats').on('value', (snapshot)=>{
      const data = snapshot.val() || {};
      const arr = Object.entries(data).map(([key,v])=>({
        key, idText: v.idText || key, enText: v.enText || '', tag: v.tag || '',
        wrong: v.wrong || 0, correct: v.correct || 0
      }));
      arr.sort((a,b)=> b.wrong - a.wrong);
      questionStatsCache = arr;
      const listEl = document.getElementById('questionStatsList');
      const top = arr.filter(x=>x.wrong > 0).slice(0, 15);
      if(!listEl) return;
      if(top.length === 0){
        listEl.innerHTML = '<div class="lb-empty">Belum ada data jawaban salah.</div>';
        return;
      }
      listEl.innerHTML = top.map((x,i)=>{
        const total = x.wrong + x.correct;
        const rate = total > 0 ? Math.round((x.wrong/total)*100) : 0;
        return `<div class="stat-row-item"><div class="stat-row-top"><span>${i+1}. ${escapeHtml(x.idText)} → ${escapeHtml(x.enText)}</span><span class="wrong-tag">${x.wrong}x salah</span></div><div class="stat-row-sub">${escapeHtml(x.tag)} · ${rate}% salah dari ${total} percobaan</div></div>`;
      }).join('');
    });
    document.getElementById('resetStatsBtn').addEventListener('click', ()=>{
      if(confirm('Yakin mau hapus SEMUA statistik soal (data benar/salah)? Tindakan ini tidak bisa dibatalkan.')){
        db.ref('questionStats').remove();
      }
    });

    /* ---------------- EXPORT DATA ---------------- */
    document.getElementById('exportLoginBtn').onclick = ()=>{
      db.ref('loginHistory').once('value').then((snapshot)=>{
        const data = snapshot.val() || {};
        const rows = Object.values(data).filter(e=>e && e.name).map(e=>({
          nama: e.name, waktu: e.timestamp ? new Date(e.timestamp).toLocaleString('id-ID') : '',
          perangkat: e.device || '', lokasi: e.location || ''
        }));
        downloadCsv('riwayat-login.csv', toCsv(rows, ['nama','waktu','perangkat','lokasi']));
      });
    };
    document.getElementById('exportScoresBtn').onclick = ()=>{
      db.ref('examScores').once('value').then((snapshot)=>{
        const data = snapshot.val() || {};
        const rows = Object.values(data).filter(e=>e && e.name).map(e=>({
          nama: e.name, skor: e.score, total: e.total,
          durasi_detik: e.durationMs ? Math.round(e.durationMs/1000) : '',
          selesai: e.finishedAt ? new Date(e.finishedAt).toLocaleString('id-ID') : ''
        }));
        downloadCsv('skor-ujian.csv', toCsv(rows, ['nama','skor','total','durasi_detik','selesai']));
      });
    };
    document.getElementById('exportFeedbackBtn').onclick = ()=>{
      db.ref('feedback').once('value').then((snapshot)=>{
        const data = snapshot.val() || {};
        const rows = Object.values(data).filter(e=>e && e.message).map(e=>({
          nama: e.name || 'Anonim', pesan: e.message,
          waktu: e.timestamp ? new Date(e.timestamp).toLocaleString('id-ID') : ''
        }));
        downloadCsv('masukan-peserta.csv', toCsv(rows, ['nama','pesan','waktu']));
      });
    };
    document.getElementById('exportStatsBtn').onclick = ()=>{
      const rows = questionStatsCache.map(x=>({
        soal_id: x.idText, jawaban_en: x.enText, tag: x.tag, benar: x.correct, salah: x.wrong
      }));
      downloadCsv('statistik-soal.csv', toCsv(rows, ['soal_id','jawaban_en','tag','benar','salah']));
    };

    /* ---------------- SEDANG ONLINE (PRESENCE) — hapus manual kalau nyangkut ---------------- */
    function renderPresenceAdminList(){
      db.ref('presence').on('value', (snapshot)=>{
        const data = snapshot.val() || {};
        const listEl = document.getElementById('presenceAdminList');
        if(!listEl) return;
        const entries = Object.entries(data).sort((a,b)=> (b[1].updatedAt||0) - (a[1].updatedAt||0));
        if(entries.length === 0){
          listEl.innerHTML = '<div class="history-empty">Tidak ada yang online.</div>';
          return;
        }
        const now = Date.now();
        listEl.innerHTML = entries.map(([key, u])=>{
          const secsAgo = u.updatedAt ? Math.max(0, Math.round((now - u.updatedAt)/1000)) : '?';
          const statusLabel = { idle: 'Idle', in_progress: 'Mengerjakan', done: 'Selesai' }[u.status] || 'Idle';
          return `<div class="banned-item"><span>👤 ${escapeHtml(u.name || '(tanpa nama)')} <span style="opacity:0.6;font-weight:600;">· ${statusLabel} · update ${secsAgo}s lalu</span></span><button class="small-btn ban" data-presence-key="${key}">Hapus</button></div>`;
        }).join('');
        listEl.querySelectorAll('[data-presence-key]').forEach(btn=>{
          btn.onclick = ()=>{
            db.ref('presence/' + btn.dataset.presenceKey).remove();
          };
        });
      });
    }
    renderPresenceAdminList();
    document.getElementById('clearAllPresenceBtn').onclick = ()=>{
      if(!confirm('Hapus semua data presence (semua yang lagi kelihatan online)?')) return;
      db.ref('presence').remove();
    };

    /* ---------------- KELOLA PESERTA (BAN/BLOKIR) ---------------- */
    function renderParticipantList(){
      Promise.all([
        db.ref('loginHistory').limitToLast(500).once('value'),
        db.ref('bannedUsers').once('value'),
        db.ref('bannedDevices').once('value')
      ]).then(([histSnap, banSnap, banDevSnap])=>{
        const hist = histSnap.val() || {};
        const bans = banSnap.val() || {};
        const banDevs = banDevSnap.val() || {};
        const byName = {};
        Object.values(hist).forEach(e=>{
          if(!e || !e.name) return;
          const key = sanitizeNameForKey(e.name);
          if(!byName[key]){ byName[key] = { name: e.name, timestamp: e.timestamp, key, deviceIds: new Set() }; }
          if((e.timestamp||0) > (byName[key].timestamp||0)){
            byName[key].timestamp = e.timestamp;
            byName[key].name = e.name;
          }
          if(e.deviceId){ byName[key].deviceIds.add(e.deviceId); }
        });
        const list = Object.values(byName).sort((a,b)=> a.name.localeCompare(b.name));
        const listEl = document.getElementById('participantList');
        if(!listEl) return;
        if(list.length === 0){
          listEl.innerHTML = '<div class="history-empty">Belum ada peserta yang login.</div>';
          return;
        }
        listEl.innerHTML = list.map(p=>{
          const deviceIdsArr = Array.from(p.deviceIds);
          const isBanned = !!bans[p.key] || deviceIdsArr.some(id=> !!banDevs[id]);
          return `<div class="banned-item"><span>${isBanned ? '🚫' : '👤'} ${escapeHtml(p.name)}</span><button class="small-btn ${isBanned ? 'unban' : 'ban'}" data-key="${p.key}" data-name="${escapeHtml(p.name)}" data-deviceids='${JSON.stringify(deviceIdsArr)}' data-action="${isBanned ? 'unban' : 'ban'}">${isBanned ? 'Buka Blokir' : 'Blokir'}</button></div>`;
        }).join('');
        listEl.querySelectorAll('.small-btn').forEach(btn=>{
          btn.onclick = ()=>{
            const key = btn.dataset.key;
            const name = btn.dataset.name;
            let deviceIds = [];
            try{ deviceIds = JSON.parse(btn.dataset.deviceids || '[]'); }catch(e){}
            const updates = {};
            if(btn.dataset.action === 'ban'){
              updates['bannedUsers/' + key] = { name, bannedAt: firebase.database.ServerValue.TIMESTAMP, reason: '' };
              deviceIds.forEach(id=>{ updates['bannedDevices/' + id] = { name, bannedAt: firebase.database.ServerValue.TIMESTAMP, reason: '' }; });
            } else {
              updates['bannedUsers/' + key] = null;
              deviceIds.forEach(id=>{ updates['bannedDevices/' + id] = null; });
            }
            db.ref().update(updates).then(renderParticipantList);
          };
        });
      });
    }
    renderParticipantList();
    document.getElementById('manualBanBtn').onclick = ()=>{
      const nameInput = document.getElementById('manualBanName');
      const reasonInput = document.getElementById('manualBanReason');
      const name = nameInput.value.trim();
      if(!name){ nameInput.focus(); return; }
      const key = sanitizeNameForKey(name);
      const reason = reasonInput.value.trim();
      db.ref('loginHistory').limitToLast(500).once('value').then((snapshot)=>{
        const hist = snapshot.val() || {};
        const deviceIds = new Set();
        Object.values(hist).forEach(e=>{
          if(e && e.name && sanitizeNameForKey(e.name) === key && e.deviceId){ deviceIds.add(e.deviceId); }
        });
        const updates = {};
        updates['bannedUsers/' + key] = { name, bannedAt: firebase.database.ServerValue.TIMESTAMP, reason: reason };
        deviceIds.forEach(id=>{ updates['bannedDevices/' + id] = { name, bannedAt: firebase.database.ServerValue.TIMESTAMP, reason: reason }; });
        return db.ref().update(updates);
      }).then(()=>{
        nameInput.value = ''; reasonInput.value = '';
        renderParticipantList();
      });
    };
  }

  function renderAdminPanel(){
    logoutBtn.style.display = 'block';
    feedbackLink.style.display = 'block';
    db.ref('settings/gateOpen').on('value', (snapshot)=>{
      const val = snapshot.val();
      const isOpen = (val === false) ? false : true;
      renderGate(isOpen);
    });
    db.ref('feedback').on('value', (snapshot)=>{
      const data = snapshot.val() || {};
      const unread = Object.values(data).filter(e=> e && e.message && e.read === false).length;
      feedbackLink.innerHTML = unread > 0
        ? `💬 Lihat Masukan Peserta <span class="feedback-badge">${unread} baru</span> →`
        : `💬 Lihat Masukan Peserta →`;
    });
    renderExtraSections();
  }

  logoutBtn.onclick = ()=>{ auth.signOut(); };

  auth.onAuthStateChanged((user)=>{
    if(user){
      renderAdminPanel();
    } else {
      renderLoginForm();
    }
  });
</script>
</body>
</html>
