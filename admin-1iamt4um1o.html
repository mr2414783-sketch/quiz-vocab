<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Rekap Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#241B12;
    --panel:#FFF9EC;
    --red:#E23F35;
    --red-dim:#B23A2E;
    --gold:#F2B705;
    --green:#3F9142;
    --line: rgba(36,27,18,0.14);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:#FDE9A8;color:var(--ink);font-family:'Nunito',sans-serif;
    min-height:100vh;padding:24px 14px;
  }
  .board{width:100%;max-width:480px;margin:0 auto;}
  .header{
    background:var(--ink);border-radius:16px 16px 0 0;padding:18px 22px;
  }
  .header .eyebrow{font-size:11px;letter-spacing:0.18em;color:var(--gold);text-transform:uppercase;font-weight:700;}
  .header .title{font-size:20px;font-weight:800;color:#FFF9EC;margin-top:2px;}
  .card{
    background:var(--panel);border:1px solid var(--line);padding:26px 22px;text-align:center;
  }
  .status-pill{
    display:inline-block;font-size:12px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;
    padding:8px 18px;border-radius:100px;margin-bottom:18px;
  }
  .status-pill.open{background:rgba(63,145,66,0.15);color:var(--green);}
  .status-pill.closed{background:rgba(226,63,53,0.15);color:var(--red);}
  h1{font-size:19px;font-weight:800;margin:0 0 8px;}
  p{font-size:13.5px;color:var(--red-dim);font-weight:600;line-height:1.6;margin:0 0 18px;}
  .btn{
    font-weight:800;letter-spacing:0.04em;text-transform:uppercase;font-size:14px;
    border:none;padding:15px 28px;border-radius:10px;cursor:pointer;width:100%;
    transition:opacity .15s, transform .1s;
  }
  .btn:active{transform:scale(0.98);}
  .btn.close-btn{background:var(--red);color:#FFF9EC;}
  .btn.open-btn{background:var(--green);color:#FFF9EC;}
  .btn:hover{opacity:0.9;}
  .footer-note{
    background:var(--ink);color:rgba(255,249,236,0.55);font-size:11px;text-align:center;
    padding:12px 18px;border-radius:0 0 16px 16px;font-weight:600;
  }
  .loading{font-size:13px;color:var(--red-dim);font-weight:700;}

  .section-card{
    background:var(--panel);border:1px solid var(--line);border-top:none;padding:22px;text-align:left;
  }
  .section-title{font-size:12.5px;font-weight:800;color:var(--ink);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:14px;}
  .exam-toggle-row{display:flex;gap:8px;margin-bottom:16px;}
  .exam-toggle-btn{
    flex:1;padding:12px;border:2px solid var(--line);border-radius:10px;background:#fff;
    font-family:'Nunito',sans-serif;font-weight:800;font-size:13px;cursor:pointer;color:var(--ink);
  }
  .exam-toggle-btn.selected-off{border-color:var(--green);background:rgba(63,145,66,0.1);color:var(--green);}
  .exam-toggle-btn.selected-on{border-color:var(--red-dim);background:rgba(226,63,53,0.1);color:var(--red-dim);}
  .field-label{font-size:11px;font-weight:800;color:#8a7a5c;text-transform:uppercase;margin:14px 0 6px;letter-spacing:0.4px;}
  .select-row{display:flex;gap:8px;}
  select{
    flex:1;padding:10px;border:2px solid var(--line);border-radius:8px;font-family:'Nunito',sans-serif;
    font-weight:700;font-size:13.5px;color:var(--ink);background:#fff;
  }
  .save-exam-btn{
    width:100%;padding:13px;border:none;border-radius:10px;background:var(--ink);color:#FFF9EC;
    font-family:'Baloo 2',sans-serif;font-weight:700;font-size:14.5px;cursor:pointer;margin-top:16px;
  }
  .save-exam-btn:disabled{opacity:0.5;}
  .saved-msg{font-size:11.5px;color:var(--green);font-weight:800;margin-top:8px;display:none;text-align:center;}
  .current-cfg{
    font-size:12px;color:#6b5c42;background:#FFF3D6;border-radius:8px;padding:10px 12px;margin-bottom:16px;
    line-height:1.6;font-weight:700;
  }

  .lb-row{
    background:#FFF3D6;border-radius:8px;padding:9px 12px;font-size:13px;font-weight:700;
    margin-bottom:6px;display:flex;justify-content:space-between;
  }
  .lb-empty{font-size:12.5px;color:#8a7a5c;font-weight:600;}
  .reset-score-btn{
    width:100%;padding:12px;border:none;border-radius:10px;background:var(--red-dim);color:#FFF9EC;
    font-family:'Baloo 2',sans-serif;font-weight:700;font-size:13.5px;cursor:pointer;margin-top:14px;
  }
</style>
</head>
<body>

<div class="board">
  <div class="header">
    <div class="eyebrow">LC Language Center · Basic Camp</div>
    <div class="title">🔒 Panel Admin</div>
  </div>
  <div class="card" id="card">
    <div class="loading">Memuat status...</div>
  </div>

  <div class="section-card">
    <div class="section-title">🎓 Mode Ujian</div>
    <div class="exam-toggle-row">
      <button class="exam-toggle-btn" id="examOffBtn" type="button">Mode Biasa</button>
      <button class="exam-toggle-btn" id="examOnBtn" type="button">Mode Ujian</button>
    </div>

    <div class="field-label">Cakupan Soal</div>
    <div class="select-row">
      <select id="scopeSelect">
        <option value="all">Semua Hari (32 hari)</option>
        <option value="day">Per Hari</option>
      </select>
    </div>

    <div id="dayFields" style="display:none;">
      <div class="field-label">Bulan &amp; Hari</div>
      <div class="select-row">
        <select id="monthSelect">
          <option value="1">Bulan 1</option>
          <option value="2">Bulan 2</option>
        </select>
        <select id="daySelect"></select>
      </div>
    </div>

    <div class="field-label">Tipe Soal</div>
    <div class="select-row">
      <select id="typeSelect">
        <option value="mc">Pilihan Ganda saja</option>
        <option value="essay">Esai saja</option>
        <option value="both">Campuran (PG &amp; Esai)</option>
      </select>
    </div>

    <button class="save-exam-btn" id="saveExamBtn">Simpan Pengaturan Ujian</button>
    <div class="saved-msg" id="savedMsg">✓ Tersimpan &amp; langsung aktif</div>
  </div>

  <div class="section-card" style="border-top:1px dashed var(--line);">
    <div class="section-title">🏆 Papan Skor Ujian</div>
    <div id="leaderboard"><div class="lb-empty">Memuat...</div></div>
    <button class="reset-score-btn" id="resetScoresBtn">🗑 Hapus Semua Skor</button>
  </div>

  <div class="footer-note">Halaman ini rahasia — jangan bagikan link ke murid.</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyDPaWjx_MxF6Q8OT_P7FCn9h6MyfADnq8g",
    authDomain: "quizz-7bac3.firebaseapp.com",
    databaseURL: "https://quizz-7bac3-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "quizz-7bac3",
    storageBucket: "quizz-7bac3.firebasestorage.app",
    messagingSenderId: "105522344136",
    appId: "1:105522344136:web:3fde8250987b74ad9ff5fd"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  const card = document.getElementById('card');

  /* ---------------- GATE (buka/tutup akses) ---------------- */
  function renderGate(isOpen){
    card.innerHTML = `
      <div class="status-pill ${isOpen ? 'open' : 'closed'}">${isOpen ? '🟢 Sedang Terbuka' : '🔴 Sedang Ditutup'}</div>
      <h1>${isOpen ? 'Soal saat ini bisa dikerjakan murid' : 'Soal saat ini TIDAK bisa dikerjakan murid'}</h1>
      <p>${isOpen ? 'Tap tombol di bawah untuk menutup akses soal buat semua murid.' : 'Tap tombol di bawah untuk membuka akses soal buat semua murid.'}</p>
      <button class="btn ${isOpen ? 'close-btn' : 'open-btn'}" id="toggleBtn">${isOpen ? '🔒 Tutup Soal' : '🔓 Buka Soal'}</button>
    `;
    document.getElementById('toggleBtn').onclick = ()=>{
      db.ref('settings/gateOpen').set(!isOpen);
    };
  }

  db.ref('settings/gateOpen').on('value', (snapshot)=>{
    const val = snapshot.val();
    const isOpen = (val === false) ? false : true;
    renderGate(isOpen);
  });

  /* ---------------- EXAM MODE CONFIG ---------------- */
  const examOffBtn = document.getElementById('examOffBtn');
  const examOnBtn = document.getElementById('examOnBtn');
  const scopeSelect = document.getElementById('scopeSelect');
  const dayFields = document.getElementById('dayFields');
  const monthSelect = document.getElementById('monthSelect');
  const daySelect = document.getElementById('daySelect');
  const typeSelect = document.getElementById('typeSelect');
  const saveExamBtn = document.getElementById('saveExamBtn');
  const savedMsg = document.getElementById('savedMsg');

  function populateDaySelect(){
    daySelect.innerHTML = '';
    for(let d=1; d<=16; d++){
      const opt = document.createElement('option');
      opt.value = d;
      opt.textContent = `Day ${d}`;
      daySelect.appendChild(opt);
    }
  }
  populateDaySelect();

  let localExamMode = false;

  function setExamModeUI(isOn){
    localExamMode = isOn;
    examOffBtn.classList.toggle('selected-off', !isOn);
    examOnBtn.classList.toggle('selected-on', isOn);
  }

  examOffBtn.addEventListener('click', ()=> setExamModeUI(false));
  examOnBtn.addEventListener('click', ()=> setExamModeUI(true));

  scopeSelect.addEventListener('change', ()=>{
    dayFields.style.display = scopeSelect.value === 'day' ? 'block' : 'none';
  });

  let firstConfigLoad = true;
  db.ref('settings').on('value', (snapshot)=>{
    const val = snapshot.val() || {};
    if(firstConfigLoad){
      firstConfigLoad = false;
      setExamModeUI(!!val.examMode);
      const cfg = val.examConfig || { scope:'all', month:1, day:1, types:'mc' };
      scopeSelect.value = cfg.scope || 'all';
      dayFields.style.display = scopeSelect.value === 'day' ? 'block' : 'none';
      monthSelect.value = String(cfg.month || 1);
      daySelect.value = String(cfg.day || 1);
      typeSelect.value = cfg.types || 'mc';
    }
  });

  saveExamBtn.addEventListener('click', ()=>{
    saveExamBtn.disabled = true;
    const cfg = {
      scope: scopeSelect.value,
      month: parseInt(monthSelect.value, 10),
      day: parseInt(daySelect.value, 10),
      types: typeSelect.value
    };
    Promise.all([
      db.ref('settings/examMode').set(localExamMode),
      db.ref('settings/examConfig').set(cfg)
    ]).then(()=>{
      savedMsg.style.display = 'block';
      setTimeout(()=>{ savedMsg.style.display = 'none'; }, 2500);
    }).finally(()=>{
      saveExamBtn.disabled = false;
    });
  });

  /* ---------------- LEADERBOARD ---------------- */
  const leaderboardEl = document.getElementById('leaderboard');
  db.ref('examScores').on('value', (snapshot)=>{
    const data = snapshot.val() || {};
    const arr = Object.values(data).sort((a,b)=> b.score - a.score);
    if(arr.length === 0){
      leaderboardEl.innerHTML = '<div class="lb-empty">Belum ada yang menyelesaikan ujian.</div>';
      return;
    }
    leaderboardEl.innerHTML = arr.map((u,i)=>`<div class="lb-row"><span>${i+1}. ${u.name}</span><span>${u.score}/${u.total}</span></div>`).join('');
  });

  document.getElementById('resetScoresBtn').addEventListener('click', ()=>{
    if(confirm('Yakin mau hapus SEMUA skor ujian? Tindakan ini tidak bisa dibatalkan.')){
      db.ref('examScores').remove();
    }
  });
</script>
</body>
</html>
