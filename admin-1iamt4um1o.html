<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Rekap Quiz</title>
<link rel="manifest" href="./manifest-admin.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#241B12;
    --panel:#FFF9EC;
    --red:#E23F35;
    --red-dim:#B23A2E;
    --gold:#F2B705;
    --green:#3F9142;
    --line: rgba(36,27,18,0.14);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}

  /* ---- floating utility bar (install to home screen) ---- */
  .util-bar{
    position:fixed; top:10px; right:10px; z-index:9999;
    display:flex; gap:6px;
  }
  .util-btn{
    background:var(--ink); color:#FFF9EC; border:1px solid rgba(255,249,236,0.25);
    width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:15px;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 8px rgba(0,0,0,0.25);
  }
  .util-btn:active{opacity:0.8;}
  .install-modal-bg{
    position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:10000;
    display:flex;align-items:center;justify-content:center;padding:20px;
  }
  .install-modal{
    background:var(--panel);border-radius:16px;padding:22px;max-width:340px;width:100%;text-align:center;
  }
  .install-modal h2{font-size:16px;margin:0 0 8px;}
  .install-modal p{font-size:13px;color:var(--red-dim);font-weight:600;line-height:1.6;margin:0 0 14px;}
  body{
    background:#FDE9A8;color:var(--ink);font-family:'Nunito',sans-serif;
    min-height:100vh;padding:64px 14px 24px;
  }
  .board{width:100%;max-width:480px;margin:0 auto;}
  .header{
    background:var(--ink);border-radius:16px 16px 0 0;padding:18px 22px;
    display:flex;align-items:center;justify-content:space-between;gap:10px;
  }
  .header .eyebrow{font-size:11px;letter-spacing:0.18em;color:var(--gold);text-transform:uppercase;font-weight:700;}
  .header .title{font-size:20px;font-weight:800;color:#FFF9EC;margin-top:2px;}
  .logout-btn{
    background:transparent;border:1px solid rgba(255,249,236,0.3);color:#FFF9EC;
    font-size:11px;font-weight:800;letter-spacing:0.04em;text-transform:uppercase;
    padding:8px 12px;border-radius:8px;cursor:pointer;flex-shrink:0;
  }
  .logout-btn:active{opacity:0.7;}
  .feedback-link{
    display:block;background:var(--panel);border:1px solid var(--line);border-top:none;
    text-align:center;padding:14px 18px;font-size:13.5px;font-weight:800;color:var(--ink);
    text-decoration:none;
  }
  .feedback-link:active{opacity:0.75;}
  .card{
    background:var(--panel);border:1px solid var(--line);padding:26px 22px;text-align:center;
  }
  .status-pill{
    display:inline-block;font-size:12px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;
    padding:8px 18px;border-radius:100px;margin-bottom:18px;
  }
  .status-pill.open{background:rgba(63,145,66,0.15);color:var(--green);}
  .status-pill.closed{background:rgba(226,63,53,0.15);color:var(--red);}
  h1{font-size:19px;font-weight:800;margin:0 0 8px;}
  p{font-size:13.5px;color:var(--red-dim);font-weight:600;line-height:1.6;margin:0 0 18px;}
  .btn{
    font-weight:800;letter-spacing:0.04em;text-transform:uppercase;font-size:14px;
    border:none;padding:15px 28px;border-radius:10px;cursor:pointer;width:100%;
    transition:opacity .15s, transform .1s;
  }
  .btn:active{transform:scale(0.98);}
  .btn.close-btn{background:var(--red);color:#FFF9EC;}
  .btn.open-btn{background:var(--green);color:#FFF9EC;}
  .btn.login-btn{background:var(--ink);color:#FFF9EC;margin-top:4px;}
  .btn:hover{opacity:0.9;}
  .btn:disabled{opacity:0.5;cursor:default;}
  .footer-note{
    background:var(--ink);color:rgba(255,249,236,0.55);font-size:11px;text-align:center;
    padding:12px 18px;border-radius:0 0 16px 16px;font-weight:600;
  }
  .loading{font-size:13px;color:var(--red-dim);font-weight:700;}
  .login-input{
    width:100%;background:#FFFFFF;border:1px solid var(--line);color:var(--ink);
    padding:13px 16px;border-radius:10px;font-size:15px;font-family:'Nunito',sans-serif;
    font-weight:600;margin-bottom:10px;text-align:left;
  }
  .login-input:focus{outline:none;border-color:var(--gold);}
  .login-error{
    font-size:12.5px;color:var(--red);font-weight:700;margin:-4px 0 14px;text-align:left;min-height:16px;
  }

  .section-card{
    background:var(--panel);border:1px solid var(--line);border-top:none;padding:22px;text-align:left;
  }
  .section-title{font-size:12.5px;font-weight:800;color:var(--ink);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:14px;}
  .exam-toggle-row{display:flex;gap:8px;margin-bottom:16px;}
  .exam-toggle-btn{
    flex:1;padding:12px;border:2px solid var(--line);border-radius:10px;background:#fff;
    font-family:'Nunito',sans-serif;font-weight:800;font-size:13px;cursor:pointer;color:var(--ink);
  }
  .exam-toggle-btn.selected-off{border-color:var(--green);background:rgba(63,145,66,0.1);color:var(--green);}
  .exam-toggle-btn.selected-on{border-color:var(--red-dim);background:rgba(226,63,53,0.1);color:var(--red-dim);}
  .field-label{font-size:11px;font-weight:800;color:#8a7a5c;text-transform:uppercase;margin:14px 0 6px;letter-spacing:0.4px;}
  .select-row{display:flex;gap:8px;}
  select{
    flex:1;padding:10px;border:2px solid var(--line);border-radius:8px;font-family:'Nunito',sans-serif;
    font-weight:700;font-size:13.5px;color:var(--ink);background:#fff;
  }
  .save-exam-btn{
    width:100%;padding:13px;border:none;border-radius:10px;background:var(--ink);color:#FFF9EC;
    font-family:'Baloo 2',sans-serif;font-weight:700;font-size:14.5px;cursor:pointer;margin-top:16px;
  }
  .save-exam-btn:disabled{opacity:0.5;}
  .saved-msg{font-size:11.5px;color:var(--green);font-weight:800;margin-top:8px;display:none;text-align:center;}

  .lb-row{
    background:#FFF3D6;border-radius:8px;padding:9px 12px;font-size:13px;font-weight:700;
    margin-bottom:6px;display:flex;justify-content:space-between;
  }
  .lb-empty{font-size:12.5px;color:#8a7a5c;font-weight:600;}
  .reset-score-btn{
    width:100%;padding:12px;border:none;border-radius:10px;background:var(--red-dim);color:#FFF9EC;
    font-family:'Baloo 2',sans-serif;font-weight:700;font-size:13.5px;cursor:pointer;margin-top:14px;
  }

  .history-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .history-head h2{font-size:12.5px;font-weight:800;margin:0;text-transform:uppercase;letter-spacing:0.5px;}
  .history-count{font-size:11px;font-weight:800;color:var(--red-dim);background:rgba(226,63,53,0.1);padding:4px 10px;border-radius:100px;}
  .history-list{
    max-height:300px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding-right:2px;
  }
  .history-item{
    background:#FFFFFF;border:1px solid var(--line);border-radius:10px;
    padding:10px 12px;display:flex;flex-direction:column;gap:4px;
  }
  .history-item-top{display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .history-item .hname{font-size:13px;font-weight:800;color:var(--ink);}
  .history-item .htime{font-size:11px;font-weight:700;color:rgba(36,27,18,0.55);white-space:nowrap;}
  .history-item .hmeta{font-size:11px;font-weight:700;color:rgba(36,27,18,0.5);}
  .history-empty{font-size:12.5px;color:rgba(36,27,18,0.55);font-weight:600;padding:10px 0;}
  .clear-history-btn{
    font-size:11px;font-weight:800;letter-spacing:0.02em;background:transparent;color:var(--red-dim);
    border:1px solid var(--line);padding:8px 12px;border-radius:100px;cursor:pointer;margin-top:14px;width:100%;
  }
  .feedback-badge{
    display:inline-block;background:var(--red);color:#fff;font-size:11px;font-weight:800;
    border-radius:100px;padding:2px 8px;margin-left:6px;
  }
  .nav-menu-item-dot{
    display:none;background:var(--red);color:#fff;font-size:10.5px;font-weight:800;
    border-radius:100px;padding:1px 7px;margin-left:6px;vertical-align:middle;
  }
  .hamburger-dot{
    display:none;position:absolute;top:-3px;right:-3px;width:12px;height:12px;border-radius:50%;
    background:var(--red);border:2px solid var(--panel,#FFF9EC);
  }
  .list-unread-dot{
    display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--red);margin-left:5px;vertical-align:middle;
  }
  .stat-row-item{
    background:#FFFFFF;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:6px;
  }
  .stat-row-top{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;font-weight:800;}
  .stat-row-sub{font-size:11px;color:rgba(36,27,18,0.55);font-weight:600;margin-top:2px;}
  .wrong-tag{color:var(--red-dim);}
  .schedule-row{display:flex;flex-direction:column;gap:8px;margin-top:10px;}
  .schedule-row label{font-size:11px;font-weight:800;color:#8a7a5c;text-transform:uppercase;letter-spacing:0.4px;}
  input[type="datetime-local"], input[type="color"], input[type="text"].plain-input, textarea.plain-input{
    width:100%;padding:10px;border:2px solid var(--line);border-radius:8px;font-family:'Nunito',sans-serif;
    font-weight:700;font-size:13px;color:var(--ink);background:#fff;
  }
  textarea.plain-input{resize:vertical;}
  .toggle-row{display:flex;gap:8px;margin:10px 0;}
  .toggle-btn{
    flex:1;padding:10px;border:2px solid var(--line);border-radius:10px;background:#fff;
    font-family:'Nunito',sans-serif;font-weight:800;font-size:12.5px;cursor:pointer;color:var(--ink);
  }
  .toggle-btn.on{border-color:var(--green);background:rgba(63,145,66,0.1);color:var(--green);}
  .banned-item{
    background:#FFFFFF;border:1px solid var(--line);border-radius:10px;padding:9px 12px;
    display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:8px;
  }
  .small-btn{
    font-size:11px;font-weight:800;border:none;border-radius:8px;padding:7px 10px;cursor:pointer;flex-shrink:0;
  }
  .small-btn.ban{background:var(--red);color:#fff;}
  .small-btn.unban{background:var(--green);color:#fff;}
  .export-btn{
    width:100%;padding:12px;border:none;border-radius:10px;background:var(--ink);color:#FFF9EC;
    font-family:'Nunito',sans-serif;font-weight:800;font-size:13px;cursor:pointer;margin-bottom:8px;
  }

  /* ---- hamburger nav menu (pojok kiri atas) ---- */
  .nav-menu-btn{
    position:fixed; top:14px; left:14px; z-index:9999;
    width:38px;height:38px;border-radius:10px;border:none;cursor:pointer;
    background:var(--ink);color:#FFF9EC;font-size:18px;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 8px rgba(0,0,0,0.25);
  }
  .nav-menu-btn:active{opacity:0.8;}
  .nav-menu-bg{
    position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:10000;display:none;
  }
  .nav-menu-bg.open{display:block;}
  .nav-menu-panel{
    position:fixed;top:0;left:0;bottom:0;width:78%;max-width:280px;
    background:var(--panel);box-shadow:2px 0 16px rgba(0,0,0,0.25);
    padding:20px 16px;overflow-y:auto;
  }
  .nav-menu-panel h3{font-size:13px;text-transform:uppercase;letter-spacing:0.5px;margin:0 0 14px;color:var(--ink);}
  .nav-menu-item{
    display:block;width:100%;text-align:left;background:none;border:none;
    padding:12px 10px;font-family:'Nunito',sans-serif;font-weight:700;font-size:13.5px;
    color:var(--ink);cursor:pointer;border-radius:8px;border-bottom:1px solid var(--line);
  }
  .nav-menu-item:active{background:rgba(36,27,18,0.06);}
  .nav-menu-close{
    position:absolute;top:14px;right:14px;background:none;border:none;font-size:18px;cursor:pointer;color:var(--ink);
  }

  /* ---- modal profil peserta ---- */
  .profile-modal-bg{
    position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:10000;
    display:flex;align-items:center;justify-content:center;padding:20px;
  }
  .profile-modal{
    background:var(--panel);border-radius:16px;padding:24px;max-width:320px;width:100%;text-align:center;
  }
  .profile-modal img.pm-avatar, .profile-modal .pm-avatar-fallback{
    width:88px;height:88px;border-radius:50%;object-fit:cover;border:2px solid var(--gold);margin:0 auto 12px;display:block;
  }
  .profile-modal .pm-avatar-fallback{
    background:var(--ink);color:#FFF9EC;display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:34px;
  }
  .profile-modal h2{font-size:17px;margin:0 0 4px;}
  .profile-modal .pm-status{font-size:12px;font-weight:800;color:var(--blue);text-transform:uppercase;letter-spacing:0.4px;margin-bottom:10px;}
  .profile-modal .pm-row{text-align:left;border-top:1px solid var(--line);padding:10px 0;}
  .profile-modal .pm-row .pm-label{font-size:10.5px;font-weight:800;color:#8a7a5c;text-transform:uppercase;letter-spacing:0.4px;}
  .profile-modal .pm-row .pm-val{font-size:13px;font-weight:600;color:var(--ink);margin-top:2px;}
  .profile-modal .btn{margin-top:16px;}
</style>
</head>
<body>

  <div class="header">

      <div class="eyebrow">LC Language Center · Basic Camp</div>
      <div class="title">🔒 Panel Admin</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyDPaWjx_MxF6Q8OT_P7FCn9h6MyfADnq8g",
    authDomain: "quizz-7bac3.firebaseapp.com",
    databaseURL: "https://quizz-7bac3-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "quizz-7bac3",
    storageBucket: "quizz-7bac3.firebasestorage.app",
    messagingSenderId: "105522344136",
    appId: "1:105522344136:web:3fde8250987b74ad9ff5fd"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.database();
  const card = document.getElementById('card');
  const extraSections = document.getElementById('extraSections');
  const logoutBtn = document.getElementById('logoutBtn');
  const feedbackLink = document.getElementById('feedbackLink');

  /* ---------------- NOTIFIKASI PESAN MASUK (chat pribadi, obrolan kelas, masukan) ---------------- */
  let notifFeedbackUnread = 0;
  let notifClassChatUnread = 0;
  let notifPrivateChatUnread = 0;
  let notifPrivateChatByKey = {};
  function getSeenTs(storeKey){
    try{ return parseInt(localStorage.getItem(storeKey) || '0', 10); }catch(e){ return 0; }
  }
  function setSeenTs(storeKey, ts){
    try{ localStorage.setItem(storeKey, String(ts || Date.now())); }catch(e){}
  }
  function markClassChatSeen(){
    setSeenTs('adminClassChatSeen', Date.now());
    notifClassChatUnread = 0;
    updateNotifBadges();
  }
  function markPrivateChatSeen(key){
    setSeenTs('adminPcSeen_' + key, Date.now());
    delete notifPrivateChatByKey[key];
    notifPrivateChatUnread = Object.values(notifPrivateChatByKey).reduce((a,b)=> a+b, 0);
    updateNotifBadges();
  }
  function updateNotifBadges(){
    const pesertaBadge = document.getElementById('navPesertaBadge');
    if(pesertaBadge){
      pesertaBadge.style.display = notifPrivateChatUnread > 0 ? 'inline-block' : 'none';
      pesertaBadge.textContent = notifPrivateChatUnread > 0 ? String(notifPrivateChatUnread) : '';
    }
    const classBadge = document.getElementById('navClassChatBadge');
    if(classBadge){
      classBadge.style.display = notifClassChatUnread > 0 ? 'inline-block' : 'none';
      classBadge.textContent = notifClassChatUnread > 0 ? String(notifClassChatUnread) : '';
    }
    const fbBadge = document.getElementById('navFeedbackBadge');
    if(fbBadge){
      fbBadge.style.display = notifFeedbackUnread > 0 ? 'inline-block' : 'none';
      fbBadge.textContent = notifFeedbackUnread > 0 ? String(notifFeedbackUnread) : '';
    }
    const dot = document.getElementById('hamburgerDot');
    if(dot) dot.style.display = (notifPrivateChatUnread + notifClassChatUnread + notifFeedbackUnread) > 0 ? 'block' : 'none';
    if(typeof window.renderFilteredPesertaDirectory === 'function') window.renderFilteredPesertaDirectory();
    if(typeof window.renderParticipantList === 'function') window.renderParticipantList();
  }

  /* ---------------- SERVICE WORKER khusus ADMIN (scope terpisah dari peserta) ---------------- */
  if('serviceWorker' in navigator){
    window.addEventListener('load', ()=>{
      navigator.serviceWorker.register('./sw-admin.js', { scope: './admin-1iamt4um1o.html' }).catch(()=>{});
    });
  }

  /* ---------------- INSTALL TO HOME SCREEN ---------------- */
  const installBtn = document.getElementById('installBtn');
  let deferredInstallPrompt = null;
  function isStandalone(){
    return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  }
  function isIos(){
    return /iphone|ipad|ipod/i.test(navigator.userAgent);
  }
  function showInstallModal(){
    const bg = document.createElement('div');
    bg.className = 'install-modal-bg';
    const isIosDevice = isIos();
    bg.innerHTML = `
      <div class="install-modal">
        <h2>📲 Pasang ke Home Screen</h2>
        <p>${isIosDevice
          ? 'Tap tombol <b>Share/Bagikan</b> di Safari (ikon kotak dengan panah ke atas), lalu pilih <b>"Add to Home Screen" / "Tambah ke Layar Utama"</b>.'
          : 'Tap tombol menu (⋮) di browser kamu, lalu pilih <b>"Add to Home Screen" / "Install App"</b>.'}</p>

  /* ---------------- EXPORT CSV ---------------- */
  function toCsv(rows, headers){
    const esc = (v)=> `"${String(v===undefined||v===null?'':v).replace(/"/g,'""')}"`;
    const lines = [headers.map(esc).join(',')];
    rows.forEach(r=> lines.push(headers.map(h=>esc(r[h])).join(',')));
    return lines.join('\r\n');
  }
  function downloadCsv(filename, csvStr){
    const blob = new Blob(['\uFEFF' + csvStr], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  /* ---------------- GATE (buka/tutup akses) ----------------
     CATATAN BUG LAMA: tombol ini nulis ke 'settings/gateOpen' TANPA .catch() sama sekali,
     jadi kalau write-nya gagal (misal Firebase Rules nolak / lagi offline) admin gak akan
     tahu apa-apa — tombol kelihatan "gak ngefek" padahal sebenarnya errornya senyap.
     Sekarang errornya ditangkap & ditampilkan. Selain itu, kalau Jadwal Otomatis lagi aktif,
     status gabungan yang beneran berlaku buat peserta (bukan cuma nilai mentah gateOpen)
     ditampilkan juga, supaya gak bingung "udah dikunci kok peserta masih bisa masuk". */
  function renderGate(isOpen, schedCfg){
    const schedActive = !!(schedCfg && schedCfg.enabled);
    let effectiveOpen = isOpen;
    if(schedActive){
      const now = Date.now();
      const openAt = schedCfg.openAt ? new Date(schedCfg.openAt).getTime() : null;
      const closeAt = schedCfg.closeAt ? new Date(schedCfg.closeAt).getTime() : null;
      effectiveOpen = true;
      if(openAt && now < openAt) effectiveOpen = false;
      if(closeAt && now >= closeAt) effectiveOpen = false;
    }
    const schedWarning = schedActive ? `
      <div style="background:#fef3c7;border:1px solid #f59e0b;color:#92400e;font-size:11.5px;font-weight:600;border-radius:10px;padding:10px 12px;margin:10px 0;text-align:left;">
        ⚠️ <b>Jadwal Otomatis sedang AKTIF</b> — status buka/tutup buat peserta saat ini ditentukan
        oleh jadwal (bukan tombol manual di bawah). Status sekarang buat peserta:
        <b>${effectiveOpen ? 'TERBUKA' : 'TERTUTUP'}</b>. Kalau mau kunci manual pakai tombol di
        bawah ini beneran langsung berlaku, matikan dulu Jadwal Otomatis di menu ⏰ Jadwal Otomatis.
      </div>` : '';
    card.innerHTML = `
      <div class="status-pill ${isOpen ? 'open' : 'closed'}">${isOpen ? '🟢 Sedang Terbuka' : '🔴 Sedang Ditutup'} (manual)</div>
      <h1>${isOpen ? 'Soal saat ini bisa dikerjakan murid' : 'Soal saat ini TIDAK bisa dikerjakan murid'}</h1>
      <p>${isOpen ? 'Tap tombol di bawah untuk menutup akses soal buat semua murid.' : 'Tap tombol di bawah untuk membuka akses soal buat semua murid.'}</p>
      ${schedWarning}
      <button class="btn ${isOpen ? 'close-btn' : 'open-btn'}" id="toggleBtn">${isOpen ? '🔒 Tutup Soal' : '🔓 Buka Soal'}</button>
      <div id="gateToggleMsg" style="font-size:11.5px;font-weight:700;min-height:16px;margin-top:8px;"></div>
    `;
    document.getElementById('toggleBtn').onclick = ()=>{
      const btn = document.getElementById('toggleBtn');
      const msgEl = document.getElementById('gateToggleMsg');
      btn.disabled = true;
      msgEl.style.color = '';
      msgEl.textContent = 'Menyimpan...';
      db.ref('settings/gateOpen').set(!isOpen).then(()=>{
        msgEl.style.color = 'var(--green, #16a34a)';
        msgEl.textContent = '✓ Tersimpan.';
      }).catch((err)=>{
        btn.disabled = false;
        msgEl.style.color = '#dc2626';
        msgEl.textContent = '✗ Gagal menyimpan (' + (err.code || err.message) + '). Cek koneksi / Firebase Rules, lalu coba lagi.';
      });
    };
  }

    /* leaderboard */
    const RANK_MEDAL = { 0: '🥇', 1: '🥈', 2: '🥉' };
    function formatDuration(ms){
      if(ms === null || ms === undefined) return '-';
      const totalSec = Math.round(ms/1000);
      const m = Math.floor(totalSec/60);
      const s = totalSec%60;
      return m > 0 ? `${m}m ${s}d` : `${s}d`;
    }
    const leaderboardEl = document.getElementById('leaderboard');
    db.ref('examScores').on('value', (snapshot)=>{
      const data = snapshot.val() || {};
      const arr = Object.values(data).filter(u=>u && u.name).sort((a,b)=>{
        if(b.score !== a.score) return b.score - a.score;
        const da = (a.durationMs === null || a.durationMs === undefined) ? Infinity : a.durationMs;
        const db_ = (b.durationMs === null || b.durationMs === undefined) ? Infinity : b.durationMs;
        return da - db_;
      });
      if(arr.length === 0){
        leaderboardEl.innerHTML = '<div class="lb-empty">Belum ada yang menyelesaikan ujian.</div>';
        return;
      }
      leaderboardEl.innerHTML = arr.map((u,i)=>`<div class="lb-row"><span>${RANK_MEDAL[i] || (i+1)+'.'} ${escapeHtml(u.name)}</span><span>${u.score}/${u.total} · ⏱ ${formatDuration(u.durationMs)}</span></div>`).join('');

    /* ---------------- BANK SOAL (KOSAKATA) ---------------- */
    (function(){
      const listEl = document.getElementById('vocabBankList');
      const deletedListEl = document.getElementById('vocabDeletedList');
      const hintEl = document.getElementById('vocabSyncHint');
      const countInfo = document.getElementById('vbCountInfo');
      if(!listEl) return;
      let vbBase = {}, vbOverride = {}, vbDeleted = {}, vbAdded = {};
      let vbBaseLoaded = false;
      let vbVisibleCount = 60;

      function mergedBaseItem(ckey){
        return Object.assign({}, vbBase[ckey] || {}, vbOverride[ckey] || {});
      }
      function getAllVisibleItems(){
        const baseItems = Object.keys(vbBase).filter(k=> !vbDeleted[k]).map(k=> Object.assign({ ckey: k, source: 'base' }, mergedBaseItem(k)));
        const addedItems = Object.keys(vbAdded).map(k=> Object.assign({ ckey: 'add-' + k, source: 'added' }, vbAdded[k] || {}));
        return baseItems.concat(addedItems);
      }

      function renderList(){
        if(!vbBaseLoaded) return;
        const baseCount = Object.keys(vbBase).length;
        hintEl.textContent = baseCount
          ? `✓ Bank soal tersinkron: ${baseCount} kosakata bawaan + ${Object.keys(vbAdded).length} tambahan admin.`
          : '⚠ Bank soal belum disinkronkan dari kode. Buka halaman peserta pakai Admin Bypass, lalu tap tombol hijau "Sinkronkan Bank Soal ke Firebase" yang muncul di pojok bawah — sekali aja.';

        const monthFilter = document.getElementById('vbFilterMonth').value;
        const term = document.getElementById('vbSearchInput').value.trim().toLowerCase();
        let items = getAllVisibleItems();
        if(monthFilter !== 'all') items = items.filter(it=> String(it.month) === monthFilter);
        if(term) items = items.filter(it=> (it.id||'').toLowerCase().includes(term) || (it.en||'').toLowerCase().includes(term) || (it.tag||'').toLowerCase().includes(term));
        items.sort((a,b)=> (a.month - b.month) || (a.tag||'').localeCompare(b.tag||''));

        countInfo.textContent = items.length + ' item ditemukan';
        const showMoreBtn = document.getElementById('vbShowMoreBtn');
        const toShow = items.slice(0, vbVisibleCount);
        showMoreBtn.style.display = items.length > vbVisibleCount ? 'inline-block' : 'none';

        if(toShow.length === 0){
          listEl.innerHTML = '<div class="lb-empty">Gak ada kosakata ditemukan.</div>';
        } else {
          listEl.innerHTML = toShow.map(it => `
            <div class="banned-item" data-vb-key="${escapeHtml(it.ckey)}" style="flex-direction:column;align-items:stretch;gap:6px;">
              <div style="font-size:10.5px;opacity:0.65;">Bulan ${it.month||1}${it.source==='added' ? ' · <b>Tambahan Admin</b>' : ''}</div>
              <input type="text" class="plain-input vb-f-id" value="${escapeHtml(it.id||'')}" placeholder="Teks Indonesia" style="font-size:12.5px;padding:6px 8px;">
              <input type="text" class="plain-input vb-f-en" value="${escapeHtml(it.en||'')}" placeholder="Teks Inggris" style="font-size:12.5px;padding:6px 8px;">
              <div style="display:flex;gap:6px;">
                <input type="text" class="plain-input vb-f-tag" value="${escapeHtml(it.tag||'')}" placeholder="Tag" style="flex:1;font-size:12px;padding:6px 8px;">
                <input type="text" class="plain-input vb-f-ph" value="${escapeHtml(it.ph||'')}" placeholder="Fonetik" style="flex:1;font-size:12px;padding:6px 8px;">
              </div>
              <div style="display:flex;gap:6px;">
                <button class="small-btn vb-save-btn" style="background:var(--blue);color:#fff;flex:1;">💾 Simpan</button>
                <button class="small-btn vb-del-btn" style="background:var(--red-dim);color:#fff;">🗑 Hapus</button>
              </div>
            </div>
          `).join('');

          listEl.querySelectorAll('[data-vb-key]').forEach(row=>{
            const ckey = row.dataset.vbKey;
            const isAdded = ckey.indexOf('add-') === 0;
            const addKey = isAdded ? ckey.slice(4) : null;
            row.querySelector('.vb-save-btn').onclick = ()=>{
              const id = row.querySelector('.vb-f-id').value.trim();
              const en = row.querySelector('.vb-f-en').value.trim();
              const tag = row.querySelector('.vb-f-tag').value.trim();
              const ph = row.querySelector('.vb-f-ph').value.trim();
              if(!id || !en){ alert('Teks Indonesia & Inggris wajib diisi.'); return; }
              const path = isAdded ? ('contentBank/vocabAdded/' + addKey) : ('contentBank/vocabOverride/' + ckey);
              const payload = isAdded ? Object.assign({}, vbAdded[addKey], { id, en, tag, ph }) : { id, en, tag, ph };
              db.ref(path).update(payload).catch((err)=> alert('Gagal menyimpan: ' + err.message));
            };
            row.querySelector('.vb-del-btn').onclick = ()=>{
              if(!confirm('Hapus kosakata ini dari kuis peserta?')) return;
              if(isAdded){
                db.ref('contentBank/vocabAdded/' + addKey).remove().catch((err)=> alert('Gagal menghapus: ' + err.message));
              } else {
                db.ref('contentBank/vocabDeleted/' + ckey).set(true).catch((err)=> alert('Gagal menghapus: ' + err.message));
              }
            };
          });
        }

        const deletedKeys = Object.keys(vbDeleted);
        if(deletedKeys.length === 0){
          deletedListEl.innerHTML = '<div class="lb-empty">Belum ada item yang dihapus.</div>';
        } else {
          deletedListEl.innerHTML = deletedKeys.map((k)=>{
            const it = mergedBaseItem(k);
            return `<div class="banned-item" data-restore-key="${escapeHtml(k)}"><span style="flex:1;">${escapeHtml(it.id||k)} → ${escapeHtml(it.en||'')}</span><button class="small-btn vb-restore-btn" style="background:var(--green);color:#fff;">↩ Pulihkan</button></div>`;
          }).join('');
          deletedListEl.querySelectorAll('[data-restore-key]').forEach((row)=>{
            row.querySelector('.vb-restore-btn').onclick = ()=>{
              db.ref('contentBank/vocabDeleted/' + row.dataset.restoreKey).remove().catch((err)=> alert('Gagal memulihkan: ' + err.message));
            };
          });
        }
      }

      document.getElementById('vbFilterMonth').addEventListener('change', ()=>{ vbVisibleCount = 60; renderList(); });
      document.getElementById('vbSearchInput').addEventListener('input', ()=>{ vbVisibleCount = 60; renderList(); });
      document.getElementById('vbShowMoreBtn').addEventListener('click', ()=>{ vbVisibleCount += 60; renderList(); });
      document.getElementById('vbAddBtn').addEventListener('click', ()=>{
        const month = parseInt(document.getElementById('vbAddMonth').value, 10) || 1;
        const day = parseInt(document.getElementById('vbAddDay').value, 10) || 0;
        const tag = document.getElementById('vbAddTag').value.trim() || 'Tambahan Admin';
        const id = document.getElementById('vbAddId').value.trim();
        const en = document.getElementById('vbAddEn').value.trim();
        const ph = document.getElementById('vbAddPh').value.trim();
        if(!id || !en){ alert('Teks Indonesia & Inggris wajib diisi.'); return; }
        db.ref('contentBank/vocabAdded').push({ id, en, tag, ph, month, day }).then(()=>{
          document.getElementById('vbAddId').value = '';
          document.getElementById('vbAddEn').value = '';
          document.getElementById('vbAddPh').value = '';
        }).catch((err)=> alert('Gagal menambahkan: ' + err.message));
      });

      db.ref('contentBank/vocabBase').on('value', (snap)=>{ vbBase = snap.val() || {}; vbBaseLoaded = true; renderList(); });
      db.ref('contentBank/vocabOverride').on('value', (snap)=>{ vbOverride = snap.val() || {}; renderList(); });
      db.ref('contentBank/vocabDeleted').on('value', (snap)=>{ vbDeleted = snap.val() || {}; renderList(); });
      db.ref('contentBank/vocabAdded').on('value', (snap)=>{ vbAdded = snap.val() || {}; renderList(); });
    })();

    /* ---------------- ZONA BERBAHAYA: HAPUS/RESTART SEMUA AKUN PESERTA ---------------- */
    (function(){
      const confirmInput = document.getElementById('wipeAllConfirmInput');
      const wipeBtn = document.getElementById('wipeAllAccountsBtn');
      const statusMsg = document.getElementById('wipeAllStatusMsg');
      const CONFIRM_PHRASE = 'HAPUS SEMUA AKUN';
      if(!confirmInput || !wipeBtn) return;
      confirmInput.addEventListener('input', ()=>{
        wipeBtn.disabled = confirmInput.value.trim().toUpperCase() !== CONFIRM_PHRASE;
      });
      wipeBtn.addEventListener('click', ()=>{
        if(confirmInput.value.trim().toUpperCase() !== CONFIRM_PHRASE) return;
        if(!confirm('BENER-BENER YAKIN? Semua akun peserta (profil, streak, lencana, leaderboard, riwayat skor & login) bakal hilang PERMANEN dan gak bisa dibalikin. Peserta harus daftar ulang dari nol.')) return;
        wipeBtn.disabled = true;
        wipeBtn.textContent = 'Menghapus...';
        statusMsg.style.display = 'block';
        statusMsg.style.color = 'inherit';
        statusMsg.textContent = 'Sedang menghapus data seluruh peserta...';
        const paths = [
          'profiles', 'streaks', 'badges', 'activityLeaderboard', 'examScores',
          'scoreHistory', 'deviceAccounts', 'loginHistory', 'highlights',
          'presence', 'duelQueue', 'duels', 'accountSecrets', 'xpProfile'
        ];
        // Dulu ini 1 kali db.ref().update({...}) buat semua path sekaligus.
        // Masalahnya: kalau SATU AJA dari path itu ketolak sama Firebase Rules,
        // Firebase bakal batalin SEMUA path dalam 1 update itu (all-or-nothing) ->
        // makanya walau errornya cuma "PERMISSION_DENIED" doang, gak ada satupun
        // yang kehapus. Sekarang tiap path dihapus terpisah (paralel) jadi path yang
        // emang boleh dihapus tetep kehapus, dan kita bisa tahu persis path mana yang
        // rules-nya belum ngizinin.
        Promise.allSettled(paths.map(p =>
          db.ref(p).remove().then(()=> ({ path: p, ok: true }))
            .catch((err)=> ({ path: p, ok: false, err }))
        )).then((results)=>{
          const outcomes = results.map(r => r.value || { path: '?', ok: false, err: r.reason });
          const failed = outcomes.filter(o => !o.ok);
          const okCount = outcomes.length - failed.length;
          if(failed.length === 0){
            statusMsg.style.color = 'var(--green)';
            statusMsg.textContent = '✓ Semua akun peserta berhasil dihapus/direstart.';
            confirmInput.value = '';
          } else {
            statusMsg.style.color = 'var(--red-dim)';
            const failDetail = failed.map(f => `${f.path} (${f.err && f.err.message ? f.err.message : f.err})`).join(', ');
            statusMsg.textContent = `⚠ ${okCount}/${paths.length} data berhasil dihapus. Gagal di path: ${failDetail}. Ini biasanya berarti Firebase Realtime Database Rules kamu belum ngasih izin write admin buat path tersebut — cek di Firebase Console > Realtime Database > Rules.`;
          }
          wipeBtn.textContent = '🗑 Hapus/Restart Semua Akun Peserta';
          wipeBtn.disabled = confirmInput.value.trim().toUpperCase() !== CONFIRM_PHRASE;
        });
      });
    })();

    /* jadwal reset leaderboard aktivitas otomatis */
    (function(){
      const hourSel = document.getElementById('lbResetHourInput');
      for(let h=0; h<24; h++){
        const opt = document.createElement('option');
        opt.value = h;
        opt.textContent = String(h).padStart(2,'0') + ':00';
        hourSel.appendChild(opt);
      }
      let localResetEnabled = false;
      const offBtn = document.getElementById('lbResetOffBtn');
      const onBtn = document.getElementById('lbResetOnBtn');
      function setResetUI(enabled){
        localResetEnabled = enabled;
        offBtn.classList.toggle('on', !enabled);
        onBtn.classList.toggle('on', enabled);
      }
      offBtn.addEventListener('click', ()=> setResetUI(false));
      onBtn.addEventListener('click', ()=> setResetUI(true));
      let firstResetLoad = true;
      db.ref('settings/lbResetSchedule').on('value', (snapshot)=>{
        const val = snapshot.val();
        if(firstResetLoad){
          firstResetLoad = false;
          setResetUI(!!(val && val.enabled));
          document.getElementById('lbResetFreqInput').value = (val && val.frequency) || 'weekly';
          hourSel.value = (val && val.hour !== undefined) ? val.hour : 0;
        }
      });
      db.ref('settings/lbLastResetAt').on('value', (snapshot)=>{
        const val = snapshot.val();
        const infoEl = document.getElementById('lbLastResetInfo');
        if(infoEl) infoEl.textContent = val ? ('Reset otomatis terakhir: ' + new Date(val).toLocaleString('id-ID')) : 'Belum pernah direset otomatis.';
      });
      document.getElementById('saveLbResetBtn').onclick = ()=>{
        const btn = document.getElementById('saveLbResetBtn');
        btn.disabled = true;
        db.ref('settings/lbResetSchedule').set({
          enabled: localResetEnabled,
          frequency: document.getElementById('lbResetFreqInput').value,
          hour: parseInt(hourSel.value, 10) || 0
        }).then(()=>{
          const msg = document.getElementById('savedLbSettingsMsg');
          msg.style.display = 'block';
          setTimeout(()=>{ msg.style.display = 'none'; }, 2500);
        }).catch((err)=> alert('Gagal menyimpan jadwal reset: ' + err.message))
          .finally(()=>{ btn.disabled = false; });
      };
      document.getElementById('lbResetNowBtn').onclick = ()=>{
        if(!confirm('Reset semua poin leaderboard aktivitas (otomatis & manual) ke 0 sekarang?')) return;
        const raw = lastActivityLbRaw || {};
        const updates = {};
        Object.keys(raw).forEach((k)=>{
          updates['activityLeaderboard/' + k + '/autoCount'] = 0;

    let lbPendingInputs = {};
    function renderActivityLeaderboardList(){
      const listEl = document.getElementById('activityLeaderboardList');
      if(!listEl) return;
      // Simpan dulu angka yang lagi diketik admin + input mana yang lagi fokus,
      // supaya gak ke-reset tiap kali data live berubah (peserta lain lagi ngerjain soal).
      listEl.querySelectorAll('[data-lb-input]').forEach(inp=>{
        if(inp.value) lbPendingInputs[inp.dataset.lbInput] = inp.value;
      });
      const activeEl = document.activeElement;
      const activeKey = (activeEl && activeEl.matches && activeEl.matches('[data-lb-input]')) ? activeEl.dataset.lbInput : null;
      const activeSelStart = activeKey ? activeEl.selectionStart : null;

      const rows = Object.entries(lastActivityLbRaw)
        .filter(([key, e]) => e && e.name)
        .map(([key, e])=> ({ key, name: e.name, autoCount: e.autoCount || 0, adjust: e.adjust || 0 }))
        .filter(r => !lbAdminSearchTerm || r.name.toLowerCase().includes(lbAdminSearchTerm))
        .sort((a,b)=> (b.autoCount + b.adjust) - (a.autoCount + a.adjust));
      if(rows.length === 0){
        listEl.innerHTML = '<div class="lb-empty">Belum ada aktivitas soal yang tercatat.</div>';
        return;
      }
      listEl.innerHTML = rows.map((r, i)=>{
        const total = r.autoCount + r.adjust;
        const crown = i === 0 ? '👑 ' : '';
        const pendingVal = lbPendingInputs[r.key] || '';
        return `<div class="banned-item" data-lb-key="${r.key}" style="flex-wrap:wrap;">
          <span style="flex:1;min-width:120px;">${crown}<b>${escapeHtml(r.name)}</b><br><span style="font-size:10.5px;opacity:0.7;font-weight:600;">Otomatis: ${r.autoCount} · Manual: ${r.adjust >= 0 ? '+' : ''}${r.adjust} → <b>${total} soal</b></span></span>
          <span style="display:flex;gap:4px;align-items:center;flex-wrap:wrap;flex:0 0 auto;">
            <input type="number" class="plain-input" data-lb-input="${r.key}" placeholder="cth: 10 / -5" style="width:100px;padding:6px 8px;font-size:12px;" value="${escapeHtml(pendingVal)}">
            <button class="small-btn" data-lb-action="apply" data-lb-key="${r.key}" style="background:var(--blue);color:#fff;">Tambah</button>
            <button class="small-btn" data-lb-action="delete" data-lb-key="${r.key}" style="background:var(--red-dim);color:#fff;">🗑 Hapus</button>
          </span>
        </div>`;
      }).join('');
      listEl.querySelectorAll('[data-lb-input]').forEach(inp=>{
        inp.addEventListener('input', ()=>{
          const k = inp.dataset.lbInput;
          if(inp.value) lbPendingInputs[k] = inp.value; else delete lbPendingInputs[k];
        });
      });
      // Kembalikan fokus & posisi kursor ke input yang lagi diketik admin sebelum re-render.
      if(activeKey){
        const restoreEl = listEl.querySelector(`[data-lb-input="${activeKey}"]`);
        if(restoreEl){
          restoreEl.focus();
          try{ restoreEl.setSelectionRange(activeSelStart, activeSelStart); }catch(e){}
        }
      }
      listEl.querySelectorAll('[data-lb-action="apply"]').forEach(btn=>{
        btn.onclick = ()=>{
          const key = btn.dataset.lbKey;
          const input = listEl.querySelector(`[data-lb-input="${key}"]`);
          const delta = parseInt(input && input.value, 10);
          if(!delta || isNaN(delta)){ alert('Isi dulu angka poinnya (boleh minus buat mengurangi).'); return; }
          btn.disabled = true;
          // Dulu pakai .transaction() buat nambah/ngurangin poin. Masalahnya transaction
          // butuh izin READ ke node itu dulu (buat baca nilai sekarang sebelum ditulis),
          // bukan cuma izin WRITE. Kalau Firebase Rules cuma ngasih admin izin write (gak
          // read) di path activityLeaderboard, transaction bakal kena PERMISSION_DENIED
          // walau seharusnya boleh nambah poin. Sekarang pakai ServerValue.increment()
          // yang cuma butuh izin WRITE aja — nambah/ngurangin poinnya diproses di server
          // Firebase, bukan dihitung di browser admin.
          db.ref('activityLeaderboard/' + key).update({
            adjust: firebase.database.ServerValue.increment(delta)
          }).then(()=>{
            delete lbPendingInputs[key];
            if(input) input.value = '';
          }).catch((err)=>{
            alert('Gagal menambah poin: ' + (err && err.message ? err.message : err));
          }).finally(()=>{
            btn.disabled = false;
          });
        };
      });
      listEl.querySelectorAll('[data-lb-action="delete"]').forEach(btn=>{
        btn.onclick = ()=>{
          const key = btn.dataset.lbKey;
          const row = rows.find(r=>r.key===key);
          if(!confirm(`Hapus data leaderboard "${row ? row.name : key}"? Poin otomatis & manualnya bakal direset ke 0.`)) return;
          delete lbPendingInputs[key];
          db.ref('activityLeaderboard/' + key).remove().catch((err)=>{
            alert('Gagal menghapus: ' + err.message);
          });
        };
      });
    }
    db.ref('activityLeaderboard').on('value', (snapshot)=>{
      lastActivityLbRaw = snapshot.val() || {};

            updates['profiles/' + resetKey + '/ownerUid'] = null;

    /* ---------------- DAFTAR PESERTA (profil + chat pribadi) ---------------- */
    let lastPesertaDirectory = [];
    function renderPesertaDirectory(){
      // PENTING: sumber utama daftar peserta HARUS dari 'profiles' (permanen, gak pernah
      // ke-reset tombol "Hapus semua riwayat"), bukan dari 'loginHistory' (yang memang
      // sengaja bisa dikosongkan admin). loginHistory cuma dipakai buat data "terakhir login" tambahan.
      // Dulu pernah kebalik (sumber dari loginHistory) makanya peserta ikut hilang dari daftar
      // walau data profil & masukan mereka sebenarnya masih aman di database.
      Promise.all([
        db.ref('loginHistory').limitToLast(500).once('value'),
        db.ref('profiles').once('value'),
        db.ref('privateChat').once('value'),
        db.ref('accountSecrets').once('value')
      ]).then(([histSnap, profileSnap, pcSnap, secretSnap])=>{
        const hist = histSnap.val() || {};
        const profiles = profileSnap.val() || {};
        const privateChatData = pcSnap.val() || {};
        const secrets = secretSnap.val() || {};
        const lastSeenByKey = {};
        const histNameByKey = {};
        Object.values(hist).forEach(e=>{
          if(!e || !e.name) return;
          const key = sanitizeNameForKey(e.name);
          if(!lastSeenByKey[key] || (e.timestamp||0) > lastSeenByKey[key]) lastSeenByKey[key] = e.timestamp||0;
          if(!histNameByKey[key]) histNameByKey[key] = e.name;
        });
        lastPesertaDirectory = Object.keys(profiles)
          .map(key => ({
            key,
            name: (profiles[key] && profiles[key].name) || key,
            timestamp: lastSeenByKey[key] || 0,
            profile: profiles[key] || null,
            password: (secrets[key] && secrets[key].password) || null,
            deleted: false
          }));
        // peserta yang PERNAH login (masih ada jejaknya di loginHistory) tapi akunnya
        // sudah dihapus (profil di 'profiles' udah gak ada) — tetep dimunculin biar
        // ketahuan pernah ada, ditandain "akun sudah dihapus".
        Object.keys(lastSeenByKey).forEach(key=>{
          if(profiles[key]) return;
          lastPesertaDirectory.push({
            key,
            name: histNameByKey[key] || key,
            timestamp: lastSeenByKey[key] || 0,
            profile: null,
            deleted: true
          });
        });
        // jaring terakhir: peserta yang profil DAN riwayat loginnya udah kehapus
        // dua-duanya (misal: akun dihapus sendiri + "Hapus semua riwayat login" dipencet),
        // tapi chat pribadinya masih ada & mungkin belum kebaca — tetep dimunculin
        // biar chatnya tetap bisa dibuka, ambil nama dari pesan yang pernah dia kirim.
        const knownKeys = new Set(lastPesertaDirectory.map(p=> p.key));
        Object.entries(privateChatData).forEach(([key, thread])=>{
          if(knownKeys.has(key)) return;
          const msgs = (thread && thread.messages) || {};
          const msgArr = Object.values(msgs).filter(m=> m);
          const fromPeserta = msgArr.filter(m=> m.isAdmin !== true && m.name);
          const lastMsg = msgArr.sort((a,b)=> (b.timestamp||0) - (a.timestamp||0))[0];
          lastPesertaDirectory.push({
            key,
            name: (fromPeserta[0] && fromPeserta[0].name) || key,
            timestamp: (lastMsg && lastMsg.timestamp) || 0,
            profile: null,
            deleted: true
          });
          knownKeys.add(key);
        });
        lastPesertaDirectory.sort((a,b)=> a.name.localeCompare(b.name));
        renderFilteredPesertaDirectory();
      });
    }
    function renderFilteredPesertaDirectory(){

      if(filtered.length === 0){
        listEl.innerHTML = `<div class="history-empty">${q ? 'Tidak ada peserta dengan nama itu.' : 'Belum ada peserta yang login.'}</div>`;

      listEl.querySelectorAll('.participant-dir-item').forEach(el=>{

    /* ---------------- KELOLA PESERTA (BAN/BLOKIR) ---------------- */
    function renderParticipantList(){
      // Sama seperti Daftar Peserta di atas: sumber utama dari 'profiles' (permanen),
      // loginHistory cuma buat data terakhir login tambahan. Ini juga yang bikin peserta
      // yang sudah pernah login tetap kelihatan di sini walau riwayat login dihapus.
      Promise.all([
        db.ref('loginHistory').limitToLast(500).once('value'),
        db.ref('bannedUsers').once('value'),
        db.ref('profiles').once('value'),
        db.ref('accountSecrets').once('value')
      ]).then(([histSnap, banSnap, profileSnap, secretSnap])=>{
        const hist = histSnap.val() || {};
        const bans = banSnap.val() || {};
        const profiles = profileSnap.val() || {};
        const secrets = secretSnap.val() || {};
        const lastSeenByKey = {};
        Object.values(hist).forEach(e=>{
          if(!e || !e.name) return;
          const key = sanitizeNameForKey(e.name);
          if(!lastSeenByKey[key] || (e.timestamp||0) > lastSeenByKey[key]) lastSeenByKey[key] = e.timestamp||0;
        });
        const list = Object.keys(profiles)
          .map(key => ({ key, name: (profiles[key] && profiles[key].name) || key, timestamp: lastSeenByKey[key] || 0 }))
          .sort((a,b)=> a.name.localeCompare(b.name));
        const listEl = document.getElementById('participantList');
        if(!listEl) return;
        if(list.length === 0){
          listEl.innerHTML = '<div class="history-empty">Belum ada peserta yang login.</div>';
          return;
        }
        listEl.innerHTML = list.map(p=>{
          const isBanned = !!bans[p.key];
          const profile = profiles[p.key];
          const statusTxt = profile && profile.status ? ` <span style="opacity:0.7;font-weight:700;color:var(--blue);">[${escapeHtml(profile.status)}]</span>` : '';
          const kelas = profile && profile.umur ? ` <span style="opacity:0.55;font-weight:600;">· ${escapeHtml(String(profile.umur))} th</span>` : '';
          const avatarHtml = (profile && profile.photo)
            ? `<img src="${profile.photo}" style="width:26px;height:26px;border-radius:50%;object-fit:cover;flex-shrink:0;">`
            : `<span>${isBanned ? '🚫' : '👤'}</span>`;
          return `<div class="banned-item"><span class="participant-info" data-key="${p.key}" style="display:flex;align-items:center;gap:8px;cursor:pointer;">${avatarHtml}${escapeHtml(p.name)}${notifPrivateChatByKey[p.key] ? '<span class="list-unread-dot" title="Pesan baru"></span>' : ''}${statusTxt}${kelas}</span><button class="small-btn ${isBanned ? 'unban' : 'ban'}" data-key="${p.key}" data-name="${escapeHtml(p.name)}" data-action="${isBanned ? 'unban' : 'ban'}">${isBanned ? 'Buka Blokir' : 'Blokir'}</button></div>`;
        }).join('');
        listEl.querySelectorAll('.participant-info').forEach(el=>{
          el.onclick = ()=>{
            const p = list.find(x=> x.key === el.dataset.key);
            const pass = (secrets[el.dataset.key] && secrets[el.dataset.key].password) || null;
            showParticipantProfileModal(p ? p.name : el.dataset.key, el.dataset.key, profiles[el.dataset.key], false, pass);
          };
        });
        listEl.querySelectorAll('.small-btn').forEach(btn=>{
          btn.onclick = ()=>{
            btn.disabled = true;
            const key = btn.dataset.key;
            const name = btn.dataset.name;
            if(btn.dataset.action === 'ban'){
              db.ref('bannedUsers/' + key).set({ name, bannedAt: firebase.database.ServerValue.TIMESTAMP, reason: '' })
                .then(renderParticipantList)
                .catch((err)=>{ alert('Gagal memblokir: ' + err.message); btn.disabled = false; });
            } else {
              db.ref('bannedUsers/' + key).remove()
                .then(renderParticipantList)
                .catch((err)=>{ alert('Gagal membuka blokir: ' + err.message); btn.disabled = false; });
            }
          };
        });
      });
    }
    renderParticipantList();
    window.renderPesertaDirectory = renderPesertaDirectory;
    window.renderParticipantList = renderParticipantList;
    window.renderFilteredPesertaDirectory = renderFilteredPesertaDirectory;
    document.getElementById('manualBanBtn').onclick = ()=>{
      const nameInput = document.getElementById('manualBanName');
      const reasonInput = document.getElementById('manualBanReason');
      const btn = document.getElementById('manualBanBtn');
      const name = nameInput.value.trim();
      if(!name){ nameInput.focus(); return; }
      const key = sanitizeNameForKey(name);
      btn.disabled = true;
      db.ref('bannedUsers/' + key).set({
        name, bannedAt: firebase.database.ServerValue.TIMESTAMP, reason: reasonInput.value.trim()
      }).then(()=>{
        nameInput.value = ''; reasonInput.value = '';
        renderParticipantList();
      }).catch((err)=>{
        alert('Gagal memblokir (kemungkinan Firebase Rules belum mengizinkan path "bannedUsers"): ' + err.message);
      }).finally(()=>{ btn.disabled = false; });
    };

    /* ---------------- OBROLAN KELAS (admin ikut join chat/messages) ---------------- */
    (function initClassChat(){
      const CHAT_MAX_IMAGE_DIM = 700;
      const listEl = document.getElementById('classChatMessages');
      const input = document.getElementById('classChatInput');
      const sendBtn = document.getElementById('classChatSendBtn');
      const attachBtn = document.getElementById('classChatAttachBtn');
      const mediaInput = document.getElementById('classChatMediaInput');
      const uploadStatus = document.getElementById('classChatUploadStatus');
      if(!listEl || !input || !sendBtn) return;

      function setUploading(isUploading, label){
        attachBtn.disabled = isUploading;
        sendBtn.disabled = isUploading;
        input.disabled = isUploading;
        if(isUploading){
          uploadStatus.style.display = 'block';
          uploadStatus.textContent = label || 'Mengirim...';
        } else {
          uploadStatus.style.display = 'none';
          uploadStatus.textContent = '';
        }
      }

      function compressChatImage(file){
        return new Promise((resolve, reject)=>{
          if(!file.type || file.type.indexOf('image/') !== 0){ reject(new Error('File harus berupa gambar.')); return; }
          const reader = new FileReader();
          reader.onload = (e)=>{
            const img = new Image();
            img.onload = ()=>{
              let w = img.width, h = img.height;
              if(w > h && w > CHAT_MAX_IMAGE_DIM){ h = Math.round(h * CHAT_MAX_IMAGE_DIM / w); w = CHAT_MAX_IMAGE_DIM; }
              else if(h > CHAT_MAX_IMAGE_DIM){ w = Math.round(w * CHAT_MAX_IMAGE_DIM / h); h = CHAT_MAX_IMAGE_DIM; }
              const canvas = document.createElement('canvas');
              canvas.width = w; canvas.height = h;
              canvas.getContext('2d').drawImage(img, 0, 0, w, h);
              resolve(canvas.toDataURL('image/jpeg', 0.55));
            };
            img.onerror = ()=> reject(new Error('Gagal membaca gambar.'));
            img.src = e.target.result;
          };
          reader.onerror = ()=> reject(new Error('Gagal membaca file.'));
          reader.readAsDataURL(file);
        });
      }

      db.ref('chat/messages').limitToLast(100).on('value', (snapshot)=>{
        const data = snapshot.val() || {};
        const entries = Object.entries(data).sort((a,b)=> (a[1].timestamp||0) - (b[1].timestamp||0));
        if(entries.length === 0){
          listEl.innerHTML = '<div class="history-empty">Belum ada obrolan.</div>';
        } else {
          listEl.innerHTML = entries.map(([msgKey, m])=>{
            const isAdmin = m.isAdmin === true;
            const d = m.timestamp ? new Date(m.timestamp) : null;
            const timeStr = d ? d.toLocaleTimeString('id-ID', { hour:'2-digit', minute:'2-digit' }) : '';
            const bg = isAdmin ? 'var(--gold)' : '#fff';
            let mediaHtml = '';
            if(m.mediaType === 'image' && m.mediaUrl){
              mediaHtml = `<img src="${m.mediaUrl}" loading="lazy" style="max-width:100%;width:200px;border-radius:10px;display:block;margin-top:${m.message ? '6px' : '0'};cursor:pointer;" onclick="openImageLightbox(this.src)">`;
            }
            const textHtml = m.message ? `<div style="word-break:break-word;">${escapeHtml(m.message)}</div>` : '';
            return `<div style="max-width:88%;align-self:${isAdmin ? 'flex-end' : 'flex-start'};">
              <div style="font-size:10.5px;font-weight:800;opacity:0.65;margin-bottom:2px;">${isAdmin ? '👑 Admin' : escapeHtml(m.name || 'Anonim')} · ${timeStr}</div>
              <div style="position:relative;background:${bg};color:var(--ink);padding:8px 26px 8px 12px;border-radius:12px;font-size:13.5px;box-shadow:0 1px 2px rgba(0,0,0,0.08);">
                ${textHtml}${mediaHtml}
                <span class="chat-del-btn" data-key="${msgKey}" title="Hapus pesan" style="position:absolute;top:4px;right:6px;cursor:pointer;opacity:0.5;font-size:12px;">✕</span>
              </div>
            </div>`;
          }).join('');
        }
        listEl.scrollTop = listEl.scrollHeight;
        listEl.querySelectorAll('.chat-del-btn').forEach(el=>{
          el.onclick = ()=>{
            if(confirm('Hapus pesan ini?')){
              db.ref('chat/messages/' + el.dataset.key).remove();
            }
          };
        });
      });

      function sendMsg(){
        const val = input.value.trim();
        if(!val) return;
        db.ref('chat/messages').push({
          name: 'Admin',
          message: val.slice(0, 300),
          isAdmin: true,
          timestamp: firebase.database.ServerValue.TIMESTAMP
        });
        input.value = '';
        input.focus();
      }

      async function sendMedia(file){
        if(!file.type || file.type.indexOf('image/') !== 0){
          alert('Cuma bisa kirim file foto ya (belum bisa video).');
          return;
        }
        const caption = input.value.trim().slice(0, 300);
        try{
          setUploading(true, 'Mengirim foto...');
          const dataUrl = await compressChatImage(file);
          await db.ref('chat/messages').push({
            name: 'Admin',
            message: caption,
            mediaType: 'image',
            mediaUrl: dataUrl,
            isAdmin: true,
            timestamp: firebase.database.ServerValue.TIMESTAMP
          });
          input.value = '';
        }catch(err){
          alert('Gagal mengirim foto: ' + (err && err.message ? err.message : err));
        }finally{
          setUploading(false);
          mediaInput.value = '';
        }
      }

      sendBtn.onclick = sendMsg;
      input.addEventListener('keydown', (e)=>{ if(e.key === 'Enter'){ e.preventDefault(); sendMsg(); } });
      attachBtn.onclick = ()=> mediaInput.click();
      mediaInput.onchange = (e)=>{
        const file = e.target.files && e.target.files[0];
        if(file) sendMedia(file);
      };
    })();

      const backBtn = document.getElementById('peerMonitorBackBtn');
      if(!listEl) return;

      let peerChatRef = null;

      db.ref('peerChat').on('value', (snapshot)=>{
        const data = snapshot.val() || {};
        const convs = Object.entries(data).map(([convId, c])=>{
          const msgs = Object.values(c.messages || {});
          msgs.sort((a,b)=> (a.timestamp||0) - (b.timestamp||0));
          const last = msgs[msgs.length - 1];
          const names = convId.split('__');
          return { convId, count: msgs.length, lastMessage: last ? last.message : '', lastAt: last ? last.timestamp : 0, names };
        }).sort((a,b)=> (b.lastAt||0) - (a.lastAt||0));

        if(convs.length === 0){
          listEl.innerHTML = '<div class="history-empty">Belum ada obrolan antar peserta.</div>';
          return;
        }
        listEl.innerHTML = convs.map(c=>{
          const d = c.lastAt ? new Date(c.lastAt).toLocaleString('id-ID', { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' }) : '-';
          return `<div class="history-item" data-conv="${escapeHtml(c.convId)}" style="cursor:pointer;">
            <div class="history-item-top"><span class="hname">👤 ${escapeHtml(c.names.join(' ↔ '))}</span><span class="htime">${d}</span></div>
            <div class="hmeta">${escapeHtml((c.lastMessage||'').slice(0,60))} · ${c.count} pesan</div>
          </div>`;
        }).join('');
        listEl.querySelectorAll('[data-conv]').forEach(el=>{
          el.onclick = ()=> openThread(el.dataset.conv);
        });
      });

      function openThread(convId){
        listEl.style.display = 'none';
        threadEl.style.display = 'block';
        titleEl.textContent = convId.split('__').join(' ↔ ');
        if(peerChatRef) peerChatRef.off();
        peerChatRef = db.ref('peerChat/' + convId + '/messages');
        peerChatRef.on('value', (snapshot)=>{
          const data = snapshot.val() || {};
          const entries = Object.entries(data).sort((a,b)=> (a[1].timestamp||0) - (b[1].timestamp||0));
          if(entries.length === 0){
            msgsEl.innerHTML = '<div class="history-empty">Belum ada pesan.</div>';
            return;
          }
          msgsEl.innerHTML = entries.map(([msgKey, m])=>{
            const d = m.timestamp ? new Date(m.timestamp).toLocaleTimeString('id-ID', { hour:'2-digit', minute:'2-digit' }) : '';
            return `<div style="max-width:88%;">
              <div style="font-size:10.5px;font-weight:800;opacity:0.65;margin-bottom:2px;">${escapeHtml(m.from || '?')} · ${d}</div>
              <div style="position:relative;background:#fff;padding:8px 26px 8px 12px;border-radius:12px;font-size:13.5px;box-shadow:0 1px 2px rgba(0,0,0,0.08);word-break:break-word;">
                ${escapeHtml(m.message || '')}
                <span class="chat-del-btn" data-key="${msgKey}" title="Hapus pesan" style="position:absolute;top:4px;right:6px;cursor:pointer;opacity:0.5;font-size:12px;">✕</span>
              </div>
            </div>`;
          }).join('');
          msgsEl.querySelectorAll('.chat-del-btn').forEach(el=>{
            el.onclick = ()=>{
              if(confirm('Hapus pesan ini?')) db.ref('peerChat/' + convId + '/messages/' + el.dataset.key).remove();
            };
          });
        });
      }

      if(backBtn){
        backBtn.onclick = ()=>{
          if(peerChatRef){ peerChatRef.off(); peerChatRef = null; }
          threadEl.style.display = 'none';
          listEl.style.display = 'block';
        };
      }
    })();
  }

  function renderAdminPanel(){
    logoutBtn.style.display = 'block';
    feedbackLink.style.display = 'block';
    // Nampilin UID akun admin yang lagi login, buat cocokin manual sama UID yang di-hardcode
    // di Firebase Rules (kalau beda, itu penyebab fitur2 tertentu kena PERMISSION_DENIED
    // walau udah login sebagai admin).
    const uidInfoEl = document.getElementById('adminUidInfo');
    if(uidInfoEl && auth.currentUser){
      uidInfoEl.style.display = 'block';
      uidInfoEl.textContent = 'UID admin: ' + auth.currentUser.uid + ' (cocokkan dengan Firebase Rules kalau ada fitur admin yang gagal)';
    }
    let _lastGateIsOpen = true;
    let _lastSchedCfg = null;
    db.ref('settings/gateOpen').on('value', (snapshot)=>{
      const val = snapshot.val();
      _lastGateIsOpen = (val === false) ? false : true;
      renderGate(_lastGateIsOpen, _lastSchedCfg);
    }, (err)=>{
      card.innerHTML = `<div class="status-pill closed">🔴 Gagal memuat status</div>
        <p style="color:#dc2626;font-weight:700;">Gagal membaca status buka/tutup (${err.code || err.message}). Cek koneksi internet atau Firebase Rules, lalu refresh halaman.</p>`;
    });
    db.ref('settings/schedule').on('value', (snapshot)=>{
      _lastSchedCfg = snapshot.val() || null;
      renderGate(_lastGateIsOpen, _lastSchedCfg);
    });
    db.ref('feedback').on('value', (snapshot)=>{
      const data = snapshot.val() || {};
      const unread = Object.values(data).filter(e=> e && e.message && e.read === false).length;
      feedbackLink.innerHTML = unread > 0
        ? `💬 Lihat Masukan Peserta <span class="feedback-badge">${unread} baru</span> →`
        : `💬 Lihat Masukan Peserta →`;
      notifFeedbackUnread = unread;
      updateNotifBadges();
    });
    db.ref('chat/messages').limitToLast(100).on('value', (snapshot)=>{
      const data = snapshot.val() || {};
      const seen = getSeenTs('adminClassChatSeen');
      notifClassChatUnread = Object.values(data).filter(m=> m && m.isAdmin !== true && (m.timestamp||0) > seen).length;
      let activeSection = null;
      try{ activeSection = localStorage.getItem('adminActiveSection'); }catch(e){}
      if(activeSection === 'classChatSection') markClassChatSeen(); else updateNotifBadges();
    });
    db.ref('privateChat').on('value', (snapshot)=>{
      const data = snapshot.val() || {};
      notifPrivateChatByKey = {};
      Object.entries(data).forEach(([key, thread])=>{
        const msgs = (thread && thread.messages) || {};
        const seen = getSeenTs('adminPcSeen_' + key);
        const count = Object.values(msgs).filter(m=> m && m.isAdmin !== true && (m.timestamp||0) > seen).length;
        if(count > 0) notifPrivateChatByKey[key] = count;
      });
      notifPrivateChatUnread = Object.values(notifPrivateChatByKey).reduce((a,b)=> a+b, 0);
      updateNotifBadges();
    });
    renderExtraSections();
  }

  logoutBtn.onclick = ()=>{ auth.signOut(); };

  auth.onAuthStateChanged((user)=>{
    if(user){
      renderAdminPanel();
    } else {
      renderLoginForm();
    }
  });

  /* ---------------- HAMBURGER NAV MENU (pojok kiri atas) ---------------- */
  const navMenuBtn = document.getElementById('navMenuBtn');
  const navMenuBg = document.getElementById('navMenuBg');
  const navMenuCloseBtn = document.getElementById('navMenuCloseBtn');
  function openNavMenu(){ navMenuBg.classList.add('open'); }
  function closeNavMenu(){ navMenuBg.classList.remove('open'); }
  navMenuBtn.onclick = openNavMenu;
  navMenuCloseBtn.onclick = closeNavMenu;
  navMenuBg.addEventListener('click', (e)=>{ if(e.target === navMenuBg) closeNavMenu(); });
  document.querySelectorAll('.nav-menu-item[data-target]').forEach(btn=>{
    btn.onclick = ()=>{
      closeNavMenu();
      if(btn.dataset.target === 'card'){
        window.scrollTo({ top: 0, behavior: 'smooth' });
        return;
      }
      if(window.showAdminSection) window.showAdminSection(btn.dataset.target);
    };
  });
  document.getElementById('navMenuFeedbackLink').onclick = ()=>{
    closeNavMenu();
    window.location.href = 'masukan-1iamt4um1o.html';
  };
  document.getElementById('navMenuLogoutBtn').onclick = ()=>{
    closeNavMenu();
    auth.signOut();
  };

  /* ---------------- MODAL PROFIL PESERTA (dari Kelola Peserta / Daftar Peserta) ---------------- */
  function showParticipantProfileModal(name, key, profile, isDeleted, password){
    const root = document.getElementById('profileModalRoot');
    const avatarBlock = (profile && profile.photo)
      ? `<img class="pm-avatar" src="${profile.photo}" alt="${escapeHtml(name)}">`
      : `<div class="pm-avatar-fallback">${escapeHtml((name||'?').trim().charAt(0).toUpperCase())}</div>`;
    const deletedNotice = isDeleted
      ? `<div class="pm-status" style="background:#f6dede;color:#8a2e2e;border-radius:8px;padding:8px 10px;font-size:11.5px;text-align:left;margin-bottom:10px;">🗑️ Akun peserta ini <b>sudah dihapus sendiri</b>. Profil, chat pribadi, dan skornya udah gak ada — cuma jejak riwayat login yang masih tersisa di sini.</div>`
      : '';
    root.innerHTML = `
      <div class="profile-modal-bg" id="profileModalBg">
        <div class="profile-modal">
          ${avatarBlock}
          <h2>${escapeHtml(name)}</h2>
          ${deletedNotice}
          ${profile && profile.status ? `<div class="pm-status">${escapeHtml(profile.status)}</div>` : ''}
          <div class="pm-row">
            <div class="pm-label">Username</div>
            <div class="pm-val">${escapeHtml(name)}</div>
          </div>
          ${isDeleted ? '' : `<div class="pm-row">
            <div class="pm-label">Password</div>
            <div class="pm-val" id="pmPasswordVal" style="font-family:monospace;">${password ? escapeHtml(password) : '<span style="opacity:0.6;font-family:inherit;">— belum ada password (akun lama) —</span>'}</div>
          </div>`}
          <div class="pm-row">
            <div class="pm-label">Nama Lengkap</div>
            <div class="pm-val">${profile && profile.fullName ? escapeHtml(profile.fullName) : '— belum diisi peserta —'}</div>
          </div>
          <div class="pm-row">
            <div class="pm-label">Umur</div>
            <div class="pm-val">${profile && profile.umur ? escapeHtml(String(profile.umur)) + ' tahun' : '—'}</div>
          </div>
          <div class="pm-row">
            <div class="pm-label">Bio</div>
            <div class="pm-val">${profile && profile.bio ? escapeHtml(profile.bio) : '—'}</div>
          </div>
          <button class="btn" id="profileModalChatBtn" style="background:var(--blue,#2E6FD9);color:#fff;">💬 Chat Pribadi</button>
          ${isDeleted ? '' : `<button class="btn" id="profileModalResetPassBtn" style="margin-top:8px;background:var(--gold,#eab308);color:#fff;">🔑 Atur Ulang Password</button>`}
          <button class="btn" id="profileModalDeleteBtn" style="margin-top:8px;background:var(--red);color:#fff;">${isDeleted ? '🗑 Bersihkan Sisa Jejak' : '🗑 Hapus Akun Peserta'}</button>
          <button class="btn" id="profileModalCloseBtn" style="margin-top:8px;background:transparent;color:var(--ink);border:1px solid var(--line);">Tutup</button>
        </div>
      </div>
    `;
    const bg = document.getElementById('profileModalBg');
    bg.addEventListener('click', (e)=>{ if(e.target === bg) root.innerHTML = ''; });
    document.getElementById('profileModalCloseBtn').onclick = ()=>{ root.innerHTML = ''; };
    const chatBtn = document.getElementById('profileModalChatBtn');
    if(chatBtn) chatBtn.onclick = ()=> showPrivateChatModal(name, key, isDeleted);
    const resetPassBtn = document.getElementById('profileModalResetPassBtn');
    if(resetPassBtn){
      resetPassBtn.onclick = ()=>{
        const newPass = prompt(`Password baru buat akun "${name}" (min. 4 karakter):`);
        if(newPass === null) return;
        if(newPass.trim().length < 4){ alert('Password minimal 4 karakter.'); return; }
        resetPassBtn.disabled = true;
        db.ref('accountSecrets/' + key).set({ name, password: newPass.trim(), updatedAt: firebase.database.ServerValue.TIMESTAMP }).then(()=>{
          alert(`Password "${name}" berhasil diatur ulang.`);
          const val = document.getElementById('pmPasswordVal');
          if(val) val.textContent = newPass.trim();
          resetPassBtn.disabled = false;
          if(typeof window.renderPesertaDirectory === 'function') window.renderPesertaDirectory();
        }).catch((err)=>{
          alert('Gagal mengatur ulang password: ' + err.message);
          resetPassBtn.disabled = false;
        });
      };
    }
    document.getElementById('profileModalDeleteBtn').onclick = ()=>{
      if(isDeleted){
        // Akunnya udah dihapus peserta sendiri (profil udah gak ada). Sisa jejaknya cuma
        // loginHistory dan/atau chat pribadi (privateChat/key) — makanya masih bisa
        // dimunculin & dibaca chatnya walau udah "terhapus". Tombol ini beresin semua
        // sisa jejak itu biar peserta ini bener-bener hilang dari daftar.
        if(!confirm(`Bersihkan sisa jejak "${name}" (riwayat login & chat pribadi)? Peserta ini akan hilang dari daftar. Tindakan ini TIDAK BISA dibatalkan.`)) return;
        const btn = document.getElementById('profileModalDeleteBtn');
        btn.disabled = true;
        btn.textContent = 'Membersihkan...';
        db.ref('loginHistory').once('value').then((histSnap)=>{
          const updates = {};
          const hist = histSnap.val() || {};
          const deviceIds = new Set();
          Object.entries(hist).forEach(([id, e])=>{
            if(e && e.name === name){
              updates['loginHistory/' + id] = null;
              if(e.deviceId) deviceIds.add(e.deviceId);
            }
          });
          deviceIds.forEach(id=>{ updates['bannedDevices/' + id] = null; });
          updates['privateChat/' + key] = null;
          return db.ref().update(updates);
        }).then(()=>{
          alert(`Riwayat login "${name}" berhasil dibersihkan.`);
          document.getElementById('profileModalRoot').innerHTML = '';
          if(typeof window.renderPesertaDirectory === 'function') window.renderPesertaDirectory();
          if(typeof window.renderParticipantList === 'function') window.renderParticipantList();
        }).catch((err)=>{
          alert('Gagal membersihkan: ' + err.message);
          btn.disabled = false;
          btn.textContent = '🗑 Bersihkan Sisa Jejak';
        });
        return;
      }
      if(!confirm(`Yakin mau HAPUS akun "${name}" sepenuhnya? Ini akan menghapus profil, riwayat login, presence, chat pribadi, blokir, dan skor ujiannya. Tindakan ini TIDAK BISA dibatalkan.`)) return;
      if(!confirm(`Sekali lagi buat mastiin — hapus permanen akun "${name}"?`)) return;
      const btn = document.getElementById('profileModalDeleteBtn');
      btn.disabled = true;
      btn.textContent = 'Menghapus...';

      Promise.all([
        db.ref('loginHistory').once('value'),
        db.ref('presence').once('value'),
        db.ref('examScores').once('value'),
        db.ref('scoreHistory').once('value'),
        db.ref('deviceAccounts').once('value')
      ]).then(([histSnap, presSnap, scoreSnap, scoreHistSnap, devAccSnap])=>{
        const updates = {};
        updates['profiles/' + key] = null;
        updates['bannedUsers/' + key] = null;
        updates['privateChat/' + key] = null;
        updates['accountSecrets/' + key] = null;

        const hist = histSnap.val() || {};
        const deviceIds = new Set();
        Object.entries(hist).forEach(([id, e])=>{
          if(e && e.name === name){
            updates['loginHistory/' + id] = null;
            if(e.deviceId) deviceIds.add(e.deviceId);
          }
        });
        deviceIds.forEach(id=>{ updates['bannedDevices/' + id] = null; });

        // Lepas juga ikatan device->akun ('deviceAccounts'). Kalau ini kelewat, device
        // yang dulu dipakai akun ini bakal tetep "terkunci" ke nama yang udah dihapus,
        // jadi gak bisa dipakai buat daftar akun baru sama sekali di device itu.
        // Cek langsung ke data 'deviceAccounts' (bukan asumsi dari loginHistory) biar gak
        // salah hapus device yang sudah di-assign ulang ke akun lain oleh admin.
        const devAcc = devAccSnap.val() || {};
        Object.entries(devAcc).forEach(([devId, e])=>{
          if(e && e.name === name) updates['deviceAccounts/' + devId] = null;
        });

        const pres = presSnap.val() || {};
        Object.entries(pres).forEach(([id, e])=>{
          if(e && e.name === name) updates['presence/' + id] = null;
        });

        const scores = scoreSnap.val() || {};
        Object.entries(scores).forEach(([id, e])=>{
          if(e && e.name === name) updates['examScores/' + id] = null;
        });

        const scoreHist = scoreHistSnap.val() || {};
        Object.entries(scoreHist).forEach(([id, e])=>{
          if(e && e.name === name) updates['scoreHistory/' + id] = null;
        });

        return db.ref().update(updates);
      }).then(()=>{
        alert(`Akun "${name}" berhasil dihapus.`);
        document.getElementById('profileModalRoot').innerHTML = '';
        if(typeof window.renderPesertaDirectory === 'function') window.renderPesertaDirectory();
        if(typeof window.renderParticipantList === 'function') window.renderParticipantList();
      }).catch((err)=>{
        alert('Gagal menghapus akun: ' + err.message);
        btn.disabled = false;
        btn.textContent = '🗑 Hapus Akun Peserta';
      });
    };
  }

  /* ---------------- MODAL CHAT PRIBADI (admin <-> 1 peserta) ---------------- */
  let adminPrivateChatRef = null;
  function showPrivateChatModal(name, key, isDeleted){
    if(typeof markPrivateChatSeen === 'function') markPrivateChatSeen(key);
    const root = document.getElementById('profileModalRoot');
    root.innerHTML = `
      <div class="profile-modal-bg" id="pcModalBg">
        <div class="profile-modal" style="max-width:360px;text-align:left;">
          <h2 style="text-align:center;">💬 ${escapeHtml(name)}</h2>
          <div id="pcAdminMessages" style="max-height:280px;overflow-y:auto;border:1px solid var(--line);border-radius:10px;padding:8px;margin:10px 0;display:flex;flex-direction:column;gap:8px;background:#fff;">
            <div class="lb-empty">Memuat pesan...</div>
          </div>
          <div style="display:flex;gap:6px;">
            <input type="text" id="pcAdminInput" class="plain-input" placeholder="Tulis pesan..." style="flex:1;" maxlength="300">
            <button class="save-exam-btn" id="pcAdminSendBtn" style="margin-top:0;width:auto;padding:0 14px;">Kirim</button>
          </div>
          <button class="btn" id="pcModalBackBtn" style="margin-top:12px;background:transparent;color:var(--ink);border:1px solid var(--line);">← Kembali ke Profil</button>
        </div>
      </div>
    `;
    const listEl = document.getElementById('pcAdminMessages');
    if(adminPrivateChatRef){ adminPrivateChatRef.off(); }
    adminPrivateChatRef = db.ref('privateChat/' + key + '/messages').limitToLast(100);
    adminPrivateChatRef.on('value', (snapshot)=>{
      const data = snapshot.val() || {};
      const arr = Object.values(data).sort((a,b)=> (a.timestamp||0) - (b.timestamp||0));
      if(!listEl) return;
      if(arr.length === 0){
        listEl.innerHTML = '<div class="lb-empty">Belum ada pesan dengan peserta ini.</div>';
      } else {
        listEl.innerHTML = arr.map(m=>{
          const isAdmin = m.isAdmin === true;
          const d = m.timestamp ? new Date(m.timestamp) : null;
          const timeStr = d ? d.toLocaleTimeString('id-ID', { hour:'2-digit', minute:'2-digit' }) : '';
          return `<div style="align-self:${isAdmin ? 'flex-end' : 'flex-start'};max-width:85%;">
            <div style="font-size:10px;font-weight:800;opacity:0.6;${isAdmin ? 'text-align:right;' : ''}">${isAdmin ? 'Admin' : escapeHtml(name)} · ${timeStr}</div>
            <div style="background:${isAdmin ? 'var(--gold)' : '#f1ede0'};padding:7px 10px;border-radius:10px;font-size:13px;word-break:break-word;">${escapeHtml(m.message || '')}</div>
          </div>`;
        }).join('');
      }
      listEl.scrollTop = listEl.scrollHeight;
    });
    function sendAdminMsg(){
      const input = document.getElementById('pcAdminInput');
      const val = input.value.trim();
      if(!val) return;
      db.ref('privateChat/' + key + '/messages').push({
        name: 'Admin', isAdmin: true, message: val.slice(0, 300), timestamp: firebase.database.ServerValue.TIMESTAMP
      });
      input.value = '';
      input.focus();
    }
    document.getElementById('pcAdminSendBtn').onclick = sendAdminMsg;
    document.getElementById('pcAdminInput').addEventListener('keydown', (e)=>{ if(e.key === 'Enter'){ e.preventDefault(); sendAdminMsg(); } });
    const bg = document.getElementById('pcModalBg');
    const closeChat = ()=>{ if(adminPrivateChatRef){ adminPrivateChatRef.off(); adminPrivateChatRef = null; } };
    bg.addEventListener('click', (e)=>{ if(e.target === bg){ closeChat(); root.innerHTML = ''; } });
    document.getElementById('pcModalBackBtn').onclick = ()=>{
      closeChat();
      Promise.all([
        db.ref('profiles/' + key).once('value'),
        db.ref('accountSecrets/' + key).once('value')
      ]).then(([snap, secretSnap])=>{
        const secret = secretSnap.val();
        showParticipantProfileModal(name, key, snap.val(), isDeleted, secret ? secret.password : null);
      });
    };
  }
</script>
