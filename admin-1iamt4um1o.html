<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Rekap Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#241B12;
    --panel:#FFF9EC;
    --red:#E23F35;
    --red-dim:#B23A2E;
    --gold:#F2B705;
    --green:#3F9142;
    --blue:#2B6CB0;
    --line: rgba(36,27,18,0.14);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:#FDE9A8;color:var(--ink);font-family:'Nunito',sans-serif;
    min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:24px 14px;
  }
  .board{width:100%;max-width:480px;}
  .header{
    background:var(--ink);border-radius:16px 16px 0 0;padding:18px 22px;
    display:flex;align-items:center;justify-content:space-between;gap:10px;
  }
  .header .eyebrow{font-size:11px;letter-spacing:0.18em;color:var(--gold);text-transform:uppercase;font-weight:700;}
  .header .title{font-size:20px;font-weight:800;color:#FFF9EC;margin-top:2px;}
  .logout-btn{
    background:transparent;border:1px solid rgba(255,249,236,0.3);color:#FFF9EC;
    font-size:11px;font-weight:800;letter-spacing:0.04em;text-transform:uppercase;
    padding:8px 12px;border-radius:8px;cursor:pointer;flex-shrink:0;
  }
  .logout-btn:hover{border-color:var(--gold);color:var(--gold);}
  .card{
    background:var(--panel);border:1px solid var(--line);padding:28px 22px;text-align:center;
  }
  .status-pill{
    display:inline-block;font-size:12px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;
    padding:8px 18px;border-radius:100px;margin-bottom:18px;
  }
  .status-pill.open{background:rgba(63,145,66,0.15);color:var(--green);}
  .status-pill.closed{background:rgba(226,63,53,0.15);color:var(--red);}
  h1{font-size:20px;font-weight:800;margin:0 0 8px;}
  p{font-size:13.5px;color:var(--red-dim);font-weight:600;line-height:1.6;margin:0 0 22px;}
  .btn{
    font-weight:800;letter-spacing:0.04em;text-transform:uppercase;font-size:14px;
    border:none;padding:15px 28px;border-radius:10px;cursor:pointer;width:100%;
    transition:opacity .15s, transform .1s;
  }
  .btn:active{transform:scale(0.98);}
  .btn.close-btn{background:var(--red);color:#FFF9EC;}
  .btn.open-btn{background:var(--green);color:#FFF9EC;}
  .btn.login-btn{background:var(--ink);color:#FFF9EC;margin-top:14px;}
  .btn:hover{opacity:0.9;}
  .btn:disabled{opacity:0.5;cursor:default;}
  .footer-note{
    background:var(--ink);color:rgba(255,249,236,0.55);font-size:11px;text-align:center;
    padding:12px 18px;border-radius:0 0 16px 16px;font-weight:600;
  }
  .loading{font-size:13px;color:var(--red-dim);font-weight:700;}
  .login-input{
    width:100%;background:#FFFFFF;border:1px solid var(--line);color:var(--ink);
    padding:13px 16px;border-radius:10px;font-size:15px;font-family:'Nunito',sans-serif;
    font-weight:600;margin-bottom:10px;text-align:left;
  }
  .login-input:focus{outline:none;border-color:var(--gold);}
  .login-error{
    font-size:12.5px;color:var(--red);font-weight:700;margin:-4px 0 14px;text-align:left;min-height:16px;
  }
  .section-divider{
    border:none;border-top:1px dashed var(--line);margin:22px 0 18px;
  }
  .history-head{
    display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;
  }
  .history-head h2{font-size:14px;font-weight:800;margin:0;text-align:left;}
  .history-count{font-size:11px;font-weight:800;color:var(--red-dim);background:rgba(226,63,53,0.1);padding:4px 10px;border-radius:100px;}
  .history-list{
    text-align:left;max-height:340px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;
    padding-right:2px;
  }
  .history-item{
    background:#FFFFFF;border:1px solid var(--line);border-radius:10px;
    padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;
  }
  .history-item .hname{font-size:13px;font-weight:800;color:var(--ink);}
  .history-item .htime{font-size:11px;font-weight:700;color:rgba(36,27,18,0.55);white-space:nowrap;}
  .history-empty{font-size:12.5px;color:rgba(36,27,18,0.55);font-weight:600;padding:10px 0;}
  .clear-history-btn{
    font-size:11px;font-weight:800;letter-spacing:0.02em;background:transparent;color:var(--red-dim);
    border:1px solid var(--line);padding:6px 12px;border-radius:100px;cursor:pointer;margin-top:12px;
  }
  .clear-history-btn:hover{border-color:var(--red);color:var(--red);background:rgba(226,63,53,0.06);}
</style>
</head>
<body>

<div class="board">
  <div class="header">
    <div class="brand">
      <div class="eyebrow">LC Language Center · Basic Camp</div>
      <div class="title">🔒 Panel Admin</div>
    </div>
    <button class="logout-btn" id="logoutBtn" style="display:none;">Keluar</button>
  </div>
  <div class="card" id="card">
    <div class="loading">Memuat...</div>
  </div>
  <div class="footer-note">Halaman ini rahasia — jangan bagikan link ke murid.</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyDPaWjx_MxF6Q8OT_P7FCn9h6MyfADnq8g",
    authDomain: "quizz-7bac3.firebaseapp.com",
    databaseURL: "https://quizz-7bac3-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "quizz-7bac3",
    storageBucket: "quizz-7bac3.firebasestorage.app",
    messagingSenderId: "105522344136",
    appId: "1:105522344136:web:3fde8250987b74ad9ff5fd"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.database();
  const card = document.getElementById('card');
  const logoutBtn = document.getElementById('logoutBtn');

  /* ---------------- LOGIN FORM ---------------- */
  function renderLoginForm(errorMsg){
    card.innerHTML = `
      <div class="status-pill closed">🔐 Akses Terbatas</div>
      <h1>Masuk sebagai Admin</h1>
      <p>Halaman ini hanya bisa diakses oleh admin. Masukkan email &amp; password admin untuk melanjutkan.</p>
      <input type="email" id="adminEmail" class="login-input" placeholder="Email admin" autocomplete="username" />
      <input type="password" id="adminPass" class="login-input" placeholder="Password" autocomplete="current-password" />
      <div class="login-error">${errorMsg || ''}</div>
      <button class="btn login-btn" id="loginBtn">Masuk</button>
    `;
    logoutBtn.style.display = 'none';
    const emailInput = document.getElementById('adminEmail');
    const passInput = document.getElementById('adminPass');
    const doLogin = ()=>{
      const email = emailInput.value.trim();
      const pass = passInput.value;
      if(!email || !pass){ renderLoginForm('Isi email dan password terlebih dahulu.'); return; }
      const btn = document.getElementById('loginBtn');
      btn.disabled = true; btn.textContent = 'Memeriksa...';
      auth.signInWithEmailAndPassword(email, pass).catch((err)=>{
        renderLoginForm('Email atau password salah.');
      });
    };
    document.getElementById('loginBtn').onclick = doLogin;
    passInput.addEventListener('keydown', (e)=>{ if(e.key === 'Enter'){ e.preventDefault(); doLogin(); } });
    emailInput.focus();
  }

  /* ---------------- GATE TOGGLE + LOGIN HISTORY (admin only) ---------------- */
  function renderAdminPanel(){
    logoutBtn.style.display = 'block';
    card.innerHTML = `
      <div id="gateSection"><div class="loading">Memuat status...</div></div>
      <hr class="section-divider">
      <div class="history-head">
        <h2>📋 Riwayat Login Peserta</h2>
        <span class="history-count" id="historyCount">0</span>
      </div>
      <div class="history-list" id="historyList"><div class="history-empty">Memuat riwayat...</div></div>
      <button class="clear-history-btn" id="clearHistoryBtn">Hapus semua riwayat</button>
    `;

    const gateSection = document.getElementById('gateSection');
    function renderGate(isOpen){
      gateSection.innerHTML = `
        <div class="status-pill ${isOpen ? 'open' : 'closed'}">${isOpen ? '🟢 Sedang Terbuka' : '🔴 Sedang Ditutup'}</div>
        <h1>${isOpen ? 'Soal saat ini bisa dikerjakan murid' : 'Soal saat ini TIDAK bisa dikerjakan murid'}</h1>
        <p>${isOpen ? 'Tap tombol di bawah untuk mengunci web supaya tidak ada yang bisa mengerjakan.' : 'Tap tombol di bawah untuk membuka akses soal buat semua murid.'}</p>
        <button class="btn ${isOpen ? 'close-btn' : 'open-btn'}" id="toggleBtn">${isOpen ? '🔒 Kunci Web' : '🔓 Buka Soal'}</button>
      `;
      document.getElementById('toggleBtn').onclick = ()=>{
        db.ref('settings/gateOpen').set(!isOpen);
      };
    }
    db.ref('settings/gateOpen').on('value', (snapshot)=>{
      const val = snapshot.val();
      const isOpen = (val === false) ? false : true;
      renderGate(isOpen);
    });

    /* riwayat login */
    const historyList = document.getElementById('historyList');
    const historyCount = document.getElementById('historyCount');
    db.ref('loginHistory').limitToLast(300).on('value', (snapshot)=>{
      const data = snapshot.val() || {};
      const entries = Object.values(data)
        .filter(e => e && e.name)
        .sort((a,b) => (b.timestamp||0) - (a.timestamp||0));
      historyCount.textContent = entries.length;
      if(entries.length === 0){
        historyList.innerHTML = '<div class="history-empty">Belum ada riwayat login.</div>';
        return;
      }
      historyList.innerHTML = entries.map(e=>{
        const d = e.timestamp ? new Date(e.timestamp) : null;
        const timeStr = d ? d.toLocaleString('id-ID', { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' }) : '-';
        return `<div class="history-item"><span class="hname">👤 ${escapeHtml(e.name)}</span><span class="htime">${timeStr}</span></div>`;
      }).join('');
    });

    document.getElementById('clearHistoryBtn').onclick = ()=>{
      if(confirm('Hapus semua riwayat login? Tindakan ini tidak bisa dibatalkan.')){
        db.ref('loginHistory').remove();
      }
    };
  }

  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, (c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  logoutBtn.onclick = ()=>{ auth.signOut(); };

  auth.onAuthStateChanged((user)=>{
    if(user){
      renderAdminPanel();
    } else {
      renderLoginForm();
    }
  });
</script>
</body>
</html>
