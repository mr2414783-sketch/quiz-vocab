function startGrammarFlashcard(pool){
  grammarFlashQueue = shuffle((pool && pool.length ? pool : GRAMMAR_FORMULAS).slice());
  grammarFlashIdx = 0;
  grammarFlashFlipped = false;
  statusVal.textContent = "HAFALAN GRAMMAR";
  setPresenceStatus('in_progress');
  setPresenceMode('Menghafal Grammar');
  renderGrammarFlashcard();
}

function renderGrammarFlashcard(){
  if(grammarFlashQueue.length === 0){
    card.innerHTML = `<div class="center-stack"><p class="intro-desc">Belum ada materi.</p><button class="btn ghost" id="gFlashBackBtn">← Kembali</button></div>`;
    document.getElementById('gFlashBackBtn').onclick = ()=> renderGrammarIntro();
    return;
  }
  const item = grammarFlashQueue[grammarFlashIdx];
  const isLast = grammarFlashIdx === grammarFlashQueue.length - 1;
  const backHtml = `<div class="flash-word grammar-formula">${item.back.map(line=>escapeHtmlIdx(line)).join('<br>')}</div>`;

  card.innerHTML = `
    <div class="reset-row"><button class="reset-btn" id="gFlashExitBtn">✕ Selesai</button></div>
    <div class="progress-row"><span>MATERI ${grammarFlashIdx+1} / ${grammarFlashQueue.length}</span></div>
    <div class="section-tag">✍️ ${escapeHtmlIdx(item.category)}</div>
    <div class="flash-card ${grammarFlashFlipped ? 'flipped' : ''}" id="gFlashCardEl">
      <div class="flash-lang-tag">${grammarFlashFlipped ? 'RUMUS' : 'MATERI'}</div>
      ${grammarFlashFlipped ? backHtml : `<div class="flash-word">${escapeHtmlIdx(item.title)}</div>`}
      ${!grammarFlashFlipped ? '<div class="flash-hint">👆 Tap kartu untuk lihat rumusnya</div>' : ''}
    </div>
    <div class="flash-nav-row">
      <button class="flash-nav-btn" id="gFlashPrevBtn" ${grammarFlashIdx===0?'disabled':''}>← Sebelumnya</button>
      <button class="flash-nav-btn" id="gFlashShuffleBtn">🔀 Acak</button>
      <button class="flash-nav-btn primary" id="gFlashNextBtn">${isLast ? 'Selesai ✓' : 'Berikutnya →'}</button>
    </div>
  `;

  document.getElementById('gFlashCardEl').onclick = ()=>{ grammarFlashFlipped = !grammarFlashFlipped; renderGrammarFlashcard(); };
  document.getElementById('gFlashPrevBtn').onclick = ()=>{
    if(grammarFlashIdx > 0){ grammarFlashIdx -= 1; grammarFlashFlipped = false; renderGrammarFlashcard(); }
  };
  document.getElementById('gFlashNextBtn').onclick = ()=>{
    if(!isLast){ grammarFlashIdx += 1; grammarFlashFlipped = false; renderGrammarFlashcard(); }
    else { setPresenceStatus('done'); renderGrammarIntro(); }
  };
  document.getElementById('gFlashShuffleBtn').onclick = ()=>{
    grammarFlashQueue = shuffle(grammarFlashQueue); grammarFlashIdx = 0; grammarFlashFlipped = false; renderGrammarFlashcard();
  };
  document.getElementById('gFlashExitBtn').onclick = ()=> renderGrammarIntro();
}

/* ---------------- AKUN TERSIMPAN DI DEVICE INI (biar gak perlu ketik nama tiap login) ---------------- */
function getKnownAccounts(){
  try{
    const raw = localStorage.getItem('quizKnownAccounts');
    const arr = raw ? JSON.parse(raw) : [];
    return Array.isArray(arr) ? arr.filter(n => typeof n === 'string' && n.trim()) : [];
  }catch(e){ return []; }
}
function addKnownAccount(name){
  try{
    let arr = getKnownAccounts().filter(n => n !== name);
    arr.unshift(name);
    if(arr.length > 8) arr = arr.slice(0, 8);
    localStorage.setItem('quizKnownAccounts', JSON.stringify(arr));
  }catch(e){}
}
function removeKnownAccount(name){
  try{
    const arr = getKnownAccounts().filter(n => n !== name);
    localStorage.setItem('quizKnownAccounts', JSON.stringify(arr));
  }catch(e){}
}
function loginAsName(name){
  if(isOwnerDevice()){ finishLogin(name); return; }
  const deviceId = getDeviceId();
  const key = sanitizeNameForKey(name);
  Promise.all([
    db.ref('deviceAccounts/' + deviceId).once('value'),
    db.ref('profiles/' + key + '/ownerDeviceId').once('value'),
    db.ref('profiles/' + key + '/ownerUid').once('value')
  ]).then(([devSnap, ownerSnap, ownerUidSnap])=>{
    const bound = devSnap.val();
    if(bound && bound.name && bound.name !== name){
      // Sebelum ngeblokir, cek dulu apakah akun lama yang ngunci device ini MASIH ADA.
      // Kalau akun itu udah dihapus (baik dihapus sendiri dari HP lain, maupun dihapus
      // admin), device-lock lama ini gak boleh terus-terusan ngeblokir device ini buat
      // bikin/masuk akun baru -- makanya sebelumnya muncul "sudah terdaftar untuk akun
      // Kepo" padahal akun "Kepo" itu sendiri udah gak ada.
      const boundKey = bound.key || sanitizeNameForKey(bound.name);
      db.ref('profiles/' + boundKey).once('value').then((boundProfileSnap)=>{
        if(boundProfileSnap.exists()){
          alert(`Device ini sudah terdaftar untuk akun "${bound.name}". Satu device cuma boleh dipakai untuk 1 akun. Kalau ini device baru atau kamu ganti HP, minta admin buat reset device di panel admin (menu Riwayat Login).`);
          return;
        }
        // Akun lama sudah gak ada -> bersihin ikatan device yang basi ini, lalu lanjut
        // proses klaim akun baru seperti device belum pernah kepakai.
        db.ref('deviceAccounts/' + deviceId).remove().catch(()=>{});
        proceedClaim();
      }).catch(()=> proceedClaim());
      return;
    }
    proceedClaim();

    function proceedClaim(){
      // Cegah nama yang sama diklaim dari device LAIN (1 akun cuma boleh dipakai di 1 device).
      // Kalau device ini yang pertama kali klaim nama ini, ownerDeviceId belum ada -> boleh lanjut & diklaim di bawah.
      const ownerDeviceId = ownerSnap.val();
      if(ownerDeviceId && ownerDeviceId !== deviceId){
        alert(`Nama "${name}" sudah dipakai di device lain. Satu akun cuma boleh dipakai di 1 device. Kalau ini akunmu dan kamu ganti HP, minta admin buat reset device di panel admin (menu Riwayat Login), atau pakai nama lain.`);
        return;
      }
      db.ref('deviceAccounts/' + deviceId).set({
        name: name, key: key, registeredAt: firebase.database.ServerValue.TIMESTAMP
      }).catch(()=>{});
      if(!ownerDeviceId){
        db.ref('profiles/' + key + '/ownerDeviceId').set(deviceId).catch(()=>{});
      }
      // Tandai kepemilikan akun pakai auth.uid juga (dipakai Firebase Rules buat ngunci
      // profil/leaderboard-nya biar cuma pemiliknya sendiri yang bisa nulis ke situ).
      // Sebelumnya field ini gak pernah ditulis sama sekali walau sudah dicek di Rules,
      // jadi proteksi "cuma pemilik akun yang bisa edit" itu gak pernah benar-benar jalan.
      // Aman di-backfill kapan pun (bukan cuma pas klaim pertama), karena baris di atas sudah
      // mastiin cuma device yang berhak yang bisa nyampe ke titik ini.
      if(!ownerUidSnap.val()) ensureAccountOwnerUid(key);
      finishLogin(name);
    }
  }).catch(()=> finishLogin(name));
}
/* ---------------- TANDAI KEPEMILIKAN AKUN PAKAI auth.uid ----------------
   Backfill 'ownerUid' di profiles & activityLeaderboard biar Rules Firebase yang udah
   ada ("cuma pemiliknya sendiri yang boleh edit") beneran kepakai. Dipanggil tiap kali
   device yang sudah terverifikasi berhak (lolos cek ownerDeviceId) masuk ke akun ini. */
function ensureAccountOwnerUid(key){
  try{
    const myUid = dbAuth.currentUser && dbAuth.currentUser.uid;
    if(!myUid) return;
    db.ref('profiles/' + key + '/ownerUid').once('value').then((snap)=>{
      if(!snap.val()) db.ref('profiles/' + key + '/ownerUid').set(myUid).catch(()=>{});

function submitRegisterAccount(){
  const nameInput = document.getElementById('authNameInput');
  const name = (nameInput.value || '').trim();
  const pass = document.getElementById('authPassInput').value || '';
  const confirmPass = document.getElementById('authPassConfirmInput').value || '';
  setAuthError('');
  if(!name){ setAuthError('Nama gak boleh kosong.'); nameInput.focus(); return; }
  if(pass.length < 4){ setAuthError('Password minimal 4 karakter.'); return; }
  if(pass !== confirmPass){ setAuthError('Password & konfirmasi gak sama.'); return; }
  const btn = document.getElementById('authSubmitBtn');
  btn.disabled = true; btn.textContent = 'Memeriksa...';
  const key = sanitizeNameForKey(name);
  Promise.all([
    db.ref('profiles/' + key).once('value'),
    getAccountSecret(key)
  ]).then(([profSnap, secret])=>{
    if(profSnap.exists() || secret){
      btn.disabled = false; btn.textContent = 'Daftar & Mulai →';
      setAuthError('Nama ini sudah dipakai. Coba nama lain, atau pindah ke tab "Masuk" kalau ini akunmu.');
      return;
    }
    setAccountPassword(name, pass).then(()=>{
      loginAsName(name);
    }).catch((err)=>{
      btn.disabled = false; btn.textContent = 'Daftar & Mulai →';
      setAuthError('Gagal mendaftar: ' + err.message);
    });
  }).catch((err)=>{
    btn.disabled = false; btn.textContent = 'Daftar & Mulai →';
    setAuthError(authErrorMessage(err, 'memeriksa nama'));
  });
}

function submitLoginAccount(){
  const nameInput = document.getElementById('authNameInput');
  const name = (nameInput.value || '').trim();
  const pass = document.getElementById('authPassInput').value || '';
  setAuthError('');
  if(!name){ setAuthError('Nama gak boleh kosong.'); nameInput.focus(); return; }
  const btn = document.getElementById('authSubmitBtn');
  btn.disabled = true; btn.textContent = 'Memeriksa...';
  const key = sanitizeNameForKey(name);
  Promise.all([
    db.ref('profiles/' + key).once('value'),
    getAccountSecret(key)
  ]).then(([profSnap, secret])=>{
    const profileExists = profSnap.exists();
    if(!profileExists && !secret){
      btn.disabled = false; btn.textContent = 'Masuk →';
      setAuthError('Akun belum ada. Coba tab "Daftar Akun Baru" dulu ya.');
      return;
    }
    // Admin (sudah login lewat 🔑 Admin) boleh masuk ke akun siapa pun tanpa password.
    if(isAdminBypass){ loginAsName(name); return; }
    if(!secret){
      // Akun lama, dibuat sebelum fitur password ini ada -> amankan sekarang pakai
      // password yang baru saja diketik di form (perlakukan seperti "buat password pertama kali").
      if(pass.length < 4){
        btn.disabled = false; btn.textContent = 'Masuk →';
        setAuthError('Akun ini belum punya password. Ketik password baru (min. 4 karakter) di atas, lalu tekan Masuk lagi buat mengamankan akunmu.');
        return;
      }
      setAccountPassword(name, pass).then(()=> loginAsName(name)).catch((err)=>{
        btn.disabled = false; btn.textContent = 'Masuk →';
        setAuthError('Gagal menyimpan password: ' + err.message);
      });
      return;
    }
    if(!pass){
      btn.disabled = false; btn.textContent = 'Masuk →';
      setAuthError('Masukkan password akunmu.');
      return;
    }
    if(secret.password !== pass){
      btn.disabled = false; btn.textContent = 'Masuk →';
      setAuthError('Password salah. Coba lagi.');
      return;
    }
    loginAsName(name);
  }).catch((err)=>{
    btn.disabled = false; btn.textContent = 'Masuk →';
    setAuthError(authErrorMessage(err, 'memeriksa akun'));
  });
}

/* ---------------- PESAN ERROR AKUN YANG LEBIH JELAS ----------------
   Sebelumnya pesan error daftar/masuk akun selalu generik ("Gagal memeriksa nama. Coba
   lagi.") apa pun penyebabnya, jadi peserta/admin gak pernah tahu apa yang sebenarnya
   salah (login anonim gagal? offline? Firebase Rules nolak?). Sekarang alasan asli dari
   Firebase ikut ditampilkan supaya lebih gampang didiagnosis & diperbaiki. */
function authErrorMessage(err, action){
  const code = err && err.code;
  if(code === 'PERMISSION_DENIED' || (err && /permission[_ ]denied/i.test(err.message || ''))){
    return 'Gagal ' + action + ': akses ke database ditolak (PERMISSION_DENIED). Kemungkinan Firebase Rules atau login anonim belum aktif — coba refresh halaman, atau hubungi admin.';
  }
  if(dbAuthError){
    return 'Gagal ' + action + ': belum berhasil terhubung ke server (' + (dbAuthError.code || dbAuthError.message || 'unknown') + '). Cek koneksi internet lalu coba lagi.';
  }
  const detail = (err && (err.code || err.message)) ? (' (' + (err.code || err.message) + ')') : '';
  return 'Gagal ' + action + detail + '. Coba lagi.';
}

/* ---------------- VERIFIKASI AKUN MASIH ADA DI SERVER ----------------
   Kalau admin pernah pencet "Hapus/Restart Semua Akun Peserta", data profil di Firebase
   kehapus, TAPI nama yang tersimpan di localStorage device peserta gak ikut kehapus
   (gak bisa dihapus dari jarak jauh oleh admin). Tanpa pengecekan ini, peserta yang device-nya
   masih nyimpen nama lama akan dianggap "sudah login" terus, padahal profilnya udah gak ada.
   Makanya tiap mau masuk app, kita cek dulu ke Firebase: profil dgn nama ini masih ada gak?
   Kalau sudah gak ada -> hapus cache nama lokal & paksa daftar ulang dari 0 (nama gate muncul). */
function verifyProfileStillExists(name, onStillExists){
  const key = sanitizeNameForKey(name);
  db.ref('profiles/' + key).once('value').then((snap)=>{
    if(snap.exists()){
      const p = snap.val();
      if(!p.ownerUid && p.ownerDeviceId === getDeviceId()) ensureAccountOwnerUid(key);
      if(isProfileComplete(p)){
        onStillExists();
      } else {
        // Profil ada tapi data wajibnya belum lengkap (misal admin baru aktifkan field
        // wajib ini setelah peserta sempat daftar) -> minta lengkapi dulu sebelum lanjut.
        renderProfileEdit(()=>{ startPresence(name); enterApp(); }, true);
      }
    } else {
      try{
        localStorage.removeItem('quizUserName');
        localStorage.removeItem('quizKnownAccounts');
      }catch(e){}
      renderNameGate();
    }
  }).catch(()=>{
    // Gagal cek (misal lagi offline) -> jangan blokir peserta, anggap masih ada biar gak macet.
    onStillExists();
  });
}

/* ---------------- SRS: LATIHAN CERDAS (prioritas kata yang sering salah/belum pernah dicoba) ---------------- */
function buildSrsPool(basePool, stats){
  const scored = basePool.map((it)=>{
    const s = stats[itemStatKey(it)] || {};
    const wrong = s.wrong || 0;
    const correct = s.correct || 0;
    const seen = wrong + correct;
    const score = seen === 0 ? 1 : (wrong * 3 - correct);
    return { it, score };
  });
  scored.sort((a,b)=> b.score - a.score);
  const cut = Math.max(1, Math.ceil(scored.length * 0.6));
  const top = shuffle(scored.slice(0, cut).map(x=>x.it));
  const rest = shuffle(scored.slice(cut).map(x=>x.it));
  return top.concat(rest);
}
function startSrsQuiz(pool){
  const name = getSavedName();
  const key = sanitizeNameForKey(name);
  const btn = document.getElementById('startBtn');
  if(btn){ btn.disabled = true; btn.textContent = 'Menyiapkan soal cerdas...'; }
  db.ref('userItemStats/' + key).once('value').then((snap)=>{
    const stats = snap.val() || {};
    const srsPool = buildSrsPool(pool, stats);
    activePool = srsPool;
    queue = srsPool;
    roundMissed = [];
    idx = 0;
    roundNumber = 0;
    statusVal.textContent = "OPEN BOOK";
    setPresenceStatus('in_progress');
    setPresenceMode('Mengerjakan Latihan Cerdas (SRS)');
    renderQuestion();
  }).catch(()=>{
    startMainQuiz(pool);
  });
}

/* ---------------- MODE HAFALAN (flashcard) ---------------- */
let flashQueue = [];
let flashIdx = 0;
let flashFlipped = false;
let flashCountedKeys = new Set(); // biar 1 kartu cuma dihitung 1x ke leaderboard walau dibolak-balik

// Sound cara baca yang benar (pakai suara bawaan browser/HP, gratis & tanpa file audio)
function speakFlashWord(text, btnEl){
  try{
    if(typeof speechSynthesis === 'undefined' || !text) return;
    speechSynthesis.cancel(); // hentikan suara sebelumnya biar gak numpuk
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'en-US';
    utter.rate = 0.85; // sedikit lebih pelan biar jelas cara bacanya
    if(btnEl){
      btnEl.classList.add('playing');
      utter.onend = ()=> btnEl.classList.remove('playing');
      utter.onerror = ()=> btnEl.classList.remove('playing');
    }
    speechSynthesis.speak(utter);
  }catch(e){ /* diam aja kalau HP gak support TTS */ }
}

function startFlashcards(pool){
  flashQueue = shuffle(pool);
  flashIdx = 0;
  flashFlipped = false;
  flashCountedKeys = new Set();
  setPresenceStatus('in_progress');
  setPresenceMode('Mode Hafalan (Flashcard)');
  statusVal.textContent = "HAFALAN";
  renderFlashcard();
}

function renderFlashcard(){
  if(flashQueue.length === 0){
    card.innerHTML = `<div class="center-stack"><p class="intro-desc">Belum ada kartu untuk pilihan ini.</p><button class="btn ghost" id="flashBackBtn">← Kembali</button></div>`;
    document.getElementById('flashBackBtn').onclick = ()=>{ setPresenceStatus('idle'); renderIntro(); };
    return;
  }
  const item = flashQueue[flashIdx];
  const langTag = flashFlipped ? 'BAHASA INGGRIS' : 'BAHASA INDONESIA';
  const word = flashFlipped ? item.en : item.id;
  const isLast = flashIdx === flashQueue.length - 1;
  const phonHtml = (flashFlipped && item.ph) ? `<div class="flash-phonetic">${item.ph}</div>` : '';
  // Sound cara baca (TTS) — sekarang aktif buat Bulan 1 & Bulan 2
  const canSpeak = flashFlipped && (item.month === 1 || item.month === 2) && item.en && (typeof speechSynthesis !== 'undefined');
  const soundBtnHtml = canSpeak ? `<button type="button" class="flash-sound-btn" id="flashSoundBtn">🔊 Dengarkan Cara Baca</button>` : '';

  card.innerHTML = `
    <div class="reset-row"><button class="reset-btn" id="flashExitBtn">✕ Selesai</button></div>
    <div class="progress-row">
      <span>KARTU ${flashIdx+1} / ${flashQueue.length}</span>
    </div>
    <div class="section-tag">${item.tag}</div>${monthBadgeHtml(item)}
    <div class="flash-card ${flashFlipped ? 'flipped' : ''}" id="flashCardEl">
      <div class="flash-lang-tag">${langTag}</div>
      <div class="flash-word">${word}</div>
      ${phonHtml}
      ${!flashFlipped ? '<div class="flash-hint">👆 Tap kartu untuk lihat jawabannya</div>' : ''}
    </div>
    ${soundBtnHtml}
    <div class="flash-nav-row">
      <button class="flash-nav-btn" id="flashPrevBtn" ${flashIdx===0?'disabled':''}>← Sebelumnya</button>
      <button class="flash-nav-btn" id="flashShuffleBtn">🔀 Acak</button>
      <button class="flash-nav-btn primary" id="flashNextBtn">${isLast ? 'Selesai ✓' : 'Berikutnya →'}</button>
    </div>
  `;

  document.getElementById('flashCardEl').onclick = ()=>{
    flashFlipped = !flashFlipped;
    // Catatan: kartu flashcard sengaja TIDAK dihitung ke leaderboard aktivitas / XP lagi —
    // flashcard cuma dibolak-balik lihat jawaban (gak ada "benar/salah"), sedangkan
    // leaderboard sekarang cuma menghitung soal yang dijawab BENAR di mode kuis/ujian/grammar.
    renderFlashcard();
  };
  if(canSpeak){
    const soundBtn = document.getElementById('flashSoundBtn');
    soundBtn.onclick = (e)=>{ e.stopPropagation(); speakFlashWord(item.en, soundBtn); };
  }
  document.getElementById('flashPrevBtn').onclick = ()=>{
    if(flashIdx > 0){ flashIdx -= 1; flashFlipped = false; renderFlashcard(); }
  };
  document.getElementById('flashNextBtn').onclick = ()=>{
    if(!isLast){ flashIdx += 1; flashFlipped = false; renderFlashcard(); }
    else { setPresenceStatus('done'); renderIntro(); }
  };
  document.getElementById('flashShuffleBtn').onclick = ()=>{
    flashQueue = shuffle(flashQueue); flashIdx = 0; flashFlipped = false; renderFlashcard();
  };
  document.getElementById('flashExitBtn').onclick = ()=>{ setPresenceStatus('idle'); renderIntro(); };
}

/* ---------------- MODE ANAK-ANAK: 2 opsi, tanpa waktu, feedback selalu positif ---------------- */
let kidsQueue = [];
let kidsIdx = 0;
let kidsScore = 0;
let kidsAnswered = false;

function startKidsQuiz(pool){
  if(pool.length === 0){ renderIntro(); return; }
  kidsQueue = shuffle(pool);
  kidsIdx = 0;
  kidsScore = 0;
  kidsAnswered = false;
  setPresenceStatus('in_progress');
  setPresenceMode('Mode Anak-Anak (Kuis)');
  statusVal.textContent = "MAIN YUK";
  renderKidsQuestion();
}

function buildKidsOptions(correctItem, pool){
  const distractorPool = pool.filter(p => p.en !== correctItem.en);
  const wrongPick = shuffle(distractorPool)[0];
  const options = shuffle([correctItem, wrongPick || correctItem]);
  return options;
}

function renderKidsQuestion(){
  kidsAnswered = false;
  if(kidsIdx >= kidsQueue.length){ renderKidsFinish(); return; }
  const item = kidsQueue[kidsIdx];
  const optionPool = selectedKidsCategory === 'all' ? KIDS_ITEMS.filter(it=>it.tag===item.tag) : kidsQueue;
  const options = buildKidsOptions(item, optionPool.length > 1 ? optionPool : kidsQueue);

  card.innerHTML = `
    <div class="reset-row"><button class="reset-btn" id="kidsExitBtn">✕ Selesai</button></div>
    <div class="progress-row"><span>SOAL ${kidsIdx+1} / ${kidsQueue.length}</span></div>
    <div class="kids-emoji-big">${item.emoji}</div>
    <div class="kids-question">Bahasa Inggrisnya "${item.id}" apa hayo?</div>
    <div class="kids-options" id="kidsOptionsWrap">
      ${options.map((opt,i)=>`<button class="kids-opt" data-en="${opt.en.replace(/"/g,'&quot;')}" data-idx="${i}" type="button">${opt.en}</button>`).join('')}
    </div>
    <div class="kids-feedback" id="kidsFeedback"></div>
  `;

  document.querySelectorAll('.kids-opt').forEach(btn=>{
    btn.onclick = ()=>{
      if(kidsAnswered) return;
      kidsAnswered = true;
      const isCorrect = btn.dataset.en === item.en;
      const feedback = document.getElementById('kidsFeedback');
      document.querySelectorAll('.kids-opt').forEach(b=>{
        b.disabled = true;
        if(b.dataset.en === item.en) b.classList.add('kids-correct');
      });
      if(isCorrect){
        kidsScore += 1;
        btn.classList.add('kids-correct');
        feedback.innerHTML = '🎉 Hebat, benar!';
        feedback.className = 'kids-feedback kids-feedback-good';
      } else {
        btn.classList.add('kids-wrong');
        feedback.innerHTML = `😊 Belum tepat, yang benar "${item.en}". Yuk coba lagi di soal berikutnya!`;
        feedback.className = 'kids-feedback kids-feedback-try';
      }
      setTimeout(()=>{ kidsIdx += 1; renderKidsQuestion(); }, 1400);
    };
  });
  document.getElementById('kidsExitBtn').onclick = ()=>{ setPresenceStatus('idle'); renderIntro(); };
}

function renderKidsFinish(){
  setPresenceStatus('done');
  const stars = kidsScore >= kidsQueue.length ? '🌟🌟🌟' : (kidsScore >= kidsQueue.length/2 ? '🌟🌟' : '🌟');
  card.innerHTML = `
    <div class="center-stack">
      <div class="kids-emoji-big">${stars}</div>
      <h1 class="intro-title">Kamu hebat! 🎉</h1>
      <p class="intro-desc">Benar ${kidsScore} dari ${kidsQueue.length} soal. Mau main lagi?</p>
      <button class="btn kids-start-btn" id="kidsAgainBtn">Main Lagi →</button>
      <button class="btn ghost" id="kidsBackBtn">Kembali ke Menu</button>
    </div>
  `;
  document.getElementById('kidsAgainBtn').onclick = ()=>{
    const pool = selectedKidsCategory === 'all' ? KIDS_ITEMS : KIDS_ITEMS.filter(it=>it.tag === selectedKidsCategory);
    startKidsQuiz(pool);
  };
  document.getElementById('kidsBackBtn').onclick = renderIntro;
}

function clearTimer(){ if(timerInterval){ clearInterval(timerInterval); timerInterval = null; } }

function monthBadgeHtml(item){
  return `<span class="month-badge">${MONTH_LABEL[item.month]}</span>`;
}

function renderQuestion(){
  clearTimer();
  answered = false;
  if(idx >= queue.length){ finishRound(startRetryRound); return; }
  const item = queue[idx];
  const options = buildOptions(item, activePool);
  timeLeft = 10;

  const dotsHtml = queue.map((_,i)=>{
    let cls = 'dot';
    if(i < idx) cls += ' done';
    else if(i === idx) cls += ' current';
    return `<span class="${cls}"></span>`;
  }).join('');

  card.innerHTML = `
    <div class="reset-row"><button class="reset-btn" id="resetBtn">↺ Reset</button></div>
    <div class="progress-row">
      <span>${roundNumber===0 ? 'SOAL' : 'ULANGI'} ${idx+1} / ${queue.length}</span>
      <div class="dots">${dotsHtml}</div>
    </div>
    ${timedMode ? `
    <div class="timer-wrap">
      <div class="flap mono" id="flapTime">${timeLeft}</div>
      <div class="timer-bar-bg"><div class="timer-bar" id="timerBar"></div></div>
    </div>` : ''}
    <div class="section-tag">${item.tag}</div>${monthBadgeHtml(item)}
    <div class="question">Terjemahkan ke Bahasa Inggris:</div>
    <div class="question-word">"${item.id}"</div>
    <div class="options" id="optionsWrap">
      ${options.map((opt,i)=>`
        <button class="opt" data-val="${opt.replace(/"/g,'&quot;')}">
          <span class="letter">${String.fromCharCode(65+i)}</span>
          <span>${opt}</span>
        </button>
      `).join('')}
    </div>
  `;

  document.getElementById('resetBtn').onclick = ()=>{ clearTimer(); renderIntro(); };

  document.querySelectorAll('#optionsWrap .opt').forEach(btn=>{
    btn.addEventListener('click', ()=> handleAnswer(btn.dataset.val, item));
  });

  if(timedMode){ startTimer(()=> handleAnswer(null, item)); }
}

function startTimer(onTimeout){
  const flap = document.getElementById('flapTime');
  const bar = document.getElementById('timerBar');
  timerInterval = setInterval(()=>{
    timeLeft -= 1;
    if(flap) flap.textContent = timeLeft;
    if(bar) bar.style.width = (timeLeft/10*100)+'%';
    if(timeLeft <= 3){
      if(flap) flap.classList.add('low');
      if(bar) bar.classList.add('low');
    }
    if(timeLeft <= 0){
      clearTimer();
      onTimeout();
    }
  },1000);
}

function handleAnswer(selected, item){
  if(answered) return;
  answered = true;
  clearTimer();

  const isCorrect = selected === item.en;
  document.querySelectorAll('#optionsWrap .opt').forEach(btn=>{
    btn.disabled = true;
    if(btn.dataset.val === item.en){
      btn.classList.add('correct');
    } else if(btn.dataset.val === selected && !isCorrect){
      btn.classList.add('wrong');
    }
  });

  if(roundNumber === 0){ recordQuestionStat(item, isCorrect); }
  if(!isCorrect){ roundMissed.push(item); }

  setTimeout(()=>{
    idx += 1;

}

function normalizeGrammarExamItem(g){
  // Disamakan bentuknya kayak item vocab (id/en/tag/month) supaya bisa lewat pipeline
  // ujian yang sama (rekam statistik, tampilan section-tag, dst) tanpa duplikasi kode.
  return {
    id: g.q, en: g.opts[g.a], tag: 'Grammar · ' + g.category, month: 0,
    kind: 'grammar', category: g.category, level: g.level, mcOptions: shuffle(g.opts.slice())
  };
}
function grammarExamPool(category){
  const pool = (!category || category === 'all')
    ? GRAMMAR_QUIZ_QUESTIONS
    : GRAMMAR_QUIZ_QUESTIONS.filter(q => q.category === category);
  return pool.map(normalizeGrammarExamItem);
}
function examSourcePool(){
  const cfg = activeExamConfig;
  const source = cfg.source || 'vocab';
  function vocabPool(){
    if(cfg.scope === 'day'){
      return ALL.filter(it => it.month === cfg.month && it.day === cfg.day);
    }
    return ALL;
  }
  if(source === 'grammar') return grammarExamPool(cfg.grammarCategory);
  if(source === 'mix') return vocabPool().concat(grammarExamPool(cfg.grammarCategory));
  return vocabPool();
}

function buildExamQueue(){
  const items = shuffle(examSourcePool());
  return items.map(item => {
    let qType = activeExamConfig.types;
    if(qType === 'both'){ qType = Math.random() < 0.5 ? 'mc' : 'essay'; }
    return { item, qType };
  });
}

function renderExamQuestion(){
  clearTimer();

  if(examIdx >= examQueue.length){ finishExam(); return; }
  const { item, qType } = examQueue[examIdx];
  timeLeft = 10;

  const dotsHtml = examQueue.map((_,i)=>{
    let cls = 'dot';
    if(i < examIdx) cls += ' done';
    else if(i === examIdx) cls += ' current';
    return `<span class="${cls}"></span>`;
  }).join('');

  if(qType === 'mc'){
    const options = item.kind === 'grammar' ? item.mcOptions : buildOptions(item, ALL);
    const questionLabel = item.kind === 'grammar' ? 'Lengkapi kalimat berikut:' : 'Terjemahkan ke Bahasa Inggris:';
    const badgeHtml = item.kind === 'grammar' ? `<span class="month-badge">${escapeHtmlIdx(item.category)}</span>` : monthBadgeHtml(item);
    card.innerHTML = `

      </div>

      </div>

      <div class="question">${questionLabel}</div>
      <div class="question-word">"${escapeHtmlIdx(item.id)}"</div>
      <div class="options" id="optionsWrap">
        ${options.map((opt,i)=>`
          <button class="opt" data-val="${opt.replace(/"/g,'&quot;')}">
            <span class="letter">${String.fromCharCode(65+i)}</span>
            <span>${opt}</span>
          </button>
        `).join('')}
      </div>
    `;
    document.querySelectorAll('#optionsWrap .opt').forEach(btn=>{
      btn.addEventListener('click', ()=> handleExamMcAnswer(btn.dataset.val, item));
    });
    startTimer(()=> handleExamMcAnswer(null, item));
  } else {
    const questionLabel = item.kind === 'grammar' ? 'Lengkapi kalimat berikut (ketik jawabannya):' : 'Ketik terjemahan Bahasa Inggris:';
    const badgeHtml = item.kind === 'grammar' ? `<span class="month-badge">${escapeHtmlIdx(item.category)}</span>` : monthBadgeHtml(item);
    card.innerHTML = `
      <div class="progress-row">
        <span>UJIAN ${examIdx+1} / ${examQueue.length}</span>
        <div class="dots">${dotsHtml}</div>
      </div>

      <div class="question">${questionLabel}</div>
      <div class="question-word">"${escapeHtmlIdx(item.id)}"</div>
      <div class="essay-wrap">
        <input type="text" id="essayInput" class="essay-input" placeholder="Ketik jawabanmu di sini..." autocomplete="off" autocapitalize="off" spellcheck="false" />
        <button class="btn" id="essaySubmitBtn" style="width:100%;">Kirim Jawaban →</button>
        <div id="essayFeedback"></div>
      </div>
    `;
    const input = document.getElementById('essayInput');
    input.focus();
    input.addEventListener('keydown', (e)=>{ if(e.key === 'Enter'){ e.preventDefault(); handleExamEssayAnswer(item); } });
    document.getElementById('essaySubmitBtn').addEventListener('click', ()=> handleExamEssayAnswer(item));
  }
}

function handleExamMcAnswer(selected, item){
  if(answered) return;
  answered = true;
  clearTimer();

  const isCorrect = selected === item.en;
  document.querySelectorAll('#optionsWrap .opt').forEach(btn=>{
    btn.disabled = true;
    if(btn.dataset.val === item.en){
      btn.classList.add('correct');
    } else if(btn.dataset.val === selected && !isCorrect){
      btn.classList.add('wrong');
    }
  });

  recordQuestionStat(item, isCorrect);
  if(isCorrect){ examScore += 1; }

  setTimeout(()=>{
    examIdx += 1;
    renderExamQuestion();
  }, 900);
}

function handleExamEssayAnswer(item){
  if(answered) return;
  answered = true;

  const input = document.getElementById('essayInput');
  const rawVal = input ? input.value : '';
  const isCorrect = normalizeAnswer(rawVal).length > 0 && normalizeAnswer(rawVal) === normalizeAnswer(item.en);

  if(input){ input.disabled = true; input.classList.add(isCorrect ? 'correct' : 'wrong'); }
  const submitBtn = document.getElementById('essaySubmitBtn');
  if(submitBtn) submitBtn.disabled = true;

  const feedback = document.getElementById('essayFeedback');
  if(feedback){
    feedback.innerHTML = isCorrect
      ? `<div class="essay-feedback correct">✓ Benar! — ${item.en}</div>`
      : `<div class="essay-feedback wrong">✕ Kurang tepat. Jawaban: <b>${item.en}</b></div>`;
  }

  recordQuestionStat(item, isCorrect);
  if(isCorrect){ examScore += 1; }

  setTimeout(()=>{
    examIdx += 1;
    renderExamQuestion();
  }, 1200);
}

function finishExam(){
  clearTimer();
  setPresenceStatus('done');
  statusVal.textContent = "UJIAN SELESAI";
  const name = getSavedName();
  const key = sanitizeNameForKey(name) + '_' + Math.random().toString(36).slice(2,8);
  const durationMs = examStartedAt ? (Date.now() - examStartedAt) : null;
  const examRecord = {
    name: name,
    score: examScore,
    total: examTotal,
    durationMs: durationMs,
    mandiri: examFlowType === 'mandiri',
    cfgScope: activeExamConfig.scope,
    cfgMonth: activeExamConfig.month,
    cfgDay: activeExamConfig.day,
    cfgTypes: activeExamConfig.types,
    cfgSource: activeExamConfig.source || 'vocab',
    cfgGrammarCategory: activeExamConfig.grammarCategory || 'all',
    finishedAt: firebase.database.ServerValue.TIMESTAMP
  };
  db.ref('examScores/' + key).set(examRecord);
  myServerExamRecords.push(examRecord); // biar kunci ujian langsung kedeteksi tanpa nunggu refresh
  pushScoreHistory({
    mode: 'exam',
    scope: activeExamConfig.scope,
    month: activeExamConfig.month,
    day: activeExamConfig.day,
    score: examScore,
    total: examTotal,
    durationMs: durationMs
  });
  if(examFlowType === 'mandiri'){
    setSelfExamLockData(activeExamConfig, { score: examScore, total: examTotal });
  } else {
    setExamLockData({ signature: examConfigSignature(), score: examScore, total: examTotal });
  }
  renderExamResult();
}

function escapeHtmlIdx(str){
  return String(str).replace(/[&<>"']/g, (c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function formatDuration(ms){
  if(ms === null || ms === undefined) return '-';
  const totalSec = Math.round(ms/1000);
  const m = Math.floor(totalSec/60);
  const s = totalSec%60;
  return m > 0 ? `${m}m ${s}d` : `${s}d`;
}

const RANK_MEDAL = { 0: '🥇', 1: '🥈', 2: '🥉' };
function sortLeaderboard(arr){
  return arr.slice().sort((a,b)=>{
    if(b.score !== a.score) return b.score - a.score; // skor benar dulu
    const da = (a.durationMs === null || a.durationMs === undefined) ? Infinity : a.durationMs;
    const db_ = (b.durationMs === null || b.durationMs === undefined) ? Infinity : b.durationMs;
    return da - db_; // lalu yang paling cepat
  });
}
function renderExamLeaderboardInto(elId){
  if(examLeaderboardRef){ examLeaderboardRef.off(); }
  examLeaderboardRef = db.ref('examScores');
  examLeaderboardRef.on('value', (snapshot)=>{
    const data = snapshot.val() || {};
    const arr = sortLeaderboard(Object.values(data).filter(u=>u && u.name));
    const lbEl = document.getElementById(elId);
    if(!lbEl) return;
    if(arr.length === 0){
      lbEl.innerHTML = '<div class="lb-empty-light">Belum ada skor.</div>';
      return;
    }
    lbEl.innerHTML = arr.map((u,i)=>{
      const displayName = (u.name === getSavedName()) ? 'Anda' : escapeHtmlIdx(u.name);
      return `<div class="lb-item-light"><span>${RANK_MEDAL[i] || (i+1)+'.'} ${displayName}</span><span>${u.score}/${u.total} · ⏱ ${formatDuration(u.durationMs)}</span></div>`;
    }).join('');
  });
}

/* ---------------- MATCHING MODE ---------------- */
function buildMatchBatches(items){
  const shuffled = shuffle(items);
  const batches = [];
  for(let i=0;i<shuffled.length;i+=BATCH_SIZE){
    batches.push(shuffled.slice(i, i+BATCH_SIZE));
  }
  return batches;
}

function startMatchQuiz(pool){
  activePool = pool;
  matchBatches = buildMatchBatches(pool);
  matchBatchIndex = 0;
  matchRoundMissedIds = new Set();
  roundNumber = 0;
  statusVal.textContent = "OPEN BOOK";
  setPresenceStatus('in_progress');
  setPresenceMode('Mengerjakan Kuis (Penjodohan)');
  renderMatchBatch();
}

function startMatchRetry(missedItems){
  matchBatches = buildMatchBatches(missedItems);
  matchBatchIndex = 0;
  matchRoundMissedIds = new Set();
  roundNumber += 1;
  statusVal.textContent = "REVIEW " + roundNumber;
  renderMatchBatch();
}

function renderMatchBatch(){
  if(matchBatchIndex >= matchBatches.length){
    finishMatchRound();
    return;
  }
  const batch = matchBatches[matchBatchIndex];
  matchLeft = batch;
  matchRight = shuffle(batch);
  matchedIds = new Set();
  selectedLeftIdx = null;
  renderMatchUI();
}

function matchButtonHtml(item, side, i){
  const label = side==='left' ? item.id : item.en;
  return `<button class="match-item" data-side="${side}" data-idx="${i}">${label}</button>`;
}

function renderMatchUI(){
  card.innerHTML = `
    <div class="reset-row"><button class="reset-btn" id="resetBtn">↺ Reset</button></div>
    <div class="progress-row">
      <span>${roundNumber===0 ? 'BABAK' : 'ULANGI'} ${matchBatchIndex+1} / ${matchBatches.length}</span>
      <span class="mono">${matchedIds.size}/${matchLeft.length} cocok</span>
    </div>
    <div class="section-tag">PENJODOHAN</div>
    <div class="question">Cocokkan Bahasa Indonesia dengan Bahasa Inggris:</div>
    <div class="question-word" style="font-size:15px;font-weight:600;margin-bottom:14px;color:var(--accent-dim);font-family:'Nunito',sans-serif;">Pilih satu kata di kiri, lalu pasangannya di kanan.</div>
    <div class="match-grid">
      <div class="match-col">${matchLeft.map((it,i)=>matchButtonHtml(it,'left',i)).join('')}</div>
      <div class="match-col">${matchRight.map((it,i)=>matchButtonHtml(it,'right',i)).join('')}</div>
    </div>
  `;
  document.getElementById('resetBtn').onclick = ()=>{ clearTimer(); renderIntro(); };
  document.querySelectorAll('.match-item').forEach(btn=>{
    btn.addEventListener('click', ()=> handleMatchClick(btn));
  });
}

function handleMatchClick(btn){
  const side = btn.dataset.side;
  const i = parseInt(btn.dataset.idx, 10);

  if(side === 'left'){
    if(btn.disabled) return;
    document.querySelectorAll('.match-item[data-side="left"]').forEach(b=>b.classList.remove('selected'));
    selectedLeftIdx = i;
    btn.classList.add('selected');
    return;
  }

  if(btn.disabled) return;
  if(selectedLeftIdx === null) return;

  const leftItem = matchLeft[selectedLeftIdx];
  const rightItem = matchRight[i];
  const leftBtn = document.querySelector(`.match-item[data-side="left"][data-idx="${selectedLeftIdx}"]`);

  if(leftItem.en === rightItem.en){
    matchedIds.add(leftItem.id);
    if(roundNumber === 0){ recordQuestionStat(leftItem, true); }
    if(leftBtn){ leftBtn.classList.remove('selected'); leftBtn.classList.add('correct'); leftBtn.disabled = true; }
    btn.classList.add('correct'); btn.disabled = true;
    selectedLeftIdx = null;
    const progressEl = document.querySelector('.progress-row .mono');
    if(progressEl) progressEl.textContent = `${matchedIds.size}/${matchLeft.length} cocok`;
    if(matchedIds.size === matchLeft.length){
      setTimeout(()=>{ matchBatchIndex += 1; renderMatchBatch(); }, 550);
    }
  } else {
    matchRoundMissedIds.add(leftItem.id);
    if(roundNumber === 0){ recordQuestionStat(leftItem, false); }
    if(leftBtn) leftBtn.classList.add('wrong');
    btn.classList.add('wrong');
    setTimeout(()=>{
      if(leftBtn) leftBtn.classList.remove('wrong','selected');
      btn.classList.remove('wrong');
      selectedLeftIdx = null;
    }, 550);
  }
}

function finishMatchRound(){
  if(roundNumber === 0){ totalMissedFirstPass = matchRoundMissedIds.size; }

  if(matchRoundMissedIds.size === 0){ renderAllCorrect(); return; }

  const missedItems = activePool.filter(it => matchRoundMissedIds.has(it.id));
  const missedCount = missedItems.length;
  statusVal.textContent = "REVISIT";
  card.innerHTML = `
    <div class="center-stack">
      <div class="section-tag" style="background:var(--gold);color:#fff;">${missedCount} SALAH</div>
      <h1 class="intro-title">Hampir khatam!</h1>
      <p class="intro-desc">Kamu salah <b>${missedCount}</b> pasangan. Kamu akan diberi <b>${missedCount} kesempatan ulang</b> (khusus soal yang salah) sampai semua benar.</p>
      <div class="missed-list">
        ${missedItems.map(m=>`<div class="missed-item"><span class="id">${m.id}</span><span class="ans">${m.en}</span></div>`).join('')}
      </div>
      <button class="btn" id="retryBtn">Ulangi Soal yang Salah →</button>
    </div>
  `;
  document.getElementById('retryBtn').onclick = ()=> startMatchRetry(missedItems);
}

/* ---------------- ESSAY MODE ---------------- */
function normalizeAnswer(s){
  return s
    .toLowerCase()
    .trim()
    .replace(/[.,!?;:'"]/g, '')
    .replace(/\s+/g, ' ');
}

function startEssayQuiz(pool){
  activePool = pool;
  queue = shuffle(pool);
  roundMissed = [];
  idx = 0;
  roundNumber = 0;
  statusVal.textContent = "OPEN BOOK";
  setPresenceStatus('in_progress');
  setPresenceMode('Mengerjakan Kuis (Esai)');
  renderEssayQuestion();
}

function startEssayRetry(missedItems){
  queue = shuffle(missedItems);
  roundMissed = [];
  idx = 0;
  roundNumber += 1;
  statusVal.textContent = "REVIEW " + roundNumber;
  renderEssayQuestion();
}

function renderEssayQuestion(){
  clearTimer();
  answered = false;
  if(idx >= queue.length){
    finishRound(startEssayRetry);
    return;
  }
  const item = queue[idx];
  timeLeft = 10;

  const dotsHtml = queue.map((_,i)=>{
    let cls = 'dot';
    if(i < idx) cls += ' done';
    else if(i === idx) cls += ' current';
    return `<span class="${cls}"></span>`;
  }).join('');

  card.innerHTML = `
    <div class="reset-row"><button class="reset-btn" id="resetBtn">↺ Reset</button></div>
    <div class="progress-row">
      <span>${roundNumber===0 ? 'SOAL' : 'ULANGI'} ${idx+1} / ${queue.length}</span>
      <div class="dots">${dotsHtml}</div>
    </div>
    ${timedMode ? `
    <div class="timer-wrap">
      <div class="flap mono" id="flapTime">${timeLeft}</div>
      <div class="timer-bar-bg"><div class="timer-bar" id="timerBar"></div></div>
    </div>` : ''}
    <div class="section-tag">${item.tag}</div>${monthBadgeHtml(item)}
    <div class="question">Ketik terjemahan Bahasa Inggris:</div>
    <div class="question-word">"${item.id}"</div>
    <div class="essay-wrap">
      <input type="text" id="essayInput" class="essay-input" placeholder="Ketik jawabanmu di sini..." autocomplete="off" autocapitalize="off" spellcheck="false" />
      <button class="btn" id="essaySubmitBtn" style="width:100%;">Kirim Jawaban →</button>
      <div id="essayFeedback"></div>
    </div>
  `;

  document.getElementById('resetBtn').onclick = ()=>{ clearTimer(); renderIntro(); };

  const input = document.getElementById('essayInput');
  input.focus();
  input.addEventListener('keydown', (e)=>{
    if(e.key === 'Enter'){ e.preventDefault(); submitEssay(item, false); }
  });
  document.getElementById('essaySubmitBtn').addEventListener('click', ()=> submitEssay(item, false));

  if(timedMode){ startTimer(()=> submitEssay(item, true)); }
}

function submitEssay(item, isTimeout){
  if(answered) return;
  answered = true;
  clearTimer();

  const input = document.getElementById('essayInput');
  const rawVal = isTimeout ? '' : (input ? input.value : '');
  const isCorrect = !isTimeout && normalizeAnswer(rawVal).length > 0 && normalizeAnswer(rawVal) === normalizeAnswer(item.en);

  if(input){ input.disabled = true; input.classList.add(isCorrect ? 'correct' : 'wrong'); }
  const submitBtn = document.getElementById('essaySubmitBtn');
  if(submitBtn) submitBtn.disabled = true;

  const feedback = document.getElementById('essayFeedback');
  if(feedback){
    feedback.innerHTML = isCorrect
      ? `<div class="essay-feedback correct">✓ Benar! — ${item.en}</div>`
      : `<div class="essay-feedback wrong">✕ ${isTimeout ? 'Waktu habis.' : 'Kurang tepat.'} Jawaban: <b>${item.en}</b></div>`;
  }

  if(roundNumber === 0){ recordQuestionStat(item, isCorrect); }
  if(!isCorrect){ roundMissed.push(item); }

  setTimeout(()=>{
    idx += 1;
    renderEssayQuestion();
  }, 1200);
}

/* Tanda titik merah di nav utama kalau ada chat baru masuk */
let igChatBadgeRef = null;
function refreshIgChatBadge(){
  const dot = document.getElementById('igChatDot');
  if(!dot) return;
  const myName = getSavedName();
  if(!myName){ dot.style.display = 'none'; return; }
  const myKey = sanitizeNameForKey(myName);
  if(igChatBadgeRef){ igChatBadgeRef.off(); }
  igChatBadgeRef = db.ref('chat/messages').orderByChild('timestamp').limitToLast(1);
  igChatBadgeRef.on('value', (snap)=>{
    const data = snap.val() || {};
    const last = Object.values(data)[0];
    const lastSeen = parseInt(localStorage.getItem('publicChatSeen') || '0', 10);
    const isUnread = !!(last && last.timestamp > lastSeen && last.name !== myName);
    dot.style.display = isUnread ? 'block' : 'none';
  }, ()=>{ dot.style.display = 'none'; });
}
function refreshIgSearchBadge(){
  const dot = document.getElementById('igSearchDot');
  if(!dot) return;
  const myName = getSavedName();
  if(!myName){ dot.style.display = 'none'; return; }
  const myKey = sanitizeNameForKey(myName);
  db.ref('peerChatMeta/' + myKey).on('value', (snap)=>{
    const data = snap.val() || {};
    let unread = false;
    Object.entries(data).forEach(([otherKey, meta])=>{
      if(!meta || !meta.lastAt || meta.lastSenderKey !== otherKey) return;
      const conv = [myKey, otherKey].sort().join('__');
      const lastSeen = parseInt(localStorage.getItem('peerChatSeen_' + conv) || '0', 10);
      if(meta.lastAt > lastSeen) unread = true;
    });
    dot.style.display = unread ? 'block' : 'none';
  }, ()=>{ dot.style.display = 'none'; });
}
