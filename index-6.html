      { title: 'Pengertian Noun', body: `Noun adalah kata yang menunjukkan orang, tempat, benda, peristiwa, zat, atau sifat/kualitas. Contohnya <i>doctor</i> (orang), <i>tree</i> (benda), <i>party</i> (peristiwa), <i>coal</i> (zat), dan <i>beauty</i> (kualitas). Pada contoh "He is a diligent student", kata <b>student</b> adalah noun karena menunjukkan seseorang.` },
      { title: 'Countable vs Uncountable Noun', body: `Noun dibagi dua kelompok besar: <b>countable noun</b> (bisa dihitung satu, dua, tiga, dst — contoh: an athlete, a plate, two apples, three books) dan <b>uncountable noun</b> (tidak bisa dihitung langsung dengan angka, biasanya berupa zat atau konsep — contoh: flour, water, homework, information). Uncountable noun tidak boleh diberi angka langsung atau ditambah -s/-es.` },
      { title: 'Aturan Countable Noun (C)', body: `1) Noun tunggal harus pakai <b>a/an</b> — "a book" benar, "book" saja (tanpa artikel) salah.<br>2) Noun jamak ditambah <b>s/es</b> — "two apples", "some photos" benar; "three hour" (tanpa s) salah.<br>3) Noun umum ditambah <b>a/an</b> — "I bought a book" benar, "I bought book" salah.<br>4) Noun jamak umum tanpa artikel boleh pakai s/es saja — "I like apples" benar (any apples).<br>5) Noun tunggal/jamak spesifik ditambah <b>the</b> — "The book is black" (buku yang dimaksud sudah jelas/spesifik).` },
      { title: 'Aturan Uncountable Noun (UC)', body: `Uncountable noun (UC) TIDAK BOLEH ditambah s/es atau angka seperti two/three/other numbers. Salah: "two waters", "three informations", "many homeworks". Benar: gunakan kata penunjuk jumlah seperti <b>some, much,</b> atau <b>a piece of</b> — contoh "two waters" → "two glasses of water"; "some information"; "much homework".` },
      { title: 'Aturan Pembentukan Jamak (Plural s/es)', body: `Cara menambahkan s/es tergantung akhiran katanya:<br>• Akhiran vokal +o → tambah -s (radio → radios)<br>• Akhiran konsonan +o → tambah -es (potato → potatoes)<br>• Akhiran -sh, -ch, -ss, -x, -z → tambah -es (dish → dishes, match → matches, box → boxes)<br>• Akhiran -fe/-f → ganti jadi -v, tambah -es (wife → wives, thief → thieves)<br>• Akhiran konsonan + y → ganti y jadi i, tambah -es (city → cities, baby → babies)<br>• Akhiran konsonan biasa → tambah -s saja` },
      { title: 'Irregular Countable Noun (Bentuk Jamak Tidak Beraturan)', body: `Beberapa noun punya bentuk jamak yang tidak mengikuti aturan biasa, harus dihafal:<br>man → men, woman → women, child → children, tooth → teeth, foot → feet, mouse → mice, sheep → sheep (tidak berubah), person → people, fish → fish (tidak berubah).` },
    ]
  },
  {
    month: 1, category: 'Pronoun (Kata Ganti)',
    simple: 'Nah sekarang kita masuk ke pronoun, atau kata ganti. Coba bayangin kalau kita ngomong terus-terusan nyebut nama orang yang sama berkali-kali dalam satu paragraf, pasti kedengeran aneh dan bertele-tele kan. Nah, di situlah fungsi pronoun, dia dipakai buat menggantikan noun yang udah disebutkan sebelumnya, biar kalimatnya lebih enak didengar. Contohnya, Tono is a new student, He is diligent, jadi kata He di kalimat kedua itu menggantikan Tono yang udah disebut di kalimat sebelumnya. Nah, pronoun ini sebenarnya dibagi jadi lima jenis, dan ini penting banget dihafal satu-satu. Yang pertama subject pronoun, dipakai sebagai subjek kalimat, contohnya I, you, he, she, it, we, they. Yang kedua object pronoun, dipakai sebagai objek, contohnya me, you, him, her, it, us, them. Yang ketiga possessive adjective, dipakai buat nunjukin kepemilikan tapi wajib diikuti kata benda setelahnya, contohnya my bag, artinya tas saya, di situ ada kata bag setelah my. Yang keempat possessive pronoun, juga nunjukin kepemilikan tapi dia berdiri sendiri tanpa perlu kata benda lagi, contohnya mine, artinya punya saya, kalau kita bilang this is mine, nggak perlu nambahin kata benda lagi setelahnya. Dan yang kelima reflexive pronoun, kata ganti diri sendiri, contohnya myself, yourself, himself, herself, dan seterusnya. Coba kita bandingin, my bag itu possessive adjective karena diikuti kata benda, tapi kalau kita bilang this bag is mine, nah mine itu possessive pronoun karena berdiri sendiri. Terus buat reflexive, contohnya I entertain myself, artinya saya menghibur diri saya sendiri. Oh iya, satu lagi yang sering ditanyain, soal apostrof buat kepunyaan. Kalau kata bendanya udah jamak dan berakhiran s, kayak friends, apostrofnya cukup ditaruh di belakang aja tanpa tambahan s lagi, jadi friends\' book. Tapi kalau nama orang yang berakhiran s, kayak Anis, boleh pakai Anis\'s picture, atau boleh juga cuma Anis\' picture aja, dua-duanya sama-sama dipakai kok.',
    sections: [
      { title: 'Pengertian Pronoun', body: `Pronoun adalah kata yang digunakan untuk menggantikan noun yang sudah disebutkan sebelumnya, supaya kalimat tidak terdengar berulang-ulang. Contoh: "Tono is a new student. <b>He</b> is diligent." Kata <b>He</b> di kalimat kedua menggantikan "Tono" yang sudah disebut di kalimat pertama.` },
      { title: '5 Kategori Pronoun', body: `Pronoun terbagi menjadi 5 jenis: <b>Subject Pronoun</b> (I, you, he, she, it, we, they — sebagai subjek), <b>Object Pronoun</b> (me, you, him, her, it, us, them — sebagai objek), <b>Possessive Adjective</b> (my, your, his, her, its, our, their — sebelum noun untuk menunjukkan kepemilikan), <b>Possessive Pronoun</b> (mine, yours, his, hers, its, ours, theirs — menggantikan "kepunyaan siapa" tanpa perlu noun lagi), dan <b>Reflexive Pronoun</b> (myself, yourself, himself, herself, itself, ourselves, yourselves, themselves — kata ganti "diri sendiri").` },
      { title: 'Contoh Perbandingan Penggunaan', body: `Subject: "<b>I</b> take a bath." → Object: "He calls <b>me</b>." → Possessive Adjective: "This is <b>my</b> bag." → Possessive Pronoun: "I take my friend's smartphone, not <b>yours</b>." → Reflexive: "I entertain <b>myself</b>." Perhatikan bahwa possessive adjective selalu diikuti noun (my bag), sedangkan possessive pronoun berdiri sendiri tanpa noun (mine).` },
      { title: 'Catatan Apostrof (Kepemilikan dengan \'s)', body: `Untuk noun yang berakhiran s seperti kata jamak "friends", tanda apostrof cukup ditaruh di akhir tanpa tambahan s lagi: "friends' book". Untuk nama yang berakhiran s seperti "Anis", boleh pakai "Anis's picture" ATAU cukup "Anis' picture" (apostrof saja tanpa s tambahan) — keduanya sama-sama dipakai.` },
      { title: 'Tabel Lengkap 5 Bentuk Pronoun per Orang', body: `Supaya gampang dihafal, berikut bentuk pronoun untuk tiap subjek (Subject → Object → Possessive Adjective → Possessive Pronoun → Reflexive):<br>• <b>I</b> → me → my → mine → myself<br>• <b>you</b> → you → your → yours → yourself (yourselves untuk jamak)<br>• <b>he</b> → him → his → his → himself<br>• <b>she</b> → her → her → hers → herself<br>• <b>it</b> → it → its → its → itself<br>• <b>we</b> → us → our → ours → ourselves<br>• <b>they</b> → them → their → theirs → themselves` },
      { title: 'Cara Gampang Bedain Possessive Adjective vs Possessive Pronoun', body: `Kuncinya: <b>Possessive Adjective</b> (my, your, his, her, its, our, their) WAJIB diikuti noun/benda setelahnya — tidak boleh berdiri sendiri, contoh "my <b>bag</b>", "her <b>book</b>". Sedangkan <b>Possessive Pronoun</b> (mine, yours, his, hers, its, ours, theirs) dan <b>Reflexive Pronoun</b> (myself, yourself, himself, dst) justru berdiri sendiri TANPA noun setelahnya, karena sudah otomatis menggantikan "kepunyaan siapa" atau "diri sendiri". Contoh: "This pen is <b>mine</b>" (bukan "mine pen"), "I take my pen for <b>myself</b>" (myself berdiri sendiri, bukan diikuti noun lagi).` },
    ]
  },
  {
    month: 1, category: 'Adjective (Kata Sifat)',
    simple: 'Oke, sekarang kita bahas adjective, atau kata sifat. Adjective itu kata yang tugasnya menjelaskan noun atau pronoun, jadi bikin kata benda atau kata ganti itu jadi lebih jelas dan spesifik. Contohnya di kalimat Mike is a new student, He is diligent, kata new dan a itu menjelaskan noun student, sedangkan kata diligent menjelaskan pronoun He. Nah, ada dua aturan penting banget yang harus kalian inget soal adjective ini. Aturan pertama, adjective itu selalu diletakkan sebelum noun yang dia jelaskan, jadi yang benar itu beautiful girl, bukan girl beautiful. Aturan kedua, kalau adjective itu menjelaskan subjek kalimat, bukan langsung nempel di noun-nya, maka wajib ada kata kerja to be, yaitu is, am, atau are, di antara subjek dan adjective-nya. Jadi yang benar itu He is diligent, bukan He diligent doang tanpa is. Selanjutnya, ada juga yang namanya demonstrative adjective, yaitu this, that, these, dan those, yang dipakai buat menunjuk sesuatu. Aturannya gampang, tergantung jarak sama jumlah bendanya. This dipakai untuk benda yang dekat dan tunggal, these untuk benda yang dekat dan jamak, that untuk benda yang jauh dan tunggal, dan those untuk benda yang jauh dan jamak. Nah yang sering salah itu, orang lupa nyesuaiin kata kerja to be-nya sama jumlah bendanya, bukan sama this atau that-nya. Jadi kalau bendanya jamak kayak books, harus pakai are, contohnya These books are mine, bukan This books is mine. Terakhir, ada juga many sama much, yang artinya sama-sama banyak, tapi pemakaiannya beda. Many dipakai buat countable noun, contohnya many books, many people. Much dipakai buat uncountable noun, contohnya much water, much money. Dan ingat, uncountable noun setelah much itu tidak boleh ditambah s, jadi much waters itu salah.',
    sections: [
      { title: 'Pengertian Adjective', body: `Adjective adalah kata yang menjelaskan noun atau pronoun, misalnya kata "a", "new", dan "diligent" pada kalimat "Mike is a new student. He is diligent." Kata "a" dan "new" menjelaskan noun "student", sedangkan "diligent" menjelaskan pronoun "he". Ketika sebuah noun umum diberi adjective seperti "a" dan "new", noun itu jadi lebih spesifik/tertentu.` },
      { title: 'Dua Aturan Utama Adjective', body: `1) Adjective diletakkan <b>sebelum</b> noun yang dijelaskannya — "beautiful girl" benar, "girl beautiful" salah.<br>2) Kalau adjective menjelaskan subjek (bukan langsung menempel di noun), harus ada kata kerja "to be" di antara subjek dan adjective-nya — "He is diligent" benar, "He diligent" salah.` },
      { title: 'Demonstrative Adjective (this, that, these, those)', body: `Demonstrative adjective dipakai untuk menunjuk sesuatu, dan aturannya berdasarkan jarak (dekat/jauh) serta jumlah (tunggal/jamak):<br>• <b>This</b> → untuk sesuatu yang dekat & tunggal ("This book is mine")<br>• <b>These</b> → untuk sesuatu yang dekat & jamak ("These books are mine")<br>• <b>That</b> → untuk sesuatu yang jauh & tunggal ("That pen is mine")<br>• <b>Those</b> → untuk sesuatu yang jauh & jamak ("Those pens are mine")<br>Yang sering salah: kata kerja "to be" (is/are) harus disesuaikan dengan jumlah nounnya, bukan dengan this/that/these/those saja. "This books is mine" salah karena "books" jamak, harusnya "These books are mine".` },
      { title: 'Many vs Much', body: `<b>Many</b> dan <b>much</b> sama-sama berarti "banyak", tapi pemakaiannya beda tergantung jenis nounnya:<br>• <b>Many</b> dipakai untuk <b>countable noun</b> — "many books", "many people", "many children" (benar); "many friend" tanpa -s atau "many money" (uncountable) itu salah.<br>• <b>Much</b> dipakai untuk <b>uncountable noun</b> — "much water", "much money", "much information" (benar); uncountable noun setelah much TIDAK boleh ditambah -s, jadi "much waters" salah.` },
    ]
  },
  {
    month: 1, category: 'Adverb (Kata Keterangan)',
    simple: 'Sekarang kita masuk ke adverb, atau kata keterangan. Adverb itu tugasnya menjelaskan kata kerja, kata sifat, atau adverb lainnya. Contohnya di kalimat He speaks slowly, kata slowly itu adverb yang menjelaskan bagaimana caranya si dia berbicara, yaitu dengan pelan-pelan. Nah, adverb ini ada beberapa jenis, dan tiap jenis punya fungsi beda. Yang pertama, adverb of frequency, dipakai buat jawab pertanyaan seberapa sering sesuatu terjadi. Contohnya always yang artinya selalu, usually yang artinya biasanya, often yang artinya sering, sometimes yang artinya kadang-kadang, seldom yang artinya jarang, dan never yang artinya tidak pernah. Kata-kata ini bisa diletakkan di awal, di tengah, atau di akhir kalimat, tapi paling sering sih di tengah, sebelum kata kerja utamanya. Yang kedua, adverb of manner, dipakai buat menjelaskan bagaimana cara suatu tindakan dilakukan, dan biasanya diletakkan di akhir kalimat. Contohnya quickly yang artinya dengan cepat, fluently yang artinya dengan lancar, dan beautifully yang artinya dengan indah. Tapi hati-hati, ada beberapa kata yang nggak nambah akhiran ly, kayak fast, hard, dan well, itu memang bentuknya udah begitu dari sononya. Dan yang ketiga, adverb of degree, dipakai buat menjelaskan seberapa intens atau seberapa kuat suatu sifat, posisinya biasanya sebelum kata yang dia jelaskan. Contohnya so, really, very, too, pretty, dan quite. Misalnya I\'m so happy today, artinya saya sangat senang hari ini, kata so di situ nunjukin tingkat kesenangannya.',
    sections: [
      { title: 'Pengertian Adverb', body: `Adverb adalah kata yang menjelaskan verb (kata kerja), adjective (kata sifat), atau adverb lain. Contoh pada "He speaks <b>slowly</b>", kata "slowly" adalah adverb yang menjelaskan bagaimana cara verb "speaks" dilakukan, yaitu dengan pelan-pelan.` },
      { title: 'Adverb of Frequency (Seberapa Sering)', body: `Adverb of frequency menjawab pertanyaan "seberapa sering", posisinya bisa di awal, tengah, atau akhir kalimat. Contoh kata: <b>always</b> (selalu — "She always comes on time"), <b>usually</b> (biasanya), <b>often</b> (sering), <b>sometimes</b> (kadang-kadang), <b>seldom</b> (jarang — "My friend seldom eats fried chicken"), <b>never</b> (tidak pernah), dan <b>every ___</b> (setiap ___, misalnya "every day").` },
      { title: 'Adverb of Manner (Bagaimana Cara)', body: `Adverb of manner menjelaskan bagaimana suatu tindakan dilakukan, dan biasanya diletakkan di akhir kalimat. Contoh: <b>quickly</b> ("She runs quickly"), <b>fluently</b> ("I can speak English fluently"), <b>beautifully</b>, <b>badly</b>, <b>fast</b> ("He drove the car fast"), <b>hard</b>, dan <b>well</b> ("I know you well"). Perhatikan "fast", "hard", dan "well" adalah pengecualian — tidak ditambah -ly.` },
      { title: 'Adverb of Degree (Seberapa Intens)', body: `Adverb of degree menjelaskan tingkat/intensitas dari adjective atau adverb lain, posisinya sebelum kata yang dijelaskan. Contoh kata: <b>so</b> ("I'm so happy today"), <b>really</b> ("She is really beautiful"), <b>very</b> ("You are very patient"), <b>too</b> ("This guitar is too expensive"), <b>pretty</b> ("You are pretty smart"), dan <b>quite</b> ("The homework is quite difficult").` },
    ]
  },
  {
    month: 1, category: 'Preposition (Kata Depan)',
    simple: 'Nah sekarang giliran preposition, atau kata depan. Preposition itu kata yang diletakkan sebelum noun buat nunjukin hubungan tempat atau waktu. Contohnya di kalimat He is diligent at school, kata at itu preposition yang diletakkan sebelum noun school. Nah, buat preposition of place, atau kata depan tempat, ada beberapa yang sering dipakai, kayak in yang artinya di dalam, on yang artinya di atas, dan at yang artinya di, tapi biasanya dipakai buat tempat yang lebih spesifik. Terus ada juga beside yang artinya di samping, behind yang artinya di belakang, in front of yang artinya di depan, under yang artinya di bawah, near yang artinya dekat, dan between yang artinya di antara dua hal. Oh iya, ada hal menarik nih soal beside, under, below, above, sama next to. Jadi beside sama under itu biasanya dipakai untuk posisi yang nempel langsung sama bendanya. Tapi below, above, sama next to itu dipakai untuk posisi yang nggak nempel, ada jaraknya. Jadi kalau kucing lagi tiduran nempel di bawah meja, kita pakai under the table, tapi kalau ada lampu gantung di atas meja tanpa nyentuh mejanya, kita pakai above the table. Selanjutnya, buat preposition of time, atau kata depan waktu, polanya gini, in dipakai buat tahun, bulan, pagi, siang, sore, contohnya in 1999, in February, in the morning. On dipakai buat tanggal spesifik atau hari, contohnya on February 5th, on Sunday. Dan at dipakai buat jam, malam, tengah hari, tengah malam, contohnya at 7 o\'clock, at night, at noon. Terakhir, buat alamat rumah, in dipakai buat negara atau kota, on dipakai buat nama jalan tanpa nomor, dan at dipakai buat alamat lengkap dengan nomor rumahnya.',
    sections: [
      { title: 'Pengertian Preposition', body: `Preposition adalah kata yang diletakkan sebelum noun untuk menunjukkan hubungan tempat, waktu, atau posisi. Contoh pada "He is diligent <b>at</b> school", kata "at" adalah preposition yang diletakkan sebelum noun "school".` },
      { title: 'Preposition of Place (Tempat)', body: `Beberapa preposition tempat yang umum: <b>in</b> (di dalam — "The book is in my bag"), <b>on</b> (di atas — "The books are on the table"), <b>at</b> (di — "We do our homework at home"), <b>beside</b> (di samping), <b>behind</b> (di belakang), <b>in front of</b> (di depan), <b>under</b> (di bawah), <b>near</b> (dekat), dan <b>between</b> (di antara dua hal). Catatan khusus: "in" dipakai untuk jail, class, dan bed tanpa "the"; "at" dipakai untuk work, home, dan school tanpa "the".` },
      { title: 'Beside/Under vs Below/Above/Next To: Nempel atau Enggak?', body: `Ada beberapa preposition tempat yang artinya mirip tapi beda soal "nempel" (bersentuhan langsung) atau tidak:<br>• <b>Beside</b> (di samping) dan <b>Under</b> (di bawah) → biasanya untuk posisi yang <b>nempel/bersentuhan langsung</b> dengan objeknya.<br>• <b>Below</b> (di bawah), <b>Above</b> (di atas), dan <b>Next to</b> (di samping) → dipakai untuk posisi yang <b>tidak nempel</b>, ada jarak antara dua objeknya.<br>Contoh: kucing yang duduk menempel di bawah meja pakai "<b>under</b> the table", tapi lampu yang menggantung di atas meja tanpa menyentuhnya pakai "<b>above</b> the table".` },
      { title: 'Preposition of Time (Waktu)', body: `Pola pemakaian preposition waktu:<br>• <b>in</b> + tahun/bulan/pagi/siang/sore ("in 1999", "in February", "in the morning", "in the afternoon", "in the evening")<br>• <b>on</b> + tanggal spesifik/hari ("on February 5th", "on Sunday")<br>• <b>at</b> + jam/malam/tengah hari/tengah malam/jam makan siang ("at 7 o'clock", "at night", "at noon", "at midnight", "at lunchtime")` },
      { title: 'Preposition untuk Alamat', body: `Pola khusus untuk lokasi tempat tinggal:<br>• <b>in</b> + negara ("I live in Indonesia")<br>• <b>in</b> + kota/wilayah ("She lives in Kediri")<br>• <b>on</b> + nama jalan tanpa nomor ("They live on Brawijaya Street")<br>• <b>at</b> + alamat jalan lengkap dengan nomor ("They live at Brawijaya Street No. 12")` },
    ]
  },
  {
    month: 1, category: 'Verb (Kata Kerja)',
    simple: 'Oke sekarang kita bahas verb, atau kata kerja, salah satu materi paling penting dalam grammar. Verb itu kata yang menunjukkan aksi atau kondisi dalam sebuah kalimat. Contohnya di kalimat They study English at Language Center, kata study itu verb yang menceritakan aksi yang dilakukan sama they. Nah, verb ini punya beberapa bentuk yang harus kalian hafal, karena ini bakal jadi dasar buat belajar tenses nanti. Ada V1, bentuk dasar, contohnya study. Ada V2, bentuk lampau, contohnya studied. Ada V3, bentuk participle yang dipakai buat kalimat perfect, contohnya juga studied karena ini termasuk regular verb. Ada Vs es, buat subjek tunggal he, she, it di present tense, contohnya studies. Dan ada Ving, bentuk yang sedang berlangsung, contohnya studying. Yang penting diinget, buat subjek I, you, they, we, verb-nya nggak usah ditambah s. Tapi buat subjek he, she, it, verb-nya wajib ditambah s atau es. Nah, verb juga dibagi jadi regular verb sama irregular verb. Regular verb itu bentuk V2 dan V3-nya gampang, tinggal tambah ed di belakang, contohnya study jadi studied. Tapi irregular verb itu bentuknya berubah total dan harus dihafal satu-satu, contohnya go jadi went jadi gone, eat jadi ate jadi eaten, write jadi wrote jadi written. Nah selain ordinary verb, ada juga yang namanya auxiliary verb, atau kata kerja bantu. Ada primary auxiliary, yaitu be, do, sama have, yang wajib dipakai dalam kalimat tertentu, contohnya I am studying, I do not know, I have not eaten. Terus ada juga modal auxiliary, kayak can, will, must, dan may, yang dipakai buat nunjukin kemampuan, rencana masa depan, kewajiban, atau kemungkinan.',
    sections: [
      { title: 'Pengertian Verb', body: `Verb adalah kata yang menunjukkan aksi atau kondisi dalam sebuah kalimat. Contoh pada "They study English at Language Center", kata "study" adalah verb yang menceritakan aksi yang dilakukan subjek "they".` },
      { title: 'Bentuk-bentuk Ordinary Verb (V1, V2, V3, Ving, Vs/es)', body: `Ordinary verb punya beberapa bentuk sesuai fungsinya: <b>V1</b> (bentuk dasar, misal "study"), <b>V2</b> (bentuk lampau, "studied"), <b>V3</b> (bentuk participle untuk kalimat perfect, "studied"), <b>Vs/es</b> (untuk subjek tunggal he/she/it di present tense, "studies"), dan <b>Ving</b> (bentuk sedang berlangsung, "studying"). To be (is, am, are / was, were / been) juga termasuk ordinary verb ketika bertemu dengan noun, adjective, atau adverb — contoh "It is a book", "You were humble", "They have been there".` },
      { title: 'Aturan Penambahan -s/-es pada Verb', body: `Untuk subjek "I, you, they, we" → verb TIDAK ditambah -s ("I work", "They work"). Untuk subjek "he, she, it" → verb ditambah -s/-es ("He works", "She works", "It works properly").` },
      { title: 'Verb Beraturan vs Tidak Beraturan', body: `Verb beraturan (regular) membentuk V2 dan V3 dengan menambahkan -ed, contoh: study → studied → studied. Verb tidak beraturan (irregular) punya bentuk V2 dan V3 yang berubah bentuk secara khusus dan harus dihafal satu per satu, contoh: go → went → gone, eat → ate → eaten, write → wrote → written, buy → bought → bought.` },
      { title: 'Auxiliary Verb: Primary Auxiliary', body: `Auxiliary verb adalah kata kerja bantu yang mendampingi verb utama. <b>Primary auxiliary</b> ada 3: <b>be</b> (am/is/are, was/were, been), <b>do</b> (do/does, did), dan <b>have</b> (have/has, had). Contoh pemakaian: "I <b>am</b> studying" (be + Ving), "I <b>do</b> not know" (do + not + V1), "I <b>have</b> not eaten" (have + not + V3).` },
      { title: 'Auxiliary Verb: Modal Auxiliary', body: `Modal auxiliary dipakai untuk menyatakan makna tertentu seperti kemampuan, kemungkinan, atau kebutuhan. Modal utama: <b>can/could</b> (kemampuan), <b>will/would</b> (hal yang akan terjadi di masa depan), <b>must/had to</b> (sesuatu yang perlu/wajib dilakukan), dan <b>may/might</b> (kemungkinan). Contoh: "I can speak three languages" → bentuk lampaunya "I could speak three languages".` },
    ]
  },
  {
    month: 1, category: 'Conjunction (Kata Hubung)',
    simple: 'Sekarang kita bahas conjunction, atau kata hubung. Conjunction itu kata yang tugasnya menyambungkan kata, frasa, atau kalimat yang satu sama lainnya. Contohnya di kalimat He likes spicy food and sweet drink, kata and itu menghubungkan frasa spicy food sama sweet drink. Nah, ada lima conjunction dasar yang paling sering dipakai dan wajib banget kalian hafal. Yang pertama and, dipakai buat menambahkan sesuatu, artinya dan, contohnya He likes tea and coffee, dia suka teh dan kopi. Yang kedua but, dipakai buat menyatakan sesuatu yang berlawanan, artinya tapi, contohnya Dono is smart, but he is lazy, Dono itu pintar, tapi dia malas. Yang ketiga or, dipakai buat menyatakan pilihan lain, artinya atau, contohnya Laptops or smartphones are really important, laptop atau smartphone itu sama-sama penting. Yang keempat so, dipakai buat menyatakan hasil atau akibat dari sesuatu, artinya jadi atau sehingga, contohnya You have to study hard, so you will pass the test, kamu harus belajar keras, jadi kamu bakal lulus ujian. Dan yang kelima because, dipakai buat memberi alasan, artinya karena, contohnya She is hungry because she has not eaten, dia lapar karena dia belum makan. Nah, coba deh perhatikan, tiap conjunction ini punya rasa yang beda-beda kalau dipakai, jadi harus pilih yang paling pas sama maksud kalimatnya.',
    sections: [
      { title: 'Pengertian Conjunction', body: `Conjunction adalah kata yang menghubungkan kata lain, frasa, atau kalimat. Contoh pada "He likes spicy food <b>and</b> sweet drink", kata "and" menghubungkan frasa "spicy food" dengan "sweet drink".` },
      { title: '5 Conjunction Dasar', body: `• <b>And</b> — untuk menambahkan sesuatu ("He likes tea and coffee")<br>• <b>But</b> — untuk menyatakan sesuatu yang berlawanan ("Dono is smart, but he is lazy")<br>• <b>Or</b> — untuk menyatakan pilihan lain ("Laptops or smartphones are really important")<br>• <b>So</b> — untuk menyatakan akibat/hasil ("You have to study hard, so you will pass the test")<br>• <b>Because</b> — untuk memberi alasan ("She is hungry because she has not eaten")` },
    ]
  },
  {
    month: 1, category: 'Pengantar Tenses (16 Tenses)',
    simple: 'Oke sekarang kita masuk ke materi yang cukup ditakutin banyak orang, yaitu tenses. Tapi tenang aja, kalau kita paham polanya, ini sebenarnya nggak sesulit yang dibayangin kok. Jadi, tenses itu bentuk kata kerja yang menunjukkan kapan suatu kejadian berlangsung, apakah itu sekarang yang disebut present, sudah lewat yang disebut past, atau akan datang yang disebut future. Dalam Bahasa Inggris ada enam belas tenses semuanya, kedengarannya banyak banget ya, tapi sebenarnya semuanya itu dibentuk dari pola dasar yang sama, cuma dikombinasikan aja. Coba kita liat pola dasarnya. Present itu pakai V1 buat subjek I, you, they, we, dan Vs es buat subjek he, she, it. Continuous itu pakai to be ditambah Ving. Past itu pakai V2. Perfect itu pakai have, has, atau had, ditambah V3. Future simple itu pakai will ditambah V1. Dan past future itu pakai would ditambah V1. Nah, kalau kalian gabungin pola-pola ini, jadinya enam belas tenses. Misalnya Present Perfect Continuous, itu gabungan dari have has ditambah been ditambah Ving, contohnya She has been working in Kediri, dia sudah dan masih bekerja di Kediri. Selain itu, penting juga dibedakan antara kalimat verbal sama kalimat nominal. Kalimat verbal itu kalimat yang setelah subjeknya diikuti kata kerja aksi, contohnya I work in Kediri. Sedangkan kalimat nominal itu kalimat yang setelah subjeknya diikuti noun, adjective, atau adverb, bukan kata kerja aksi, biasanya pakai to be, contohnya I am a student. Nah, dengan paham dua konsep dasar ini, kalian bakal lebih gampang ngerti kenapa struktur tiap tenses itu bisa beda-beda.',
    sections: [
      { title: 'Apa itu Tenses?', body: `Tenses adalah bentuk-bentuk verb yang menunjukkan kapan suatu kejadian berlangsung — sekarang (present), sudah lewat (past), atau akan datang (future). Dalam grammar Bahasa Inggris ada 16 tenses, dan tiap tenses punya bentuk verb yang berbeda-beda sehingga bisa dikenali dari susunan katanya.` },
      { title: 'Pola Dasar Pembentuk Tenses', body: `• <b>Present</b> → V1 (untuk I/you/they/we), Vs/es (untuk he/she/it)<br>• <b>Continuous</b> → to be + Ving<br>• <b>Past</b> → V2<br>• <b>Perfect</b> → have/has/had/to be + V3<br>• <b>Future Simple</b> → will + V1<br>• <b>Past Future</b> → would + V1<br>Kombinasi dari pola-pola ini menghasilkan 16 tenses, misalnya "Present Perfect Continuous" = have/has + been + Ving ("She has been working in Kediri").` },
      { title: 'Dua Jenis Kalimat: Verbal & Nominal', body: `<b>Kalimat verbal</b> adalah kalimat yang mengandung verb (kata kerja) setelah subjek, contoh "I work in Kediri" (Present Simple), "They have worked in Kediri" (Present Perfect). <b>Kalimat nominal</b> adalah kalimat yang setelah subjeknya diikuti noun/adjective/adverb, bukan verb aksi — biasanya memakai to be, contoh "I am a student" (Present Simple nominal), "They have been diligent" (Present Perfect nominal).` },
    ]
  },
  {
    month: 1, category: 'Present Simple Tense',
    simple: 'Sekarang kita bahas satu-satu ya, dimulai dari Present Simple Tense. Tenses ini dipakai buat dua hal, yang pertama buat menyatakan kebiasaan sehari-hari, dan yang kedua buat menyatakan kebenaran umum yang emang selalu benar. Contoh kebiasaan, She always watches a movie on weekend, dia selalu nonton film tiap akhir pekan. Contoh kebenaran umum, The sun rises from the east, matahari terbit dari timur, ini kan emang selalu bener sepanjang masa. Nah, buat kalimat verbal yang ada kata kerja aksinya, positifnya gampang, tinggal subjek ditambah verb 1, tapi inget, kalau subjeknya he, she, atau it, verb-nya wajib ditambah s atau es, contohnya He takes a bath every day. Buat kalimat negatifnya, tinggal tambahin do not atau does not sebelum verb 1, contohnya She does not take a bath every day. Dan buat kalimat tanya, tinggal taruh do atau does di depan subjek, contohnya Does he take a bath every day. Terus buat kalimat nominal yang pakai to be, positifnya, I pakai am, you we they pakai are, dan he she it pakai is. Negatifnya tinggal tambahin not setelah to be-nya. Dan buat tanya, tinggal taruh to be-nya di depan subjek. Nah, biar gampang ngenalin kapan harus pakai present simple, biasanya ada kata kunci waktu kayak always, usually, often, sometimes, rarely, seldom, never, atau every day, every week, setiap hari, setiap minggu. Kalau kalian nemu kata-kata ini di kalimat, kemungkinan besar itu present simple.',
    sections: [
      { title: 'Kegunaan Present Simple', body: `Present Simple dipakai untuk menyatakan kebiasaan (habitual action) dan kebenaran umum (general truth). Contoh kebiasaan: "She always watches a movie on weekend." Contoh kebenaran umum: "The sun rises from the east."` },
      { title: 'Kalimat Verbal (mengandung verb aksi)', body: `<b>Positif:</b> I/you/they/we + V1 ("They take a bath every day"); He/she/it + Vs/es ("He takes a bath every day").<br><b>Negatif:</b> I/you/they/we + do not + V1; He/she/it + does not + V1 ("She does not take a bath every day").<br><b>Tanya:</b> Do + I/you/they/we + V1?; Does + he/she/it + V1? ("Does he take a bath every day?")` },
      { title: 'Kalimat Nominal (dengan to be)', body: `<b>Positif:</b> I + am, you/we/they + are, he/she/it + is (+ noun/adjective) — "I am here", "They are diligent".<br><b>Negatif:</b> tambahkan "not" setelah to be — "I am not here", "They are not diligent".<br><b>Tanya:</b> to be diletakkan di depan subjek — "Am I here?", "Are they diligent?"` },
      { title: 'Kata Kunci Waktu (Time Signal)', body: `Present Simple biasanya ditandai kata-kata seperti: always, usually, often, sometimes, rarely, seldom, never, every day/week/month/year, once/twice/three times a week, occasionally. Kalau ada kata-kata ini di kalimat, biasanya tensesnya Present Simple.` },
    ]
  },
  {
    month: 1, category: 'Present Continuous Tense',
    simple: 'Lanjut ke Present Continuous Tense. Tenses ini dipakai buat menceritakan sesuatu yang sedang berlangsung tepat pada saat ini juga, right now. Contohnya She is watching a movie now, artinya dia sedang nonton film sekarang juga, itu terjadi tepat pas kita ngomong. Nah, strukturnya gampang banget, tinggal subjek ditambah to be, yaitu am, is, atau are, ditambah verb ing. Buat positifnya, contohnya I am eating now, saya sedang makan sekarang. Buat negatifnya, tinggal tambahin not setelah to be-nya, contohnya I am not eating now. Dan buat kalimat tanya, tinggal taruh to be-nya di depan subjek, contohnya Is he eating now. Nah, ciri khas yang paling gampang buat ngenalin present continuous itu adanya kata now atau right now di kalimatnya, contohnya You are studying English right now, kamu lagi belajar Bahasa Inggris sekarang juga. Jadi kalau kalian nemu kata now di kalimatnya, langsung aja curiga itu present continuous.',
    sections: [
      { title: 'Kegunaan Present Continuous', body: `Present Continuous dipakai untuk menceritakan sesuatu yang sedang berlangsung tepat pada saat ini (right now). Contoh: "She is watching a movie now" (itu sedang terjadi saat ini juga).` },
      { title: 'Struktur Kalimat Verbal', body: `<b>Positif:</b> subjek + to be (am/is/are) + Ving — "I am eating now", "He is eating now".<br><b>Negatif:</b> subjek + to be + not + Ving — "I am not eating now".<br><b>Tanya:</b> to be + subjek + Ving? — "Is he eating now?"` },
      { title: 'Kata Kunci Waktu', body: `Ciri khas Present Continuous adalah kata "right now" atau "now" di kalimatnya, misalnya "You are studying English right now."` },
    ]
  },
  {
    month: 1, category: 'Present Perfect Tense',
    simple: 'Sekarang kita bahas Present Perfect Tense, ini agak sedikit tricky tapi kalau udah paham konsepnya bakal gampang kok. Tenses ini dipakai buat dua situasi. Yang pertama, buat menceritakan aktivitas yang sudah atau belum terjadi, tapi tanpa nyebutin waktu spesifik kapan kejadiannya. Contohnya We have just eaten, kita baru aja makan, di sini nggak disebutin jam berapa atau kapan persisnya. Yang kedua, buat menceritakan aktivitas yang dimulai di masa lalu tapi masih berlangsung sampai sekarang. Contohnya I have been a teacher for 5 years, saya sudah jadi guru selama 5 tahun, dan sampai sekarang masih jadi guru. Nah, strukturnya, subjek ditambah have atau has, ditambah verb 3. Contoh positifnya, I have studied French. Negatifnya, tinggal tambahin not setelah have atau has, contohnya I have not studied French. Dan kalimat tanyanya, tinggal taruh have atau has di depan subjek, contohnya Have you studied French. Nah, yang penting dipahami, bedanya sama present simple sama present continuous itu apa. Present simple buat kebenaran umum, present continuous buat yang lagi terjadi sekarang, sedangkan present perfect itu buat aktivitas masa lalu yang hasilnya masih nyambung sama sekarang, biasanya tanpa keterangan waktu spesifik kayak yesterday atau last week. Kata kunci yang sering muncul di present perfect itu already, just, yet, for, sama since. For dipakai buat durasi, contohnya for two weeks, sedangkan since dipakai buat titik waktu, contohnya since last January.',
    sections: [
      { title: 'Kegunaan Present Perfect', body: `Present Perfect dipakai untuk menceritakan aktivitas yang sudah/belum terjadi tanpa waktu spesifik yang disebutkan, atau aktivitas yang mulai di masa lalu dan masih berlanjut sampai sekarang. Contoh tanpa waktu spesifik: "We have just eaten" (baru saja makan). Contoh masih berlanjut: "I have been a teacher for 5 years" (sampai sekarang masih menjadi guru).` },
      { title: 'Struktur Kalimat Verbal', body: `<b>Positif:</b> subjek + have/has + V3 — "I have studied French".<br><b>Negatif:</b> subjek + have/has + not + V3 — "I have not studied French".<br><b>Tanya:</b> Have/Has + subjek + V3? — "Have you studied French?"` },
      { title: 'Perbedaan dengan Present Simple & Continuous', body: `Present Simple dipakai untuk kebenaran umum, Present Continuous untuk hal yang sedang terjadi sekarang, sedangkan Present Perfect dipakai untuk aktivitas masa lalu yang hasil/dampaknya masih berhubungan dengan sekarang — biasanya tanpa keterangan waktu spesifik seperti "yesterday" atau "last week".` },
      { title: 'Kata Kunci Waktu', body: `Kata-kata penanda Present Perfect: already, just, yet (untuk kalimat negatif/tanya), for + durasi ("for two weeks"), since + titik waktu spesifik ("since last January").` },
    ]
  },
  {
    month: 1, category: 'Past Simple Tense',
    simple: 'Sekarang kita bahas Past Simple Tense. Tenses ini dipakai buat menceritakan aktivitas yang udah terjadi dan udah selesai di waktu tertentu di masa lalu, misalnya kemarin, minggu lalu, atau tahun lalu. Bedanya sama present perfect, di past simple ini waktunya harus jelas dan spesifik disebutin. Contohnya I went to Japan last year, saya pergi ke Jepang tahun lalu, nah di sini jelas banget waktunya, yaitu tahun lalu. Strukturnya, subjek ditambah verb 2, contohnya I spoke English last night. Buat negatifnya, tinggal tambahin did not sebelum verb 1, inget ya, verb-nya balik lagi ke bentuk dasar setelah did not, contohnya I did not speak English last night. Dan buat kalimat tanya, tinggal taruh did di depan subjek, contohnya Did you speak English last night. Nah, kata kunci yang sering nemenin past simple itu yesterday yang artinya kemarin, terus ada juga pola kata plus ago, kayak five minutes ago, two weeks ago, five years ago, dan juga last, kayak last week, last month, last year.',
    sections: [
      { title: 'Kegunaan Past Simple', body: `Past Simple dipakai untuk menceritakan aktivitas yang sudah terjadi dan selesai di waktu tertentu di masa lalu, seperti barusan, kemarin, atau beberapa waktu yang lalu. Contoh: "She has already eaten." menekankan sudah selesai (Present Perfect), sedangkan "I went to Japan last year." menekankan waktu terjadinya jelas di masa lalu (Past Simple).` },
      { title: 'Struktur Kalimat Verbal', body: `<b>Positif:</b> subjek + V2 — "I spoke English last night".<br><b>Negatif:</b> subjek + did not + V1 — "I did not speak English last night" (verb kembali ke bentuk dasar setelah "did not").<br><b>Tanya:</b> Did + subjek + V1? — "Did you speak English last night?"` },
      { title: 'Kata Kunci Waktu', body: `Penanda khas Past Simple: yesterday, ... ago (5 minutes ago, two weeks ago, five years ago), last (last week, last month, last year), just now.` },
    ]
  },
  {
    month: 1, category: 'Future Simple Tense',
    simple: 'Sekarang kita bahas Future Simple Tense, ini tenses paling gampang menurut saya. Tenses ini dipakai buat membicarakan aktivitas yang bakal terjadi di masa depan, entah itu nanti, lima menit lagi, besok, atau minggu depan. Strukturnya super simpel, tinggal subjek ditambah will, ditambah verb 1. Contoh positifnya, I will go to Japan next year, saya akan pergi ke Jepang tahun depan. Buat negatifnya, tinggal tambahin not setelah will, contohnya I will not go to Pare later. Dan buat kalimat tanya, tinggal taruh will di depan subjek, contohnya Will I go to Pare later. Kata kunci yang sering muncul di future simple itu later, tomorrow, sama next, kayak next week atau next year, dan juga someday.',

      { title: 'Struktur Kalimat Verbal', body: `<b>Positif:</b> subjek + will + V1 — "I will go to Japan next year".<br><b>Negatif:</b> subjek + will not + V1 — "I will not go to Pare later".<br><b>Tanya:</b> Will + subjek + V1? — "Will I go to Pare later?"` },
      { title: 'Kata Kunci Waktu', body: `Penanda khas Future Simple: later, tomorrow, next (next week, next year), someday.` },

  {
    month: 1, category: 'Phrasal Verbs',
    simple: 'Sekarang kita bahas phrasal verb, materi yang seru tapi harus banyak dihafal. Jadi phrasal verb itu kata kerja yang dipasangkan sama kata pendek kayak up, off, in, atau on, dan begitu dipasangkan, artinya berubah jadi sesuatu yang baru, nggak nyambung lagi sama arti kata aslinya. Contohnya give up, kalau diartikan kata per kata itu kasih naik, tapi sebenarnya artinya menyerah. Jadi kalian nggak bisa nebak artinya cuma dari kata dasarnya aja, harus dihafal sebagai satu kesatuan. Beberapa contoh phrasal verb yang sering dipakai, come in artinya masuk, go out artinya keluar, look for artinya mencari, turn on artinya menyalakan, write down artinya menuliskan, pick up artinya menjemput atau mengangkat, give up artinya menyerah, stand up artinya berdiri, sit down artinya duduk, get up artinya bangun tidur, put on artinya memakai, take off artinya melepas, look after artinya menjaga, dan look at artinya melihat. Nah, cara ngerubah tenses-nya sama kayak verb biasa, cuma bagian kata kerjanya aja yang berubah, particle atau kata pendeknya tetap nggak berubah. Contohnya di present simple, He picks up her mom, bukan he pick ups. Di past simple, He picked up her mom. Di present perfect, He has picked up her mom. Dan di future simple, He will pick up her mom.',
    sections: [
      { title: 'Pengertian Phrasal Verb', body: `Phrasal verb adalah kata kerja yang berpasangan dengan particle (kata pendek seperti up, off, in, on) yang bersama-sama membentuk makna baru. Contoh: give up (menyerah), pick up (menjemput), turn off (mematikan), look after (menjaga), take off (melepas/lepas landas), wake up (bangun).` },
      { title: 'Contoh Phrasal Verb Umum', body: `Come in (masuk), drop in (mampir), go out (keluar), look for (mencari), turn on (menyalakan), write down (menuliskan), pick up (menjemput/mengangkat), give up (menyerah), stand up (berdiri), sit down (duduk), get up (bangun), put on (memakai), take off (melepas), look after (menjaga), look at (melihat).` },
      { title: 'Cara Mengubah Tenses pada Phrasal Verb', body: `Phrasal verb mengikuti aturan tenses yang sama seperti verb biasa — bagian kata kerjanya saja yang berubah, particle-nya tetap. Contoh di Present Simple: "He picks up her mom" (bukan "pick ups"). Di Past Simple: "He picked up her mom." Di Present Perfect: "He has picked up her mom." Di Future Simple: "He will pick up her mom."` },
    ]
  },
  {
    month: 1, category: 'Modal: Can & Could',
    simple: 'Sekarang kita masuk ke modal auxiliary, dimulai dari can sama could. Can sama could itu dipakai buat nunjukin kemampuan seseorang, apakah dia bisa melakukan sesuatu atau enggak. Could itu bentuk lampau dari can. Contohnya, Via can draw really good scenery, Via bisa menggambar pemandangan yang bagus banget, itu kemampuan yang dia punya sekarang. Terus, Joni cannot run fast, Joni nggak bisa lari cepat, itu ketidakmampuan, cannot itu gabungan dari can plus not. Buat kalimat tanya, Can you ride a bike, bisa kamu naik sepeda. Dan contoh yang pakai could, My mom could read before the age of five, ibu saya udah bisa baca sebelum umur lima tahun, ini kemampuan di masa lalu. Nah, ada aturan penting banget yang sering dilanggar orang soal modal ini. Pertama, modal itu tidak pernah berubah bentuk sesuai subjeknya, jadi walaupun subjeknya he, she, atau it, tetap aja pakai can, nggak ditambah s. Jadi yang salah itu Mr. Joko cans cook, yang bener Mr. Joko can cook. Kedua, setelah modal, kata kerjanya selalu dalam bentuk dasar, verb 1, jadi yang salah He can speaks English, yang bener He can speak English. Ketiga, buat kalimat tanya, modal langsung ditaruh di depan subjek tanpa perlu tambahan do atau does lagi, jadi yang salah Do you can help me, yang bener Can you help me.',
    sections: [
      { title: 'Fungsi Can dan Could', body: `<b>Can</b> dan <b>could</b> dipakai untuk menyatakan kemampuan (ability) seseorang bisa melakukan sesuatu, atau sebaliknya, ketidakmampuan. <b>Could</b> adalah bentuk lampau dari can.` },
      { title: 'Contoh Penggunaan', body: `"Via can draw really good scenery." (kemampuan sekarang)<br>"Joni cannot run fast." (ketidakmampuan, cannot = can + not)<br>"Can you ride a bike?" (bentuk tanya)<br>"My mom could read before the age of five." (kemampuan di masa lalu)` },
      { title: 'Aturan Umum Modal', body: `Modal auxiliary (termasuk can/could) TIDAK berubah bentuk sesuai subjek — tidak ada tambahan -s meskipun subjeknya he/she/it. Salah: "Mr. Joko cans cook", benar: "Mr. Joko can cook". Setelah modal, verb selalu dalam bentuk dasar (V1) — salah: "He can speaks English", benar: "He can speak English". Untuk kalimat tanya, modal langsung diletakkan di depan subjek tanpa tambahan do/does — salah: "Do you can help me?", benar: "Can you help me?"` },
    ]
  },
  {
    month: 1, category: 'Modal: Must & Have To',
    simple: 'Sekarang kita bahas must sama have to. Dua-duanya dipakai buat nunjukin sesuatu yang perlu atau wajib dilakukan. Dalam percakapan sehari-hari, have to itu lebih sering dipakai karena kesannya lebih santai, sedangkan must itu punya kesan lebih kuat, lebih mendesak, dan lebih formal. Contohnya I must cook dinner, sama aja artinya sama I have to cook dinner, dua-duanya artinya saya perlu masak makan malam. Nah, kapan kita pilih must, kapan kita pilih have to? Gampangnya gini, kalau itu bukan pendapat pribadi kita, tapi memang fakta atau keharusan dari luar, kita pakai have to, contohnya Ali has to see a dentist, ini fakta jadwal, bukan opini si pembicara. Tapi kalau itu opini atau perintah dari si pembicara sendiri, kita pakai must, contohnya Susi must take the medicine, ini pendapat si pembicara yang nyuruh Susi minum obat. Nah, ini yang paling penting dan sering banget bikin bingung, soal bentuk negatifnya. Must not itu artinya larangan, jangan lakukan ini, contohnya You must not talk back to your parents, artinya jangan membantah orang tua kamu, ini dilarang. Tapi do not have to atau does not have to itu artinya tidak perlu, boleh dilakukan boleh juga enggak, contohnya We don\'t have to wear sunglasses, artinya kita tidak perlu pakai kacamata hitam, bukan berarti dilarang pakai kacamata hitam ya. Jadi inget baik-baik, must not itu beda jauh artinya sama don\'t have to, walaupun kelihatannya mirip. Oh iya, bentuk lampau dari must sama have to itu had to.',

      { title: 'Fungsi Must dan Have To', body: `<b>Must</b> dan <b>have to</b> dipakai untuk menyatakan sesuatu yang perlu/wajib dilakukan (necessity). Dalam percakapan sehari-hari, "have to" lebih sering dipakai karena "must" punya kesan lebih kuat/mendesak dan formal. "I must cook dinner" = "I have to cook dinner" (artinya sama, "perlu memasak makan malam").` },
      { title: 'Kapan Pakai Must vs Have To', body: `Gunakan <b>have to</b> kalau itu bukan pendapat pribadi, melainkan fakta/keharusan dari luar — "Ali has to see a dentist" (ini fakta jadwal, bukan opini). Gunakan <b>must</b> kalau itu adalah opini/keharusan menurut pembicara sendiri — "Susi must take the medicine" (ini pendapat/perintah si pembicara).` },
      { title: 'Bentuk Negatif: Beda Makna Penting!', body: `<b>must not</b> berarti larangan (JANGAN lakukan ini!) — "You must not talk back to your parents" (dilarang membantah orang tua).<br><b>do not/does not have to</b> berarti TIDAK PERLU (boleh dilakukan boleh tidak) — "We don't have to wear sunglasses" (tidak wajib pakai kacamata hitam, bukan berarti dilarang).<br>Jadi "must not" ≠ "don't have to", artinya jauh berbeda meski sekilas mirip.` },

  {
    month: 1, category: 'Modal: Should, Ought To, Had Better',
    simple: 'Sekarang kita bahas should, ought to, sama had better. Should sama ought to itu dipakai buat kasih saran, artinya sebaiknya begini atau sebaiknya begitu, dan maknanya mirip banget satu sama lain. Contohnya You should get up early, sama aja artinya sama You ought to get up early, dua-duanya artinya sebaiknya kamu bangun pagi. Buat bentuk negatifnya, shouldn\'t itu singkatan dari should not. Nah, ada satu lagi yang mirip, namanya had better, maknanya juga mirip should dan ought to, tapi kesannya lebih tegas dan lebih kuat. Biasanya had better ini dipakai kalau ada peringatan bahwa kalau sarannya nggak dituruti, bisa ada konsekuensi negatif yang terjadi. Contohnya You\'d better discuss this project with your supervisor to avoid misunderstanding, artinya sebaiknya kamu diskusikan proyek ini sama atasan kamu supaya nggak terjadi kesalahpahaman, di situ ada kesan peringatan kalau nggak didiskusikan bisa ada masalah nantinya. Oh iya, you\'d better itu singkatan dari you had better. Dalam percakapan sehari-hari, orang juga sering pakai pola I think, ditambah subjek, ditambah should, buat kasih saran dengan lebih sopan dan lebih halus. Contohnya We\'ve run out oranges, I think I should buy some later, artinya jeruk kita udah habis, menurut saya sebaiknya saya beli lagi nanti.',

      { title: 'Had Better: Saran yang Lebih Tegas', body: `<b>Had better</b> punya makna mirip should/ought to, tapi kesannya lebih kuat/tegas — biasanya berisi peringatan bahwa ada konsekuensi negatif kalau saran itu tidak dijalankan. Contoh: "You'd better discuss this project with your supervisor to avoid misunderstanding" (kalau tidak didiskusikan, bisa terjadi kesalahpahaman). "You'd better" adalah singkatan dari "you had better".` },
      { title: 'Ungkapan Sehari-hari: I think ... should', body: `Dalam percakapan santai, sering dipakai pola "I think ... should ..." untuk memberi saran dengan lebih sopan. Contoh: "We've run out oranges. I think I should buy some later" (artinya: menurutku sebaiknya aku beli jeruk nanti).` },

  {
    month: 1, category: 'Prefer/Would Rather & Want/Would Like',
    simple: 'Sekarang kita bahas dua pasangan ungkapan yang sering dipakai buat nyatain pilihan sama keinginan. Yang pertama, prefer sama would rather, dua-duanya dipakai buat nyatain preferensi atau pilihan seseorang dengan cara yang lebih sopan, dan artinya sama. Contohnya I prefer honey to cheese, sama aja artinya sama I\'d rather have biscuits than bread. Nah, polanya beda ya, kalau pakai prefer, polanya prefer, ditambah verb ing atau noun, ditambah to, contohnya I prefer mopping the floor to washing the clothes, saya lebih suka ngepel lantai daripada nyuci baju. Tapi kalau pakai would rather, polanya beda lagi, setelah would rather kita pakai verb 1 bentuk dasar, ditambah than, contohnya I\'d rather stay in the hotel than play tennis outside, saya lebih milih nginep di hotel daripada main tenis di luar. Nah, yang kedua, want sama would like, dua-duanya dipakai buat nyatain sesuatu yang diinginkan atau dibutuhkan, artinya juga sama. Contohnya I want a bar of chocolate, sama aja artinya sama I\'d like a bar of chocolate, please. Bedanya, dalam percakapan formal atau sopan, misalnya kalau kita ngomong sama orang asing atau klien, would like atau \'d like itu lebih disukai dipakai daripada want, karena want kesannya lebih langsung dan kurang sopan. Coba bandingin, Do you want a cup of tea, itu kesannya biasa aja, tapi Would you like a cup of tea, itu kesannya lebih sopan. Oh iya, hati-hati juga jangan sampai ketuker antara would like sama like biasa ya. Would you like some cookies, itu artinya menawarkan kue ke seseorang. Tapi Do you like cookies, itu artinya nanya apakah dia suka kue secara umum, dua pertanyaan ini maksudnya beda.',
    sections: [
      { title: 'I Prefer dan I\'d Rather', body: `<b>Prefer</b> dan <b>would rather (\'d rather)</b> dipakai untuk menyatakan preferensi/pilihan seseorang secara sopan, dan maknanya sama. "I prefer honey to cheese" = "I'd rather have biscuits than bread."` },
      { title: 'Pola Kalimat: Prefer ... to ... vs Would Rather ... Than ...', body: `Setelah <b>prefer</b>, gunakan Ving atau noun, dengan pola "prefer ... to ...": "I prefer mopping the floor to washing the clothes" (lebih suka mengepel daripada mencuci baju).<br>Setelah <b>would rather</b>, gunakan V1 (bentuk dasar), dengan pola "'d rather ... than ...": "I'd rather stay in the hotel than play tennis outside" (lebih memilih tinggal di hotel daripada main tenis di luar).` },
      { title: 'Want dan Would Like', body: `<b>Want</b> dan <b>would like</b> dipakai untuk menyatakan sesuatu yang diinginkan/dibutuhkan, dan maknanya sama. "I want a bar of chocolate" = "I'd like a bar of chocolate, please." Dalam percakapan formal/sopan (misalnya ke orang asing atau klien), <b>would like/'d like</b> lebih disukai daripada "want" yang terkesan lebih langsung/kurang sopan. Bandingkan: "Do you want a cup of tea?" (biasa) vs "Would you like a cup of tea?" (lebih sopan).` },
      { title: 'Perbedaan Would Like vs Like (Suka)', body: `Hati-hati membedakan "would like" (menawarkan/meminta sesuatu) dengan "like" (menyatakan suka pada sesuatu secara umum). "Would you like some cookies?" artinya menawarkan kue. "Do you like cookies?" artinya menanyakan apakah dia suka kue secara umum — dua pertanyaan ini punya maksud berbeda meski terlihat mirip.` },

  {
    month: 1, category: 'WH Questions',
    simple: 'Sekarang kita bahas WH Questions, atau kalimat tanya yang pakai kata tanya. Kalimat tanya jenis ini dimulai dengan kata-kata kayak what, who, whom, where, when, why, whose, which, dan how, dan dipakai buat nanya informasi yang lebih spesifik, yang nggak bisa cuma dijawab pakai ya atau tidak. Contohnya, What is your name, jawabannya harus nyebutin nama, bukan jawab Yes, it is, itu jawabannya salah. Nah, tiap kata tanya itu punya fungsinya sendiri-sendiri. What dipakai buat nanya tentang benda atau aktivitas. Who dipakai buat nanya tentang orang, bisa sebagai subjek maupun objek. Whom juga buat nanya orang tapi sebagai objek, dan lebih formal pemakaiannya. Where buat nanya tempat. When buat nanya waktu. Why buat nanya alasan. Whose buat nanya kepemilikan, punya siapa. Which buat nanya pilihan, yang mana. Dan how buat nanya cara atau bagaimana. Nah, ada dua pola susunan WH question yang penting dipahami. Yang pertama, buat kalimat verbal yang ada kata kerja aksinya, polanya WH question ditambah auxiliary verb ditambah subjek ditambah main verb, contohnya What do you usually have for lunch. Yang kedua, buat kalimat nominal yang pakai to be, polanya WH question ditambah to be ditambah subjek ditambah adjective atau noun, contohnya Why are you there. Terus, kalau kita mau nanya soal subjek kalimat, siapa atau apa yang melakukan sesuatu, kita pakai who buat orang atau what buat benda, terus langsung diikuti verb bentuk tunggal, tanpa perlu tambahan do atau does. Contohnya Rita cooks every day, kalau ditanya jadi Who cooks every day, bukan Who does cook every day.',
    sections: [
      { title: 'Pengertian WH Questions', body: `WH Questions adalah kalimat tanya yang dimulai dengan kata what, who, whom, where, when, why, whose, which, dan how — dipakai untuk menanyakan informasi lebih spesifik yang tidak bisa hanya dijawab dengan "ya/tidak". Contoh: "What is your name?" harus dijawab dengan info nama, bukan "Yes, it is" (itu salah).` },
      { title: 'Daftar Kata Tanya dan Fungsinya', body: `• <b>What</b> — tentang benda/aktivitas ("What are you doing?")<br>• <b>Who</b> — tentang orang, sebagai subjek/objek ("Who cooks this food?")<br>• <b>Whom</b> — tentang orang sebagai objek, lebih formal ("Whom did she meet?")<br>• <b>Where</b> — tentang tempat ("Where will you go?")<br>• <b>When</b> — tentang waktu ("When is the party?")<br>• <b>Why</b> — tentang alasan ("Why were you late?")<br>• <b>Whose</b> — tentang kepemilikan ("Whose book is this?")<br>• <b>Which</b> — tentang pilihan ("Which dress do you choose?")<br>• <b>How</b> — tentang cara ("How does she get here?")` },
      { title: 'Dua Pola Susunan WH Question', body: `<b>Tipe A</b> (untuk kalimat verbal): WH question + auxiliary verb + subjek + main verb — "What do you usually have for lunch?"<br><b>Tipe B</b> (untuk kalimat nominal, pakai to be): WH question + to be + subjek + adjective/noun — "Why are you there?"` },
      { title: 'Menanyakan Subjek', body: `Untuk menanyakan siapa/apa yang melakukan sesuatu (subjek kalimat), gunakan <b>who</b> (untuk orang) atau <b>what</b> (untuk benda) diikuti verb bentuk tunggal (seperti untuk she/he/it) — TANPA perlu auxiliary do/does. Contoh: "Rita cooks every day" → "<b>Who</b> cooks every day?" (bukan "Who does cook every day?").` },
      { title: 'Menanyakan Objek dan Kepemilikan', body: `Untuk objek, gunakan <b>who(m)</b> (orang) atau <b>what</b> (benda) diikuti auxiliary + subjek — "Joni met Sarah last night" → "Who(m) did Joni meet last night?" Untuk kepemilikan, gunakan <b>whose</b> yang bisa diikuti pola subjek maupun objek — "His brother got a medal" → "Whose brother got a medal?"` },
      { title: 'Menanyakan Waktu dan Tempat', body: `Untuk waktu gunakan <b>when</b>, untuk tempat gunakan <b>where</b>, keduanya memakai pola yang sama diikuti auxiliary + subjek. Contoh: "We will have a meeting tomorrow" → "When will we have a meeting?" dan "Surya slept on the sofa last night" → "Where did Surya sleep last night?"` },
    ]

  {
    month: 1, category: 'Degree of Comparison',
    simple: 'Sekarang kita bahas degree of comparison, atau tingkat perbandingan. Ini dipakai kalau kita mau membandingkan dua hal atau lebih pakai adjective, atau kata sifat. Ada tiga tingkatan yang harus kalian hafal. Yang pertama, positive degree, dipakai buat nyatain dua hal yang setara atau sama, polanya as ditambah adjective ditambah as, contohnya My brother is as tall as my cousin, tinggi badan kakak saya sama kayak sepupu saya. Yang kedua, comparative degree, dipakai buat membandingkan dua hal, polanya adjective ditambah er, atau more ditambah adjective, ditambah than, contohnya A marker is bigger than a pencil, spidol itu lebih besar daripada pensil. Dan yang ketiga, superlative degree, dipakai buat membandingkan lebih dari dua hal, atau buat nunjukin yang paling unggul, polanya the ditambah adjective ditambah est, atau the most ditambah adjective, contohnya Rita is the smartest student in the class, Rita itu murid paling pintar di kelas. Nah, kapan kita pakai er est, kapan kita pakai more most? Aturannya gini, kalau adjective-nya cuma satu suku kata, kayak cute atau big, kita tambah er atau est, jadi cuter, the cutest. Kalau adjective-nya dua suku kata yang berakhiran y, kayak happy atau pretty, kita ganti y jadi i dulu baru tambah er atau est, jadi happier, the happiest. Tapi kalau adjective-nya dua suku kata atau lebih, kayak modern atau comfortable, kita tambah more atau the most di depannya, jadi more modern, the most modern. Oh iya, ada juga beberapa adjective yang bentuknya nggak beraturan dan harus dihafal, kayak good jadi better jadi the best, bad jadi worse jadi the worst, dan far jadi farther atau further jadi the farthest atau the furthest.',
    sections: [
      { title: 'Pengertian Degree of Comparison', body: `Degree of comparison adalah bentuk adjective yang dipakai untuk membandingkan sesuatu. Ada 3 tingkatan: <b>positive</b> (kesetaraan), <b>comparative</b> (perbandingan dua hal), dan <b>superlative</b> (perbandingan lebih dari dua/paling).` },
      { title: 'Positive Degree (Kesetaraan)', body: `Dipakai untuk menyatakan dua hal setara/sama, dengan pola "as + adjective + as". Contoh: "My brother is as tall as my cousin" (tinggi mereka sama).` },
      { title: 'Comparative Degree (Perbandingan Dua Hal)', body: `Dipakai untuk membandingkan dua hal, dengan pola "adjective + -er / more + adjective + than". Contoh: "A marker is bigger than a pencil" (adjective pendek + -er), "Jono seems more uncomfortable than Adi" (adjective panjang + more).` },
      { title: 'Superlative Degree (Paling)', body: `Dipakai untuk membandingkan lebih dari dua hal/paling unggul, dengan pola "the + adjective + -est / the most + adjective". Contoh: "Rita is the smartest student in the class", "This café looks the most modern among these buildings".` },
      { title: 'Aturan Pemilihan -er/-est vs more/most', body: `• Adjective 1 suku kata (cute, big, light) → tambah <b>-er/-est</b> (cuter, the cutest)<br>• Adjective 2 suku kata berakhiran -y (happy, pretty) → ganti y jadi i, tambah <b>-er/-est</b> (happier, the happiest)<br>• Adjective 2 suku kata atau lebih (modern, comfortable) → tambah <b>more/the most</b> di depannya (more modern, the most modern)` },
      { title: 'Bentuk Tidak Beraturan (Irregular)', body: `Beberapa adjective punya bentuk comparative/superlative yang tidak mengikuti aturan biasa dan harus dihafal: good → better → the best, bad → worse → the worst, little → less → the least, many/much → more → the most, far → farther/further → the farthest/furthest, old → older/elder → the oldest/eldest.` },
    ]
  },
  {
    month: 1, category: 'There Is/Are — There Was/Were',
    simple: 'Sekarang kita bahas there is, there are, sama there was, there were. Pola kalimat ini dipakai buat nyatain keberadaan sesuatu atau seseorang di suatu tempat. Polanya, there ditambah is atau are, ditambah noun, ditambah keterangan tempat kalau perlu. Contohnya, There are some students in the class, ada beberapa murid di kelas. Nah, aturan pemilihan is atau are itu tergantung dari jumlah bendanya. Kalau bendanya tunggal, kita pakai there is, contohnya There is a book on the table, ada satu buku di atas meja. Kalau bendanya jamak, kita pakai there are, contohnya There are flowers in the garden, ada bunga-bunga di taman. Nah, penting juga dipahami, there is dan there are itu dipakai buat situasi sekarang. Tapi kalau kita mau cerita soal masa lalu, kita ganti jadi there was buat benda tunggal, dan there were buat benda jamak. Contohnya, There was a car accident on the crossroad last night, ada kecelakaan mobil di persimpangan tadi malam. Dan There were a lot of boxes in my room last week, ada banyak kotak di kamar saya minggu lalu.',
    sections: [
      { title: 'Pengertian There Is/Are', body: `"There is/are" dipakai untuk menyatakan keberadaan sesuatu/seseorang di suatu tempat. Polanya: there + is/are + noun + keterangan tempat (opsional). Contoh: "There are some students in the class", "There is a bottle on the desk."` },
      { title: 'Aturan Is vs Are (Noun Tunggal vs Jamak)', body: `Untuk noun <b>tunggal</b>: There is (positif), There isn't (negatif), Is there...? (tanya) — "There is a book on the table."<br>Untuk noun <b>jamak</b>: There are (positif), There aren't (negatif), Are there...? (tanya) — "There are flowers in the garden."` },
      { title: 'There Was/Were untuk Masa Lalu', body: `"There is/are" dipakai untuk situasi sekarang, sedangkan "there was/were" dipakai untuk situasi di masa lalu. Untuk noun tunggal pakai <b>there was</b> ("There was a car accident on the crossroad last night"), untuk noun jamak pakai <b>there were</b> ("There were a lot of boxes in my room last week").` },
    ]

  {
    month: 1, category: 'Gerund and Infinitive',
    simple: 'Terakhir, kita bahas gerund sama infinitive. Gerund itu bentuk kata kerja yang ditambah akhiran ing dan berfungsi kayak kata benda, contohnya reading, watching, sama listening. Sedangkan infinitive itu bentuk kata kerja dasar yang di depannya ditambah kata to, contohnya to read, to watch, sama to listen. Nah, karena gerund sama infinitive ini fungsinya kayak noun, mereka bisa jadi subjek atau objek dalam kalimat. Contohnya kalau jadi subjek, Listening to music is my hobby, mendengarkan musik adalah hobi saya, di situ listening jadi subjek kalimat. Atau To make her happy is my priority, membuatnya bahagia adalah prioritas saya, di situ to make jadi subjek kalimat. Nah, yang paling penting dan sering bikin bingung itu soal gerund infinitive sebagai objek kalimat, soalnya beberapa kata kerja tertentu itu harus diikuti gerund, sementara kata kerja lainnya harus diikuti infinitive, dan ini nggak bisa ditukar-tukar sembarangan. Buat verb yang diikuti gerund, ada enjoy, mind, stop, finish, like, sama love. Contohnya Rita enjoys shopping on weekends, Rita suka banget belanja di akhir pekan. Sedangkan buat verb yang diikuti infinitive, ada want, hope, decide, need, learn, sama try. Contohnya nanti kalian akan ketemu pola I want to go, saya ingin pergi, bukan I want going. Jadi, kunci suksesnya di sini adalah menghafal, verb mana yang pasangannya gerund, dan verb mana yang pasangannya infinitive, soalnya nggak ada rumus pasti buat nebak, harus dihafal satu-satu.',
    sections: [
      { title: 'Pengertian Gerund dan Infinitive', body: `<b>Gerund</b> adalah bentuk verb yang berakhiran "-ing" dan berfungsi sebagai noun, contoh: reading, watching, listening. <b>Infinitive</b> adalah bentuk dasar verb yang didahului "to", contoh: to read, to watch, to listen. Karena keduanya berfungsi sebagai noun, gerund dan infinitive bisa jadi subjek atau objek kalimat.` },
      { title: 'Sebagai Subjek Kalimat', body: `Gerund atau infinitive bisa diletakkan di awal kalimat sebagai subjek. Contoh: "<b>Listening</b> to music is my hobby" (gerund sebagai subjek), "<b>To make</b> her happy is my priority" (infinitive sebagai subjek).` },
      { title: 'Verb + Gerund (Ving)', body: `Beberapa verb tertentu harus diikuti oleh gerund (Ving) ketika menjadi objek, contohnya: <b>enjoy, mind, stop, finish, like, love</b>. Contoh: "Rita enjoys shopping on weekends", "I haven't finished studying English", "She likes going on a picnic."` },
      { title: 'Verb + Infinitive (to + V1)', body: `Beberapa verb tertentu harus diikuti oleh infinitive (to + V1) ketika menjadi objek, contohnya: <b>want, hope, decide, need, learn, try</b>. Pola ini beda dengan verb + gerund di atas — penting untuk menghafal verb mana yang pasangannya gerund dan mana yang pasangannya infinitive, karena tidak bisa dipertukarkan sembarangan.` },

let grammarMode = 'flashcard';       // 'quiz' | 'flashcard' -- sama konsepnya dgn primaryMode di mode vocab
let grammarScope = 'all';            // 'all' | 'category'
let selectedGrammarCategory = null;

// State khusus buat "Latihan Soal" (kuis pilihan ganda), terpisah dari state flashcard di atas
// biar gak saling ganggu.
let grammarQuizScope = 'all';        // 'all' | 'category'
let selectedGrammarQuizCategory = null;
let selectedGrammarQuizLevel = 'all'; // 'all' | 'easy' | 'medium' | 'hard'
let grammarQuizQueue = [];
let grammarQuizIdx = 0;
let grammarQuizScore = 0;
let grammarQuizAnswered = false;
let grammarQuizMissed = [];
let grammarQuizRound = 0; // 0 = ronde pertama, >0 = ronde ulang soal yang salah

function grammarQuizCategories(){
  return [...new Set(GRAMMAR_QUIZ_QUESTIONS.map(q => q.category))];
}
function grammarQuizPoolByCategory(cat){
  return GRAMMAR_QUIZ_QUESTIONS.filter(q => q.category === cat);
}
function grammarQuizApplyLevel(pool){
  if(selectedGrammarQuizLevel === 'all') return pool;
  return pool.filter(q => q.level === selectedGrammarQuizLevel);
}
function grammarQuizLevelPickerHtml(pool){
  const LEVELS = [
    { key:'all', label:'🎯 Semua', color:'' },
    { key:'easy', label:'🟢 Mudah', color:'' },
    { key:'medium', label:'🟡 Sedang', color:'' },
    { key:'hard', label:'🔴 Sulit', color:'' },
  ];
  return `<div class="mode-row" style="margin-top:10px;">
    ${LEVELS.map(lv=>{
      const count = lv.key==='all' ? pool.length : pool.filter(q=>q.level===lv.key).length;
      const activeCls = selectedGrammarQuizLevel===lv.key ? 'active' : '';
      return `<button class="mode-btn ${activeCls}" data-gqlevel="${lv.key}" type="button">${lv.label} <span style="opacity:0.7;font-size:10px;">(${count})</span></button>`;
    }).join('')}
  </div>`;
}
function grammarQuizCategoryGridHtml(){
  const cats = grammarQuizCategories();
  let html = '<div class="day-grid">';
  cats.forEach(cat=>{
    const count = grammarQuizPoolByCategory(cat).length;
    const activeCls = selectedGrammarQuizCategory === cat ? 'active' : '';
    html += `<button class="day-btn ${activeCls}" data-gqcat="${escapeHtmlIdx(cat)}" type="button">
      <div class="dnum">KATEGORI</div>
      <div class="dtitle">${escapeHtmlIdx(cat)}</div>
      <div class="dcount">${count} soal</div>
    </button>`;
  });
  html += '</div>';
  return html;
}

function startGrammarQuiz(pool){
  grammarQuizQueue = shuffle(pool.slice());
  grammarQuizIdx = 0;
  grammarQuizScore = 0;
  grammarQuizMissed = [];
  grammarQuizRound = 0;
  renderGrammarQuizQuestion();
}

function renderGrammarQuizQuestion(){
  clearTimer();
  grammarQuizAnswered = false;
  if(grammarQuizIdx >= grammarQuizQueue.length){ finishGrammarQuizRound(); return; }
  const item = grammarQuizQueue[grammarQuizIdx];
  statusVal.textContent = "GRAMMAR";
  setPresenceStatus('in_progress');
  setPresenceMode('Latihan Soal Grammar');

  const dotsHtml = grammarQuizQueue.map((_,i)=>{
    let cls = 'dot';
    if(i < grammarQuizIdx) cls += ' done';
    else if(i === grammarQuizIdx) cls += ' current';
    return `<span class="${cls}"></span>`;
  }).join('');

  // Acak urutan opsi tapi tetap ingat index jawaban benar yang asli.
  const shuffledOpts = item.opts.map((text, origIdx)=>({ text, origIdx }));
  shuffle(shuffledOpts);

  card.innerHTML = `
    <div class="reset-row"><button class="reset-btn" id="gqResetBtn">↺ Keluar</button></div>
    <div class="progress-row">
      <span>${grammarQuizRound===0 ? 'SOAL' : 'ULANGI'} ${grammarQuizIdx+1} / ${grammarQuizQueue.length}</span>
      <div class="dots">${dotsHtml}</div>
    </div>
    <div class="section-tag">✍️ ${escapeHtmlIdx(item.category)}${item.level ? ` · ${item.level==='easy'?'🟢 Mudah':item.level==='medium'?'🟡 Sedang':'🔴 Sulit'}` : ''}</div>
    <div class="question">Lengkapi / pilih jawaban yang tepat:</div>
    <div class="question-word" style="font-size:19px;">${escapeHtmlIdx(item.q)}</div>
    <div class="options" id="gqOptionsWrap">
      ${shuffledOpts.map((opt,i)=>`
        <button class="opt" data-orig="${opt.origIdx}">
          <span class="letter">${String.fromCharCode(65+i)}</span>
          <span>${escapeHtmlIdx(opt.text)}</span>
        </button>
      `).join('')}
    </div>
    <div class="grammar-explain" id="gqExplain" style="display:none;"></div>
    <button class="btn" id="gqNextBtn" style="display:none;margin-top:12px;">Lanjut →</button>
  `;

  document.getElementById('gqResetBtn').onclick = ()=>{ clearTimer(); setPresenceStatus('idle'); renderGrammarIntro(); };
  document.querySelectorAll('#gqOptionsWrap .opt').forEach(btn=>{
    btn.addEventListener('click', ()=> handleGrammarQuizAnswer(parseInt(btn.dataset.orig,10), item));
  });
}

function handleGrammarQuizAnswer(selectedIdx, item){
  if(grammarQuizAnswered) return;
  grammarQuizAnswered = true;

  const isCorrect = selectedIdx === item.a;
  document.querySelectorAll('#gqOptionsWrap .opt').forEach(btn=>{
    btn.disabled = true;
    const btnIdx = parseInt(btn.dataset.orig,10);
    if(btnIdx === item.a){
      btn.classList.add('correct');
    } else if(btnIdx === selectedIdx && !isCorrect){
      btn.classList.add('wrong');
    }
  });

  if(isCorrect){ grammarQuizScore += 1; } else { grammarQuizMissed.push(item); }

  const explainEl = document.getElementById('gqExplain');
  explainEl.style.display = 'block';
  explainEl.innerHTML = (isCorrect ? '✅ Benar! ' : '❌ Kurang tepat. ') + escapeHtmlIdx(item.exp);
  explainEl.classList.toggle('is-correct', isCorrect);
  explainEl.classList.toggle('is-wrong', !isCorrect);

  const nextBtn = document.getElementById('gqNextBtn');
  nextBtn.style.display = 'block';
  nextBtn.onclick = ()=>{ grammarQuizIdx += 1; renderGrammarQuizQuestion(); };
}

function finishGrammarQuizRound(){
  clearTimer();
  if(grammarQuizRound === 0){
    pushScoreHistory({
      mode: 'practice',
      quizType: 'grammar',
      scope: grammarQuizScope,
      total: grammarQuizQueue.length,
      missedFirst: grammarQuizMissed.length
    });
  }

  if(grammarQuizMissed.length === 0){
    setPresenceStatus('done');
    statusVal.textContent = "KHATAM ✓";
    card.innerHTML = `
      <div class="center-stack">
        <div class="section-tag" style="background:var(--green);color:#fff;">SEMUA BENAR</div>
        <h1 class="intro-title">Mantap, khatam! 🎉</h1>
        <p class="intro-desc">Kamu jawab benar semua soal grammar di sesi ini. Grammar-mu makin jago!</p>
        <button class="btn" id="gqBackBtn">Kembali ke Menu Grammar</button>
      </div>
    `;
    document.getElementById('gqBackBtn').onclick = ()=> renderGrammarIntro();
    return;
  }

  const missedCount = grammarQuizMissed.length;
  statusVal.textContent = "REVISIT";
  card.innerHTML = `
    <div class="center-stack">
      <div class="section-tag" style="background:var(--gold);color:#fff;">${missedCount} SALAH</div>
      <h1 class="intro-title">Hampir khatam!</h1>
      <p class="intro-desc">Kamu salah <b>${missedCount}</b> soal dari total ${grammarQuizQueue.length}. Yuk diulang khusus yang salah sampai bener semua.</p>
      <div class="missed-list">
        ${grammarQuizMissed.map(m=>`<div class="missed-item"><span class="id">${escapeHtmlIdx(m.q)}</span><span class="ans">${escapeHtmlIdx(m.opts[m.a])}</span></div>`).join('')}
      </div>
      <button class="btn" id="gqRetryBtn">Ulangi Soal yang Salah →</button>
      <button class="btn ghost" id="gqBackBtn2">← Kembali ke Menu Grammar</button>
    </div>
  `;
  document.getElementById('gqRetryBtn').onclick = ()=>{
    grammarQuizQueue = shuffle(grammarQuizMissed.slice());
    grammarQuizMissed = [];
    grammarQuizIdx = 0;
    grammarQuizRound += 1;
    renderGrammarQuizQuestion();
  };
  document.getElementById('gqBackBtn2').onclick = ()=> renderGrammarIntro();
}

// Suara baca ringkasan materi grammar versi simpel (pakai TTS bawaan browser/HP, Bahasa Indonesia).
function speakMateriSimple(text, btnEl){
  try{
    if(typeof speechSynthesis === 'undefined' || !text) return;
    speechSynthesis.cancel(); // hentikan suara sebelumnya biar gak numpuk
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'id-ID';
    utter.rate = 0.95;
    if(btnEl){
      btnEl.classList.add('playing');
      btnEl.textContent = '⏸ Sedang Membacakan...';
      utter.onend = ()=>{ btnEl.classList.remove('playing'); btnEl.textContent = '🔊 Dengarkan Penjelasan Simpel'; };
      utter.onerror = ()=>{ btnEl.classList.remove('playing'); btnEl.textContent = '🔊 Dengarkan Penjelasan Simpel'; };
    }
    speechSynthesis.speak(utter);
  }catch(e){ /* diam aja kalau HP gak support TTS */ }
}

function grammarCategories(){
  return [...new Set(GRAMMAR_FORMULAS.map(f => f.category))];
}

function grammarPoolByCategory(cat){
  return GRAMMAR_FORMULAS.filter(f => f.category === cat);
}

function grammarCategoryGridHtml(){
  const cats = grammarCategories();
  let html = '<div class="day-grid">';
  cats.forEach(cat=>{
    const count = grammarPoolByCategory(cat).length;
    const activeCls = selectedGrammarCategory === cat ? 'active' : '';
    html += `<button class="day-btn ${activeCls}" data-gcat="${escapeHtmlIdx(cat)}" type="button">
      <div class="dnum">KATEGORI</div>
      <div class="dtitle">${escapeHtmlIdx(cat)}</div>
      <div class="dcount">${count} materi</div>
    </button>`;
  });
  html += '</div>';
  return html;
}

  `;

  document.getElementById('tensesBackBtn').onclick = ()=>{ setPresenceStatus('idle'); renderGrammarIntro(); };
  document.getElementById('tensesExplainAllBtn').onclick = ()=> renderSixteenTensesExplanationList();

  const audioEl = document.getElementById('tensesSongAudio');
  const audioEl2 = document.getElementById('tensesSongAudio2');
  const songBtn = document.getElementById('tensesSongBtn');
  const repeatBtn = document.getElementById('tensesRepeatBtn');
  const lyricsList = document.getElementById('tensesLyricsList');
  const viewport = document.querySelector('.tenses-lyrics-viewport');
  const progressBar = document.getElementById('tensesProgressBar');
  const progressFill = document.getElementById('tensesProgressFill');
  const timeCur = document.getElementById('tensesTimeCur');
  const timeDur = document.getElementById('tensesTimeDur');
  tensesActiveIdx = -2;
  tensesRepeatOn = false;
  // Audio yang lagi "pegang kendali" tampilan (progress bar, waktu, tombol play/pause).
  // Waktu mode ulang nyala, ini gantian antara audioEl (sound 1) dan audioEl2 (sound 2).
  let tensesActiveAudio = audioEl;

  function fmtTime(s){
    if(isNaN(s) || s < 0) s = 0;
    const m = Math.floor(s/60), ss = Math.floor(s%60);
    return m + ':' + String(ss).padStart(2,'0');
  }

  function updateActiveLine(){
    const ct = audioEl.currentTime;
    let idx = -1;
    for(let i=0;i<TENSES_LYRICS.length;i++){ if(ct >= TENSES_LYRICS[i].t) idx = i; else break; }
    if(idx !== tensesActiveIdx){
      tensesActiveIdx = idx;
      const lines = lyricsList.querySelectorAll('.tenses-lyrics-line');
      lines.forEach((el,i)=>{
        el.classList.toggle('active', i===idx);
        el.classList.toggle('done', idx>=0 && i<idx);
      });
      const viewportH = viewport.clientHeight;
      const targetEl = lines[idx >= 0 ? idx : 0];
      const offset = (viewportH/2) - (targetEl.offsetTop + targetEl.offsetHeight/2);
      lyricsList.style.transform = `translateY(${offset}px)`;
    }
  }

  lyricsList.querySelectorAll('.tenses-lyrics-line').forEach(el=>{
    el.onclick = ()=>{
      const i = parseInt(el.dataset.idx,10);
      audioEl.currentTime = TENSES_LYRICS[i].t;
      if(audioEl.paused) audioEl.play().catch(()=>{});
    };
  });

  songBtn.onclick = ()=>{
    if(tensesActiveAudio.paused){
      tensesActiveAudio.play().catch(()=>{});
    } else {
      tensesActiveAudio.pause();
    }
  };
  document.getElementById('tensesBackBtn10').onclick = ()=>{
    tensesActiveAudio.currentTime = Math.max(0, tensesActiveAudio.currentTime - 10);
  };
  document.getElementById('tensesFwdBtn10').onclick = ()=>{
    const dur = isNaN(tensesActiveAudio.duration) ? Infinity : tensesActiveAudio.duration;
    tensesActiveAudio.currentTime = Math.min(dur, tensesActiveAudio.currentTime + 10);
  };
  // Mode ulang: sound 1 selesai penuh -> lanjut sound 2 penuh -> balik sound 1 -> dst,
  // terus gantian sampai tombol ini dimatikan lagi.
  repeatBtn.onclick = ()=>{
    tensesRepeatOn = !tensesRepeatOn;
    repeatBtn.classList.toggle('on', tensesRepeatOn);
    // audio.loop dimatikan total karena pengulangan sekarang ditangani manual (gantian 2 sound) lewat onended.
    audioEl.loop = false;
    audioEl2.loop = false;
    const nowPlayingEl = document.getElementById('tensesNowPlaying');
    if(tensesRepeatOn){
      nowPlayingEl.style.display = 'block';
      nowPlayingEl.textContent = (tensesActiveAudio === audioEl) ? '🔁 Sedang muter: Sound 1' : '🔁 Sedang muter: Sound 2';
    } else {
      nowPlayingEl.style.display = 'none';
    }
  };
  progressBar.onclick = (e)=>{
    const dur = tensesActiveAudio.duration;
    if(!dur || isNaN(dur)) return;
    const rect = progressBar.getBoundingClientRect();
    const ratio = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
    tensesActiveAudio.currentTime = ratio * dur;
  };

  const nowPlayingEl = document.getElementById('tensesNowPlaying');
  function switchActiveAudio(el){
    tensesActiveAudio = el;
    timeDur.textContent = fmtTime(el.duration);
    timeCur.textContent = fmtTime(el.currentTime);
    const dur = el.duration;
    progressFill.style.width = (dur && !isNaN(dur)) ? (el.currentTime/dur*100) + '%' : '0%';
    // Lirik cuma disinkron ke sound 1; pas sound 2 lagi jalan, non-aktifkan sorotan liriknya.
    if(el !== audioEl){
      tensesActiveIdx = -1;
      lyricsList.querySelectorAll('.tenses-lyrics-line').forEach(l=>{ l.classList.remove('active','done'); });
    }
    // Tampilkan label "Sound 1/2" cuma kalau mode ulang aktif, biar jelas lagi gantian yang mana.
    if(tensesRepeatOn){
      nowPlayingEl.style.display = 'block';
      nowPlayingEl.textContent = (el === audioEl) ? '🔁 Sedang muter: Sound 1' : '🔁 Sedang muter: Sound 2';
    } else {
      nowPlayingEl.style.display = 'none';
    }
  }

  function bindAudioHandlers(el, otherEl){
    el.onplay = ()=>{
      if(tensesActiveAudio !== el) switchActiveAudio(el);
      tensesSongPlaying = true; songBtn.classList.add('playing'); songBtn.textContent = '⏸️';
    };
    el.onpause = ()=>{
      if(tensesActiveAudio === el){ tensesSongPlaying = false; songBtn.classList.remove('playing'); songBtn.textContent = '▶️'; }
    };
    el.onended = ()=>{
      if(tensesRepeatOn){
        // Gantian ke audio yang satunya, ulang dari awal, terus main.
        el.currentTime = 0;
        otherEl.currentTime = 0;
        switchActiveAudio(otherEl);
        otherEl.play().catch(()=>{});
      } else {
        tensesSongPlaying = false; songBtn.classList.remove('playing'); songBtn.textContent = '▶️';
        if(el === audioEl){ tensesActiveIdx = -1; updateActiveLine(); }
      }
    };
    el.onloadedmetadata = ()=>{ if(tensesActiveAudio === el) timeDur.textContent = fmtTime(el.duration); };
    el.ontimeupdate = ()=>{
      if(tensesActiveAudio !== el) return;
      timeCur.textContent = fmtTime(el.currentTime);
      const dur = el.duration;
      if(dur && !isNaN(dur)) progressFill.style.width = (el.currentTime/dur*100) + '%';
      if(el === audioEl) updateActiveLine();
    };
  }
  bindAudioHandlers(audioEl, audioEl2);
  bindAudioHandlers(audioEl2, audioEl);

  updateActiveLine();
}
