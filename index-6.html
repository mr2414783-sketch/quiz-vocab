/* ---------------- CEK BAN REAL-TIME (supaya orang yang diblokir admin
   saat sedang aktif langsung ke-disconnect, bukan cuma nyangkut online) ---------------- */
function watchLiveBan(name){
  unwatchLiveBan();
  const key = sanitizeNameForKey(name);
  const deviceId = getDeviceId();

  const handleBan = (ban)=>{
    if(!ban) return;
    stopPresence();
    renderBannedScreen(ban);
  };

  liveBanNameRef = db.ref('bannedUsers/' + key);
  liveBanNameHandler = (snapshot)=> handleBan(snapshot.val());
  liveBanNameRef.on('value', liveBanNameHandler);

  liveBanDeviceRef = db.ref('bannedDevices/' + deviceId);
  liveBanDeviceHandler = (snapshot)=> handleBan(snapshot.val());
  liveBanDeviceRef.on('value', liveBanDeviceHandler);
}

function unwatchLiveBan(){
  if(liveBanNameRef && liveBanNameHandler){ liveBanNameRef.off('value', liveBanNameHandler); }
  if(liveBanDeviceRef && liveBanDeviceHandler){ liveBanDeviceRef.off('value', liveBanDeviceHandler); }
  liveBanNameRef = null; liveBanDeviceRef = null; liveBanNameHandler = null; liveBanDeviceHandler = null;
}

/* ---------------- ANTI-GHOST PRESENCE ----------------
   onDisconnect() Firebase kadang telat/gagal ke-trigger (misal: koneksi HP putus
   mendadak, tab di-swipe/di-kill paksa tanpa sempat kirim sinyal disconnect).
   Kalau itu terjadi, entry presence-nya nyangkut di database dengan updatedAt lama.
   Karena listener 'value' cuma jalan ulang saat ADA perubahan data, entry basi itu
   akan terus tampil "online" selamanya kalau kebetulan tidak ada orang lain yang
   login/logout untuk memicu render ulang. Makanya di sini kita render ulang
   secara berkala (bukan cuma saat data berubah) SUPAYA basi otomatis hilang dari
   layar, dan sekalian bersihkan entry yang sudah basi lama dari database. */
let lastPresenceRaw = {};
const PRESENCE_STALE_CLEANUP_MS = PRESENCE_TTL_MS * 3; // ~2.25 menit tanpa update -> dianggap ghost, dibersihkan dari DB

function filterAndRenderPresence(){
  const now = Date.now();
  const activeUsers = Object.values(lastPresenceRaw)
    .filter(u => u && u.updatedAt && (now - u.updatedAt) < PRESENCE_TTL_MS)
    .map(u => ({ name: u.name, status: u.status || 'idle', mode: u.mode || '' }));
  renderPresencePanel(activeUsers);

  // bersihkan entry ghost (basi lama) dari database
  Object.entries(lastPresenceRaw).forEach(([key, u])=>{
    if(u && u.updatedAt && (now - u.updatedAt) >= PRESENCE_STALE_CLEANUP_MS){
      db.ref('presence/' + key).remove().catch(()=>{});
    }
  });
}

db.ref('presence').on('value', (snapshot)=>{
  lastPresenceRaw = snapshot.val() || {};
  filterAndRenderPresence();
});

/* ---------------- SISTEM LEVEL / XP (TERPISAH dari activityLeaderboard) ----------------
   XP disimpan sendiri di node Firebase 'xpProfile/{key}/xp' — independen dari
   activityLeaderboard, jadi TIDAK ikut kereset kalau admin reset leaderboard aktivitas
   (mingguan/bulanan). XP nambah tiap kali jawaban BENAR (dipanggil bareng
   incrementLeaderboardCount() di recordQuestionStat), tapi disimpan & dilacak terpisah. */
const XP_PER_SOAL = 10;
const LEVEL_TITLES = [
  { min:1, max:2, emoji:'🌱', title:'Pemula' },
  { min:3, max:4, emoji:'📖', title:'Rajin Belajar' },
  { min:5, max:6, emoji:'✍️', title:'Jagoan Latihan' },
  { min:7, max:8, emoji:'🎯', title:'Ahli Vocab' },
  { min:9, max:11, emoji:'🏅', title:'Sang Master' },
  { min:12, max:15, emoji:'💎', title:'Veteran' },
  { min:16, max:20, emoji:'🔥', title:'Legenda' },
  { min:21, max:Infinity, emoji:'👑', title:'Grandmaster' }
];
function xpForLevel(level){ return 100 * (level-1) * (level-1); }
function xpLevelInfo(totalXp){
  totalXp = Math.max(0, totalXp || 0);
  let level = 1;
  while(xpForLevel(level+1) <= totalXp && level < 500){ level++; }
  const xpCur = xpForLevel(level);
  const xpNext = xpForLevel(level+1);
  const span = Math.max(1, xpNext - xpCur);
  const progress = Math.max(0, Math.min(1, (totalXp - xpCur) / span));
  return { level, xp: totalXp, xpCur, xpNext, progress };
}
function xpLevelTitle(level){
  return LEVEL_TITLES.find(t=> level>=t.min && level<=t.max) || LEVEL_TITLES[LEVEL_TITLES.length-1];
}

/* Cache lokal + listener real-time ke node XP milik peserta sendiri (dipasang sekali

let xpLastKnownLevel = null;
let xpToastQueue = [];
let xpToastShowing = false;
function showLevelUpToast(level){
  const t = xpLevelTitle(level);
  xpToastQueue.push(t.emoji + ' Level Up! Kamu naik ke <b>Level ' + level + ' · ' + t.title + '</b>');
  if(xpToastShowing) return;
  const step = ()=>{
    const msg = xpToastQueue.shift();
    if(!msg){ xpToastShowing = false; return; }
    xpToastShowing = true;
    const el = document.createElement('div');
    el.className = 'level-toast';
    el.innerHTML = `<div style="font-size:22px;">🆙</div><div>${msg}</div>`;
    document.body.appendChild(el);
    requestAnimationFrame(()=> el.classList.add('show'));
    setTimeout(()=>{
      el.classList.remove('show');
      setTimeout(()=>{ el.remove(); step(); }, 350);
    }, 3200);
  };
  step();
}
function checkLevelUp(){
  const name = getSavedName();
  if(!name) return;
  const key = sanitizeNameForKey(name);
  const info = xpLevelInfo(xpGetMyXp());
  const storeKey = 'xpKnownLevel_' + key;
  let known = xpLastKnownLevel;
  if(known === null){
    try{ known = parseInt(localStorage.getItem(storeKey), 10); }catch(e){ known = NaN; }
    if(isNaN(known)) known = info.level; // pertama kali dipakai: jangan langsung toast, cukup catat
  }
  if(info.level > known){ showLevelUpToast(info.level); }
  xpLastKnownLevel = info.level;
  try{ localStorage.setItem(storeKey, String(info.level)); }catch(e){}
}

let lbResetScheduleCfg = null;
let lbLastResetAt = 0;
let lbResetScheduleCfgLoaded = false;
let lbLastResetAtLoaded = false;
function lbComputePeriodStart(freq, hour, refTime){
  const d = new Date(refTime);
  const h = (hour===undefined || hour===null) ? 0 : hour;
  if(freq === 'weekly'){
    d.setHours(h,0,0,0);
    const day = d.getDay();
    d.setDate(d.getDate() - day);
    if(d.getTime() > refTime) d.setDate(d.getDate()-7);
  } else if(freq === 'monthly'){
    d.setDate(1); d.setHours(h,0,0,0);
    if(d.getTime() > refTime){ d.setMonth(d.getMonth()-1); d.setDate(1); }
  } else {
    d.setHours(h,0,0,0);
    if(d.getTime() > refTime) d.setDate(d.getDate()-1);
  }
  return d.getTime();
}
function lbCheckAutoReset(){
  // Tunggu KEDUA nilai settingan beneran kebaca dari Firebase dulu — kalau belum,
  // lbLastResetAt masih default 0 dan bisa salah dianggap "belum pernah direset"
  // padahal cuma belum selesai loading, yang bikin reset ke-trigger tiap refresh.
  if(!lbResetScheduleCfgLoaded || !lbLastResetAtLoaded) return;
  if(!lbResetScheduleCfg || !lbResetScheduleCfg.enabled) return;
  const periodStart = lbComputePeriodStart(lbResetScheduleCfg.frequency || 'weekly', lbResetScheduleCfg.hour || 0, Date.now());
  if(periodStart <= (lbLastResetAt || 0)) return;
  const raw = lastActivityLeaderboardRaw || {};
  const updates = {};
  Object.keys(raw).forEach((k)=>{
    updates['activityLeaderboard/' + k + '/autoCount'] = 0;
    updates['activityLeaderboard/' + k + '/adjust'] = 0;
  });
  updates['settings/lbLastResetAt'] = periodStart;
  db.ref().update(updates).catch(()=>{});
}
db.ref('settings/lbResetSchedule').on('value', (snapshot)=>{
  lbResetScheduleCfg = snapshot.val() || null;
  lbResetScheduleCfgLoaded = true;
  lbCheckAutoReset();
});
db.ref('settings/lbLastResetAt').on('value', (snapshot)=>{
  lbLastResetAt = snapshot.val() || 0;
  lbLastResetAtLoaded = true;

});

const DUEL_SOURCE_LABEL = { vocab: '📚 Vocab', grammar: '✍️ Grammar', mix: '🔀 Campuran' };
const DUEL_TYPE_LABEL = { mcq: '🔘 Pilihan Ganda', essay: '⌨️ Essay (ketik jawaban)' };

function duelBuildQuestions(n, source, qType){
  source = source || 'vocab';
  qType = qType || 'mcq';
  if(qType === 'essay'){
    function fromVocabEssay(count){ return shuffle(ALL).slice(0, count).map(it=>({ prompt: it.id, correct: it.en })); }
    function fromGrammarEssay(count){ return shuffle(GRAMMAR_QUIZ_QUESTIONS).slice(0, count).map(g=>({ prompt: g.q, correct: g.opts[g.a] })); }
    if(source === 'vocab') return fromVocabEssay(n);
    if(source === 'grammar') return fromGrammarEssay(n);
    const half = Math.ceil(n/2);
    return shuffle(fromVocabEssay(half).concat(fromGrammarEssay(n - half)));
  }
  return kahootBuildQuestions(n, source); // format {prompt, correct, options}
}
function duelLeaveQueue(){
  if(duelMatchInterval){ clearInterval(duelMatchInterval); duelMatchInterval = null; }
  if(duelQueueRef){ duelQueueRef.off(); duelQueueRef.remove().catch(()=>{}); duelQueueRef = null; }

function renderDuelLobby(onBack){
  clearTimer();
  statusVal.textContent = "DUEL 1V1";
  setPresenceStatus('idle');
  const name = getSavedName();
  const myKey = sanitizeNameForKey(name);
  const mySetup = { count: duelSetupCount, source: duelSetupSource, qtype: duelSetupType };
  card.innerHTML = `
    <div class="center-stack">
      <div class="section-tag" style="background:#8b5cf6;color:#fff;">⚔️ DUEL 1V1</div>
      <h1 class="intro-title">Cari Lawan...</h1>
      <p class="intro-desc" style="font-size:12px;">${mySetup.count} soal ${DUEL_TYPE_LABEL[mySetup.qtype]} · ${DUEL_SOURCE_LABEL[mySetup.source]}. Skor lebih tinggi menang, kalau seri yang tercepat yang menang.</p>
      <div id="duelLobbyStatus" class="lb-empty-light" style="margin-top:10px;">Menyiapkan...</div>
      <button class="btn ghost" id="duelCancelBtn" style="margin-top:14px;">✕ Batalkan</button>
    </div>
  `;
  const statusEl = document.getElementById('duelLobbyStatus');
  document.getElementById('duelCancelBtn').onclick = ()=>{ duelLeaveQueue(); renderDuelSetup(onBack); };

  const myQueueRef = db.ref('duelQueue/' + myKey);
  duelQueueRef = myQueueRef;

  function tryMatch(){
    db.ref('duelQueue').once('value').then((snap)=>{
      const all = snap.val() || {};
      const candidates = Object.entries(all).filter(([k,v])=> k !== myKey && v && !v.claimedBy && !v.roomId &&
        (v.count||10) === mySetup.count && (v.source||'vocab') === mySetup.source && (v.qtype||'mcq') === mySetup.qtype);
      if(candidates.length === 0){ if(statusEl) statusEl.textContent = 'Menunggu lawan dengan setelan yang sama...'; return; }
      const [oppKey, oppVal] = candidates[0];
      const roomId = [myKey, oppKey].sort().join('__') + '_' + Date.now();
      db.ref('duelQueue/' + oppKey + '/claimedBy').transaction((cur)=>{
        if(cur) return;
        return myKey;
      }, (err, committed, snapAfter)=>{
        if(err || !committed) return;
        if(!snapAfter || snapAfter.val() !== myKey) return;
        const questions = duelBuildQuestions(mySetup.count, mySetup.source, mySetup.qtype);
        db.ref('duels/' + roomId).set({
          player1: { key: myKey, name: name },
          player2: { key: oppKey, name: oppVal.name },
          questions: questions,
          createdAt: firebase.database.ServerValue.TIMESTAMP
        }).then(()=>{
          db.ref('duelQueue/' + oppKey).update({ roomId: roomId });
          duelQueueRef = null;
          myQueueRef.off();
          myQueueRef.remove().catch(()=>{});
          if(duelMatchInterval){ clearInterval(duelMatchInterval); duelMatchInterval = null; }
          igTabGo(()=> renderDuelRoom(roomId, onBack));
        });
      });
    });
  }

  myQueueRef.set({ name: name, joinedAt: firebase.database.ServerValue.TIMESTAMP, count: mySetup.count, source: mySetup.source, qtype: mySetup.qtype }).then(()=>{
    if(statusEl) statusEl.textContent = 'Mencari lawan...';
    myQueueRef.on('value', (snap)=>{
      const val = snap.val();
      if(val && val.roomId){
        myQueueRef.off();
        duelQueueRef = null;
        if(duelMatchInterval){ clearInterval(duelMatchInterval); duelMatchInterval = null; }
        igTabGo(()=> renderDuelRoom(val.roomId, onBack));
      }
    });
    tryMatch();
    duelMatchInterval = setInterval(tryMatch, 4000);
  });
}
function renderDuelRoom(roomId, onBack){
  clearTimer();
  if(duelMatchInterval){ clearInterval(duelMatchInterval); duelMatchInterval = null; }
  duelRoomId = roomId;
  const name = getSavedName();
  const myKey = sanitizeNameForKey(name);
  statusVal.textContent = "DUEL 1V1";
  setPresenceStatus('in_progress');
  setPresenceMode('Duel 1v1');
  db.ref('duels/' + roomId).once('value').then((snap)=>{
    const room = snap.val();
    if(!room){
      card.innerHTML = `<div class="center-stack"><p class="intro-desc">Room duel tidak ditemukan atau sudah berakhir.</p><button class="btn ghost" id="duelBackBtn2">← Kembali</button></div>`;
      document.getElementById('duelBackBtn2').onclick = onBack;
      return;
    }
    const isP1 = room.player1.key === myKey;
    const oppName = isP1 ? room.player2.name : room.player1.name;
    duelCurrentQ = 0;
    duelScore = 0;
    duelStartedAt = Date.now();
    renderDuelQuestion(room, myKey, oppName, onBack);
  });
}
function renderDuelQuestion(room, myKey, oppName, onBack){
  const q = room.questions[duelCurrentQ];
  const isMcq = Array.isArray(q.options);
  card.innerHTML = `
    <div class="center-stack">
      <div class="section-tag" style="background:#8b5cf6;color:#fff;">⚔️ VS ${escapeHtmlIdx(oppName)}</div>
      <div class="presence-title" style="font-size:11px;">Soal ${duelCurrentQ+1} / ${room.questions.length} · Skor: ${duelScore}</div>
      <div class="question">${isMcq ? 'Pilih jawaban yang tepat:' : 'Ketik jawabannya:'}</div>
      <div class="question-word">"${escapeHtmlIdx(q.prompt)}"</div>
      ${isMcq ? `
      <div class="options" id="duelOptionsWrap">
        ${q.options.map((opt,i)=>`
          <button class="opt" data-val="${opt.replace(/\"/g,'&quot;')}">
            <span class="letter">${String.fromCharCode(65+i)}</span>
            <span>${escapeHtmlIdx(opt)}</span>
          </button>
        `).join('')}
      </div>` : `
      <div class="essay-wrap">
        <input type="text" id="duelEssayInput" class="essay-input" placeholder="Ketik jawabanmu di sini..." autocomplete="off" autocapitalize="off" spellcheck="false" />
        <button class="btn" id="duelEssaySubmitBtn" style="width:100%;">Kirim Jawaban →</button>
      </div>`}
    </div>
  `;
  if(isMcq){
    document.querySelectorAll('#duelOptionsWrap .opt').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        document.querySelectorAll('#duelOptionsWrap .opt').forEach(b=> b.disabled = true);
        if(btn.dataset.val === q.correct){ duelScore += 1; btn.style.borderColor = 'var(--green)'; }
        else{ btn.style.borderColor = 'var(--red)'; }
        setTimeout(()=>{
          duelCurrentQ += 1;
          if(duelCurrentQ >= room.questions.length){ duelFinish(room, myKey, oppName, onBack); }
          else { renderDuelQuestion(room, myKey, oppName, onBack); }
        }, 650);
      });
    });
  } else {
    const input = document.getElementById('duelEssayInput');
    input.focus();
    let submitted = false;
    function submit(){
      if(submitted) return;
      submitted = true;
      const isCorrect = normalizeAnswer(input.value).length > 0 && normalizeAnswer(input.value) === normalizeAnswer(q.correct);
      input.disabled = true;
      input.classList.add(isCorrect ? 'correct' : 'wrong');
      if(isCorrect) duelScore += 1;
      document.getElementById('duelEssaySubmitBtn').disabled = true;
      setTimeout(()=>{
        duelCurrentQ += 1;
        if(duelCurrentQ >= room.questions.length){ duelFinish(room, myKey, oppName, onBack); }
        else { renderDuelQuestion(room, myKey, oppName, onBack); }
      }, 700);
    }
    input.addEventListener('keydown', (e)=>{ if(e.key === 'Enter'){ e.preventDefault(); submit(); } });
    document.getElementById('duelEssaySubmitBtn').addEventListener('click', submit);
  }
}
function duelFinish(room, myKey, oppName, onBack){
  const durationMs = Date.now() - duelStartedAt;
  db.ref('duels/' + duelRoomId + '/scores/' + myKey).set({
    score: duelScore, total: room.questions.length, durationMs, finishedAt: firebase.database.ServerValue.TIMESTAMP
  });
  card.innerHTML = `
    <div class="center-stack">
      <div class="section-tag" style="background:#8b5cf6;color:#fff;">⚔️ DUEL SELESAI</div>

    </div>
  `;
  const oppKey = room.player1.key === myKey ? room.player2.key : room.player1.key;
  const scoresRef = db.ref('duels/' + duelRoomId + '/scores');
  scoresRef.on('value', (snap)=>{
    const scores = snap.val() || {};
    const mine = scores[myKey];
    const opp = scores[oppKey];
    if(mine && opp){
      scoresRef.off();
      let resultText = '🤝 Seri!';
      if(mine.score !== opp.score){
        resultText = mine.score > opp.score ? '🏆 Kamu Menang!' : '😢 Kamu Kalah.';
      } else if(mine.durationMs !== opp.durationMs){
        resultText = mine.durationMs < opp.durationMs ? '🏆 Kamu Menang! (lebih cepat)' : '😢 Kamu Kalah. (lawan lebih cepat)';
      }
      const waitEl = document.getElementById('duelWaitText');
      if(waitEl) waitEl.textContent = resultText;
      const boxEl = document.getElementById('duelResultBox');
      if(boxEl) boxEl.innerHTML = `
        <div style="display:flex;justify-content:space-between;width:100%;padding:8px 12px;border:1.5px solid var(--line);border-radius:12px;margin-top:8px;">
          <span><b>Kamu</b></span><span>${mine.score}/${mine.total} · ⏱ ${formatDuration(mine.durationMs)}</span>
        </div>
        <div style="display:flex;justify-content:space-between;width:100%;padding:8px 12px;border:1.5px solid var(--line);border-radius:12px;margin-top:6px;">
          <span><b>${escapeHtmlIdx(oppName)}</b></span><span>${opp.score}/${opp.total} · ⏱ ${formatDuration(opp.durationMs)}</span>
        </div>
      `;
      const backBtn = document.getElementById('duelBackBtn');
      if(backBtn){
        backBtn.style.display = 'inline-block';
        backBtn.onclick = ()=>{ db.ref('duels/' + duelRoomId).remove().catch(()=>{}); onBack(); };
      }
      checkAndAwardBadges(getSavedName());
    }
  });
}

/* ==================== KUIS LIVE (mode Kahoot) ====================
   Satu peserta jadi HOST (bikin room + PIN 6 digit), peserta lain GABUNG pakai
   PIN dari device masing-masing. Semua state disinkron real-time lewat Firebase
   di node 'kahootSessions/{pin}'. Host yang menghitung & nulis skor (satu sumber
   kebenaran) supaya gak ada race condition antar device peserta. */

const KAHOOT_SHAPES = ['▲','◆','●','■'];

/* ---- Audio "musik ala Kahoot" — disintesis langsung di browser (Web Audio API),
   jadi tidak perlu file musik berhak cipta apa pun. ---- */
let kahootAudioCtx = null;
let kahootMusicTimer = null;
let kahootMusicStep = 0;
let kahootSoundOn = (localStorage.getItem('kahootSoundOn') !== '0');
function kahootGetCtx(){
  if(!kahootAudioCtx){
    try{ kahootAudioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; }
  }
  if(kahootAudioCtx.state === 'suspended'){ kahootAudioCtx.resume().catch(()=>{}); }
  return kahootAudioCtx;
}
function kahootBeep(freq, start, dur, type, vol){
  if(!kahootSoundOn) return;
  const ctx = kahootGetCtx();
  if(!ctx) return;
  try{
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type || 'sine';
    osc.frequency.value = freq;
    const t0 = ctx.currentTime + start;
    gain.gain.setValueAtTime(0, t0);
    gain.gain.linearRampToValueAtTime(vol||0.12, t0 + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(t0); osc.stop(t0 + dur + 0.05);
  }catch(e){}
}
function kahootStopMusic(){ clearInterval(kahootMusicTimer); kahootMusicTimer = null; }
function kahootPlayLobbyMusic(){
  kahootStopMusic();
  if(!kahootSoundOn) return;
  const pattern = [523.25,659.25,783.99,659.25,523.25,659.25,987.77,783.99];
  kahootMusicStep = 0;
  kahootMusicTimer = setInterval(()=>{
    kahootBeep(pattern[kahootMusicStep % pattern.length], 0, 0.22, 'triangle', 0.05);
    kahootMusicStep++;
  }, 230);
}
function kahootPlayTensionMusic(){
  kahootStopMusic();
  if(!kahootSoundOn) return;
  const pattern = [220,220,246.94,220,196,220,246.94,261.63];
  kahootMusicStep = 0;
  kahootMusicTimer = setInterval(()=>{
    kahootBeep(pattern[kahootMusicStep % pattern.length], 0, 0.16, 'square', 0.035);
    kahootMusicStep++;
  }, 180);
}
function kahootPlayTick(){ kahootBeep(880, 0, 0.07, 'square', 0.08); }
function kahootPlayCorrect(){

}
function kahootPlayWrong(){

}
function kahootPlayReveal(){

function kahootPlayPodium(){

function kahootToggleSound(){
  kahootSoundOn = !kahootSoundOn;
  localStorage.setItem('kahootSoundOn', kahootSoundOn?'1':'0');
  if(!kahootSoundOn) kahootStopMusic();
  document.querySelectorAll('.kahoot-mute-btn').forEach(b=> b.textContent = kahootSoundOn ? '🔊' : '🔇');

function kahootMuteBtnHtml(){

}
function kahootWireMuteBtn(){
  const b = document.getElementById('kahootMuteBtn');
  if(b) b.onclick = ()=> kahootToggleSound();
}

function kahootBuildQuestions(n, source){
  source = source || 'mix';
  function fromVocab(count){
    return shuffle(ALL).slice(0, count).map(it=>({
      prompt: it.id, correct: it.en, options: buildOptions(it, ALL)
    }));
  }
  function fromGrammar(count){
    return shuffle(GRAMMAR_QUIZ_QUESTIONS).slice(0, count).map(g=>({
      prompt: g.q, correct: g.opts[g.a], options: shuffle(g.opts.slice())
    }));
  }
  if(source === 'vocab') return fromVocab(n);
  if(source === 'grammar') return fromGrammar(n);
  // campuran: separuh dari Hafalan Vocab, separuh dari Grammar
  const half = Math.ceil(n/2);
  return shuffle(fromVocab(half).concat(fromGrammar(n - half)));
}

function kahootCreateSession(onBack){
  const name = getSavedName();
  if(!myPresenceRef){ startPresence(name); }
  const btn = document.getElementById('kahootCreateBtn');
  if(btn){ btn.disabled = true; btn.textContent = 'Membuat room...'; }
  const questions = kahootBuildQuestions(kahootSetupCount, kahootSetupSource);
  function tryPin(attempts){
    if(attempts > 6){
      alert('Gagal membuat room (PIN bentrok terus). Coba lagi ya.');
      if(btn){ btn.disabled = false; btn.textContent = 'Buat Room →'; }
      return;
    }
    const pin = String(Math.floor(100000 + Math.random()*900000));
    const sessionRef = db.ref('kahootSessions/' + pin);
    sessionRef.once('value').then((snap)=>{
      if(snap.exists()){ tryPin(attempts+1); return; }
      kahootIsHost = true;
      kahootPin = pin;
      kahootSessionRef = sessionRef;
      kahootMyKey = sanitizeNameForKey(name);
      kahootMyName = name;
      sessionRef.set({
        hostName: name, hostKey: kahootMyKey, status: 'lobby',
        createdAt: firebase.database.ServerValue.TIMESTAMP,
        questions: questions, duration: kahootSetupDuration, source: kahootSetupSource,
        currentIndex: 0, questionStartedAt: 0, players: {}
      }).then(()=>{
        sessionRef.onDisconnect().remove();
        renderKahootHostRoom();
      }).catch((err)=>{
        alert('Gagal membuat room: ' + err.message);
        if(btn){ btn.disabled = false; btn.textContent = 'Buat Room →'; }
      });
    });
  }
  tryPin(0);
}

function renderKahootHostRoom(){
  statusVal.textContent = "KUIS LIVE · HOST";

  setPresenceMode('Kuis Live (Host)');

  kahootSessionRef.on('value', (snap)=>{
    const room = snap.val();
    if(!room){
      kahootCleanupClientState();
      return;
    }
    kahootRenderHostByStatus(room);
  });
}

function kahootRenderHostByStatus(room){
  const idx = room.currentIndex || 0;
  if(room.status === 'lobby'){
    kahootRenderedKey = 'lobby';
    kahootRenderHostLobby(room);
  } else if(room.status === 'question'){
    const key = 'question_' + idx;
    if(kahootRenderedKey !== key){
      kahootRenderedKey = key;
      kahootHostRevealing = false;
      kahootRenderHostQuestion(room, idx);
    } else {
      kahootUpdateHostAnswerCount(room, idx);
    }
  } else if(room.status === 'reveal'){
    const key = 'reveal_' + idx;
    if(kahootRenderedKey !== key){ kahootRenderedKey = key; kahootRenderHostReveal(room, idx); }
  } else if(room.status === 'leaderboard'){
    const key = 'lb_' + idx;
    if(kahootRenderedKey !== key){ kahootRenderedKey = key; kahootRenderHostLeaderboard(room, idx); }
  } else if(room.status === 'ended'){
    if(kahootRenderedKey !== 'ended'){ kahootRenderedKey = 'ended'; kahootRenderHostEnded(room); }
  }
}

  kahootStopMusic();
  card.innerHTML = `
    <div class="kahoot-theme">
      ${kahootMuteBtnHtml()}
      <div class="center-stack">
        <div class="section-tag" style="background:#ffd60a;color:#46178f;">Soal ${idx+1} / ${room.questions.length} · PIN ${kahootPin}</div>
        <div class="kahoot-qbar">${escapeHtmlIdx(q.prompt)}</div>
        <span class="kahoot-timer-num" id="kahootHostTimerNum">${room.duration||20}</span>
        <div style="width:100%;height:8px;background:rgba(255,255,255,0.2);border-radius:4px;overflow:hidden;"><div id="kahootHostTimerFill" style="height:100%;background:#ffd60a;width:100%;transition:width 0.25s linear;"></div></div>
        <p class="intro-desc" id="kahootHostAnswerCount" style="font-size:13px;font-weight:700;">0 / ${Object.keys(room.players||{}).length} sudah jawab</p>
        <button class="btn" id="kahootRevealBtn">Lihat Jawaban Sekarang →</button>
      </div>
    </div>
  `;
  kahootWireMuteBtn();
  const duration = room.duration || 20;
  const startedAt = room.questionStartedAt || Date.now();
  clearInterval(kahootQuestionTimer);
  let lastSec = -1;
  function tick(){
    const elapsed = (Date.now() - startedAt) / 1000;
    const remain = Math.max(0, duration - elapsed);
    const fill = document.getElementById('kahootHostTimerFill');
    if(fill) fill.style.width = Math.max(0, (remain/duration*100)) + '%';
    const secLeft = Math.ceil(remain);
    if(secLeft !== lastSec){
      lastSec = secLeft;
      const numEl = document.getElementById('kahootHostTimerNum');
      if(numEl) numEl.textContent = secLeft;
      if(secLeft <= 5 && secLeft > 0) kahootPlayTick();
    }
    if(remain <= 0){
      clearInterval(kahootQuestionTimer);
      kahootHostReveal(room, idx);
    }
  }
  tick();
  kahootQuestionTimer = setInterval(tick, 100);
  document.getElementById('kahootRevealBtn').onclick = ()=> kahootHostReveal(room, idx);
  kahootUpdateHostAnswerCount(room, idx);
}

function kahootUpdateHostAnswerCount(room, idx){
  const el = document.getElementById('kahootHostAnswerCount');
  if(!el) return;
  const answered = Object.keys((room.answers && room.answers[idx]) || {}).length;
  const total = Object.keys(room.players || {}).length;
  el.textContent = `${answered} / ${total} sudah jawab`;
}

function kahootHostReveal(room, idx){
  if(kahootHostRevealing) return;
  kahootHostRevealing = true;
  clearInterval(kahootQuestionTimer);
  const q = room.questions[idx];
  const startedAt = room.questionStartedAt || Date.now();
  const duration = room.duration || 20;
  kahootSessionRef.child('answers/' + idx).once('value').then((snap)=>{
    const answers = snap.val() || {};
    const updates = {};
    Object.entries(answers).forEach(([key, ans])=>{
      const correct = ans.choice === q.correct;
      let points = 0;
      if(correct){
        const elapsed = Math.max(0, (ans.answeredAt || startedAt) - startedAt);
        const ratio = Math.min(1, elapsed / (duration*1000));
        points = Math.round(500 + 500*(1-ratio));
      }
      updates['answers/' + idx + '/' + key + '/correct'] = correct;
      updates['answers/' + idx + '/' + key + '/points'] = points;
    });
    return kahootSessionRef.update(updates).then(()=> answers);
  }).then((answers)=>{
    const keys = Object.keys(answers);
    let chain = Promise.resolve();
    keys.forEach((key)=>{
      chain = chain.then(()=> Promise.all([
        kahootSessionRef.child('players/' + key + '/score').once('value'),
        kahootSessionRef.child('answers/' + idx + '/' + key + '/points').once('value')
      ])).then(([scoreSnap, ptsSnap])=>{
        const cur = scoreSnap.val() || 0;
        const pts = ptsSnap.val() || 0;
        return kahootSessionRef.child('players/' + key + '/score').set(cur + pts);
      });
    });
    return chain;
  }).then(()=>{
    return kahootSessionRef.update({ status: 'reveal' });
  }).catch((err)=>{
    console.error('kahootHostReveal error', err);
  }).then(()=>{
    kahootHostRevealing = false;
  });
}

function kahootRenderHostReveal(room, idx){
  const q = room.questions[idx];
  const answers = (room.answers && room.answers[idx]) || {};
  const correctCount = Object.values(answers).filter(a=> a && a.correct).length;
  const total = Object.keys(room.players||{}).length;
  const counts = q.options.map(opt=> Object.values(answers).filter(a=> a && a.choice === opt).length);
  const maxCount = Math.max(1, ...counts);
  const distRows = q.options.map((opt,i)=> `
    <div class="kahoot-distrow">
      <span class="kahoot-shape">${KAHOOT_SHAPES[i]}</span>
      <div class="kahoot-distbar"><div class="kahoot-distfill" style="width:${(counts[i]/maxCount*100)}%;background:${KAHOOT_COLORS[i]};"></div></div>
      <span>${counts[i]}</span>
    </div>
  `).join('');
  card.innerHTML = `
    <div class="kahoot-theme">
      ${kahootMuteBtnHtml()}

        <div class="section-tag" style="background:var(--green);color:#fff;">✅ JAWABAN BENAR</div>

        <button class="btn" id="kahootLbBtn">Lihat Papan Skor →</button>
      </div>
    </div>
  `;
  kahootWireMuteBtn();
  kahootPlayReveal();

}

function kahootLeaderboardRows(room){
  const players = Object.entries(room.players || {}).map(([k,v])=>({key:k, name:v.name, score:v.score||0}));
  players.sort((a,b)=> b.score - a.score);
  return players;
}

function kahootPodiumHtml(players){
  const top3 = players.slice(0,3);
  if(top3.length === 0) return '';
  const order = [1,0,2].filter(i=> i < top3.length); // tampilkan: 2nd, 1st, 3rd
  const heights = {0:'86px', 1:'64px', 2:'46px'};
  const colors = {0:'#ffd60a', 1:'#c9c9d6', 2:'#e0975a'};
  const medals = {0:'🥇', 1:'🥈', 2:'🥉'};
  return `<div class="kahoot-podium">${order.map(i=>{
    const p = top3[i];
    return `<div class="kahoot-pod-col">
      <div class="kahoot-pod-name">${medals[i]} ${escapeHtmlIdx(p.name)}</div>
      <div class="kahoot-pod-score">${p.score}</div>
      <div class="kahoot-pod-bar" style="height:${heights[i]};background:${colors[i]};color:#3a2a00;">${i+1}</div>
    </div>`;
  }).join('')}</div>`;
}

function kahootDoJoin(onBack){
  const pin = (document.getElementById('kahootPinInput').value || '').trim();
  const nm = (document.getElementById('kahootNameInput').value || '').trim();
  const errEl = document.getElementById('kahootJoinError');
  if(!/^\d{6}$/.test(pin)){ errEl.textContent = 'PIN harus 6 digit angka.'; return; }
  if(!nm){ errEl.textContent = 'Nama gak boleh kosong.'; return; }
  errEl.textContent = 'Menghubungkan...';
  const sessionRef = db.ref('kahootSessions/' + pin);
  sessionRef.once('value').then((snap)=>{
    const room = snap.val();
    if(!room){ errEl.textContent = 'Room tidak ditemukan. Cek lagi PIN-nya.'; return; }
    if(room.status !== 'lobby'){ errEl.textContent = 'Kuis sudah dimulai / berakhir, gak bisa gabung sekarang.'; return; }
    if(!getSavedName()){ localStorage.setItem('quizUserName', nm); }
    if(!myPresenceRef){ startPresence(nm); }
    kahootIsHost = false;
    kahootPin = pin;
    kahootSessionRef = sessionRef;
    kahootMyKey = sanitizeNameForKey(nm);
    kahootMyName = nm;
    sessionRef.child('players/' + kahootMyKey).set({ name: nm, score: 0, joinedAt: firebase.database.ServerValue.TIMESTAMP }).then(()=>{
      sessionRef.child('players/' + kahootMyKey).onDisconnect().remove();
      renderKahootPlayerRoom();
    }).catch((err)=>{ errEl.textContent = 'Gagal gabung: ' + err.message; });
  }).catch((err)=>{ errEl.textContent = 'Gagal gabung: ' + err.message; });
}

function renderKahootPlayerRoom(){
  statusVal.textContent = "KUIS LIVE";
  setPresenceStatus('in_progress');
  setPresenceMode('Kuis Live');
  kahootRenderedKey = null;
  kahootAnswered = false;
  kahootSessionRef.on('value', (snap)=>{
    const room = snap.val();
    if(!room){
      kahootSessionRef.off();
      clearInterval(kahootQuestionTimer);
      card.innerHTML = `<div class="center-stack"><p class="intro-desc">Room sudah ditutup host.</p><button class="btn ghost" id="kahootEndedBackBtn">← Kembali ke Menu</button></div>`;
      const onBack = kahootOnBackRef;
      document.getElementById('kahootEndedBackBtn').onclick = ()=>{ kahootCleanupClientState(); if(onBack) onBack(); };
      return;
    }
    kahootRenderPlayerByStatus(room);
  });
}

function kahootRenderPlayerByStatus(room){
  const idx = room.currentIndex || 0;
  if(room.status === 'question'){
    const key = 'question_' + idx;
    if(kahootRenderedKey !== key){
      kahootRenderedKey = key;
      kahootAnswered = false;
      kahootRenderPlayerQuestion(room, idx);
    }
    return;
  }
  const key = room.status + '_' + idx;
  if(kahootRenderedKey === key) return;
  kahootRenderedKey = key;
  if(room.status === 'lobby'){
    kahootRenderPlayerLobby(room);
  } else if(room.status === 'reveal'){
    kahootRenderPlayerReveal(room, idx);
  } else if(room.status === 'leaderboard'){
    kahootRenderPlayerLeaderboard(room);
  } else if(room.status === 'ended'){
    kahootRenderPlayerEnded(room);
  }
}

  clearInterval(kahootQuestionTimer);

    const elapsed = (Date.now() - startedAt) / 1000;
    const remain = Math.max(0, duration - elapsed);
    const fill = document.getElementById('kahootTimerFill');
    if(fill) fill.style.width = Math.max(0, (remain/duration*100)) + '%';
    const secLeft = Math.ceil(remain);
    if(secLeft !== lastSec){
      lastSec = secLeft;
      const numEl = document.getElementById('kahootTimerNum');
      if(numEl) numEl.textContent = secLeft;
      if(secLeft <= 5 && secLeft > 0) kahootPlayTick();

   Messaging + backend), notifikasi ini bekerja selama app/tab masih berjalan di
   browser (termasuk saat di-background-kan), TAPI tidak bisa membangunkan device
   kalau app-nya benar-benar ditutup total. Ini paling dekat dengan "push" yang bisa
   dicapai tanpa nambah backend. */
function isNotifSupported(){
  return ('Notification' in window) && ('serviceWorker' in navigator);
}
function isNotifEnabled(){
  return isNotifSupported() && Notification.permission === 'granted' && localStorage.getItem('notifEnabled') === '1';
}
function sendLocalNotification(title, body, tag){
  if(!isNotifEnabled()) return;
  if(document.visibilityState === 'visible' && document.hasFocus()) return; // gak usah ganggu kalau lagi aktif dipakai
  navigator.serviceWorker.getRegistration().then((reg)=>{
    if(reg){
      reg.showNotification(title, { body: body, icon: './icon-192.png', badge: './icon-192.png', tag: tag || 'quiz-notif' });
    } else {
      try{ new Notification(title, { body: body, icon: './icon-192.png' }); }catch(e){}
    }
  }).catch(()=>{});
}
function requestNotifPermission(){
  if(!isNotifSupported()){ alert('Browser ini belum mendukung notifikasi.'); return; }
  Notification.requestPermission().then((perm)=>{
    if(perm === 'granted'){
      localStorage.setItem('notifEnabled', '1');
      sendLocalNotification('🔔 Notifikasi Aktif', 'Kamu akan dapat notifikasi kalau ada chat baru atau soal dibuka.');
    } else {
      localStorage.setItem('notifEnabled', '0');
      alert('Izin notifikasi ditolak/belum diberikan. Kamu bisa mengaktifkannya lagi lewat pengaturan browser.');
    }
  });
}
(function initPushWatchers(){
  // Notifikasi chat baru: amati badge titik merah yang sudah ada di tab bar (tanpa
  // menyentuh logic unread yang sudah ada sama sekali).
  const chatDot = document.getElementById('igChatDot');
  if(chatDot && window.MutationObserver){
    let wasVisible = getComputedStyle(chatDot).display !== 'none';
    const obs = new MutationObserver(()=>{
      const isVisible = getComputedStyle(chatDot).display !== 'none';
      if(isVisible && !wasVisible){
        sendLocalNotification('💬 Pesan baru', 'Ada chat baru masuk di aplikasi Daily English.', 'chat-new');
      }
      wasVisible = isVisible;
    });
    obs.observe(chatDot, { attributes:true, attributeFilter:['style','class'] });
  }
  // Notifikasi kalau admin baru saja membuka akses (gate) yang sebelumnya tertutup.
  let prevGateOpenForNotif = null;
  db.ref('settings/gateOpen').on('value', (snapshot)=>{
    const val = snapshot.val();
    const nowOpen = (val === false) ? false : true;
    if(prevGateOpenForNotif === false && nowOpen === true){
      sendLocalNotification('✅ Akses Dibuka', 'Admin baru saja membuka akses kuis. Yuk langsung latihan!', 'gate-open');
    }
    prevGateOpenForNotif = nowOpen;
  });
  // Notifikasi pengumuman/leaderboard baru dari admin.
  let prevLbAnnounceForNotif = null;
  db.ref('settings/leaderboardMessage').on('value', (snapshot)=>{
    const val = snapshot.val() || '';
    if(prevLbAnnounceForNotif !== null && val && val !== prevLbAnnounceForNotif){
      sendLocalNotification('📢 Pengumuman Admin', val, 'lb-announce');
    }
    prevLbAnnounceForNotif = val;
  });
})();

function deleteOwnAccount(){
  const name = getSavedName();
  if(!name) return;
  const key = sanitizeNameForKey(name);
  if(!confirm(`Yakin mau HAPUS akun "${name}" kamu sepenuhnya? Ini akan menghapus profil, chat pribadi, dan riwayat skor kamu. Tindakan ini TIDAK BISA dibatalkan.`)) return;
  if(!confirm('Sekali lagi buat mastiin — hapus permanen akun kamu?')) return;

  const btn = document.getElementById('deleteAccountBadge');
  if(btn){ btn.disabled = true; btn.textContent = 'Menghapus...'; }

  Promise.all([
    db.ref('presence').once('value'),
    db.ref('examScores').once('value'),
    db.ref('scoreHistory').once('value'),
    db.ref('deviceAccounts/' + getDeviceId()).once('value')
  ]).then(([presSnap, scoreSnap, scoreHistSnap, devSnap])=>{
    const jobs = [];
    jobs.push('profiles/' + key);
    jobs.push('privateChat/' + key);
    jobs.push('peerChatMeta/' + key);
    jobs.push('accountSecrets/' + key);

    const pres = presSnap.val() || {};
    Object.entries(pres).forEach(([id, e])=>{
      if(e && e.name === name) jobs.push('presence/' + id);
    });

    const scores = scoreSnap.val() || {};
    Object.entries(scores).forEach(([id, e])=>{
      if(e && e.name === name) jobs.push('examScores/' + id);
    });

    const scoreHist = scoreHistSnap.val() || {};
    Object.entries(scoreHist).forEach(([id, e])=>{
      if(e && e.name === name) jobs.push('scoreHistory/' + id);
    });

    const bound = devSnap.val();
    if(bound && bound.name === name){
      jobs.push('deviceAccounts/' + getDeviceId());
    }

    // PENTING: hapus tiap path SATU-SATU (bukan digabung jadi 1 db.ref().update()).
    // Kalau digabung, Firebase Rules bakal nolak SEMUA path dalam 1 update itu cuma
    // gara-gara 1 path aja yang ketolak (misal presence/riwayat skor lama yang
    // ke-generate dari sesi anonim device/browser lain) -> makanya walau errornya
    // cuma "PERMISSION_DENIED", gak ada satupun yang kehapus, termasuk profil.
    // Ini penyebab "gak bisa hapus akun sendiri di hp lain". Sekarang tiap path
    // dihapus terpisah (paralel) jadi bagian yang emang boleh dihapus (profil, chat,
    // ikatan device saat ini) tetep kehapus walau ada 1-2 data lama yang gak ikut.
    return Promise.allSettled(
      jobs.map(path => db.ref(path).remove()
        .then(()=> ({ path, ok: true }))
        .catch((err)=> ({ path, ok: false, err })))
    );
  }).then((results)=>{
    const outcomes = results.map(r => r.value || { path: '?', ok: false, err: r.reason });
    const failed = outcomes.filter(o => !o.ok);
    const profileFail = failed.find(f => f.path === 'profiles/' + key);

    if(profileFail){
      // Bagian paling penting (profil) gagal kehapus -> anggap gagal total,
      // biar data lokal gak ikut kehapus dan user bisa coba lagi.
      throw new Error((profileFail.err && profileFail.err.message) ? profileFail.err.message : 'PERMISSION_DENIED');
    }

    stopPresence();
    removeKnownAccount(name);
    localStorage.removeItem('quizUserName');

    if(failed.length === 0){
      alert('Akun kamu berhasil dihapus. Sampai jumpa!');
    } else {
      alert('Akun kamu berhasil dihapus. Sampai jumpa! (Catatan: ' + failed.length + ' data lama gak ikut kehapus otomatis, tapi ini gak masalah karena akunmu udah gak aktif lagi.)');
    }
    renderNameGate();
  }).catch((err)=>{
    alert('Gagal menghapus akun: ' + err.message);
    if(btn){ btn.disabled = false; btn.textContent = '🗑 Hapus Akun Saya'; }
  });
}

function renderDictionarySearch(onBack){
  clearTimer();
  statusVal.textContent = "KAMUS";
  setPresenceStatus('idle');
  card.innerHTML = `
    <div class="center-stack" style="align-items:stretch;">
      <div class="section-tag">🔍 KAMUS KOSAKATA</div>
      <h1 class="intro-title">Cari Kata</h1>
      <p class="intro-desc" style="font-size:12px;">Ketik kata dalam Bahasa Indonesia atau Inggris — hasil dicari dari seluruh ${ALL.length} kosakata Bulan 1 &amp; 2.</p>
      <input type="text" id="dictSearchInput" class="name-gate-input" style="text-align:left;" placeholder="Contoh: makan / eat / crime..." autocomplete="off">
      <div id="dictResultCount" style="font-size:11px;opacity:0.7;margin-top:6px;width:100%;text-align:left;"></div>
      <div id="dictResultList" style="width:100%;display:flex;flex-direction:column;gap:6px;margin-top:8px;max-height:56vh;overflow-y:auto;"></div>
      <button class="btn ghost" id="dictBackBtn" style="margin-top:12px;">← Kembali</button>
    </div>
  `;
  document.getElementById('dictBackBtn').onclick = onBack;
  const input = document.getElementById('dictSearchInput');
  const countEl = document.getElementById('dictResultCount');
  const listEl = document.getElementById('dictResultList');
  const DICT_LIMIT = 60;
  function renderResults(){
    const q = input.value.trim().toLowerCase();
    if(!q){
      countEl.textContent = 'Mulai ketik untuk mencari...';
      listEl.innerHTML = '';
      return;
    }
    const matches = ALL.filter(it =>
      it.id.toLowerCase().includes(q) ||
      it.en.toLowerCase().includes(q) ||
      (it.tag && it.tag.toLowerCase().includes(q))
    );
    countEl.textContent = matches.length === 0
      ? 'Tidak ada kata yang cocok.'
      : `${matches.length} hasil ditemukan${matches.length > DICT_LIMIT ? ' (menampilkan ' + DICT_LIMIT + ' teratas)' : ''}.`;
    listEl.innerHTML = matches.slice(0, DICT_LIMIT).map(it=>`
      <div style="padding:9px 12px;border-radius:12px;border:1.5px solid var(--line);background:#fff;text-align:left;">
        <div style="font-weight:800;font-size:13px;">${escapeHtmlIdx(it.id)} <span style="opacity:0.5;font-weight:600;">→</span> ${escapeHtmlIdx(it.en)}</div>
        ${it.ph ? `<div style="font-size:11px;opacity:0.6;">${escapeHtmlIdx(it.ph)}</div>` : ''}
        <div style="font-size:10px;opacity:0.55;margin-top:2px;">${escapeHtmlIdx(it.tag)} · Bulan ${it.month} · Day ${it.day}</div>
      </div>
    `).join('');
  }
  input.addEventListener('input', renderResults);
  renderResults();
  input.focus();
}
