<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Selamat Datang di Quiz Harian</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
  :root{
    --ink:#241B12;
    --panel:#FFF9EC;
    --panel-2:#FFF3D6;
    --red:#E23F35;
    --red-dim:#B23A2E;
    --gold:#F2B705;
    --gold-dim:#B58A05;
    --green:#3F9142;
    --blue:#2B6CB0;
    --line: rgba(36,27,18,0.14);
    --accent: var(--red);
    --accent-dim: var(--red-dim);
    --text: var(--ink);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 85% -10%, rgba(242,183,5,0.18), transparent 45%),
      #FDE9A8;
    color:var(--ink);
    font-family:'Nunito',sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px 14px;
  }
  .mono{font-family:'Nunito',sans-serif;}

  .board{width:100%;max-width:560px;}

  .header{
    background:var(--ink);
    border-bottom:none;
    border-radius:16px 16px 0 0;
    padding:16px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .header .brand{display:flex;flex-direction:column;gap:2px;}
  .brand .eyebrow{
    font-size:11px;letter-spacing:0.18em;color:var(--gold);text-transform:uppercase;font-weight:700;
  }
  .brand .title{font-family:'Nunito',sans-serif;font-weight:800;font-size:20px;letter-spacing:0.01em;color:#FFF9EC;}
  .gate{text-align:right;}
  .gate .label{font-size:10px;letter-spacing:0.14em;color:var(--gold);font-weight:700;}
  .gate .val{font-size:13px;font-weight:800;color:#FFF9EC;}

  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:0;
    padding:24px 22px 22px;
    position:relative;
    overflow:hidden;
  }

  .progress-row{
    display:flex;justify-content:space-between;align-items:center;
    font-size:12px;color:var(--red-dim);font-weight:800;
    margin-bottom:14px;letter-spacing:0.03em;
  }
  .dots{display:flex;gap:4px;flex-wrap:wrap;max-width:230px;justify-content:flex-end;}
  .dot{width:6px;height:6px;border-radius:50%;background:rgba(36,27,18,0.15);}
  .dot.done{background:var(--green);}
  .dot.current{background:var(--red);box-shadow:0 0 0 3px rgba(226,63,53,0.2);}

  .timer-wrap{display:flex;align-items:center;gap:12px;margin-bottom:18px;}
  .flap{
    font-weight:800;font-size:26px;
    background:var(--ink);color:var(--gold);border-radius:8px;padding:6px 12px;
    min-width:52px;text-align:center;border:2px solid var(--ink);
    transition:color 0.2s;
  }
  .flap.low{color:#FF8A7A;}
  .timer-bar-bg{flex:1;height:6px;background:rgba(36,27,18,0.1);border-radius:4px;overflow:hidden;}
  .timer-bar{height:100%;background:var(--red);width:100%;transition:width 1s linear, background 0.3s;}
  .timer-bar.low{background:#FF8A7A;}

  .section-tag{
    display:inline-block;font-size:10px;font-weight:800;
    letter-spacing:0.1em;text-transform:uppercase;color:#FFF9EC;
    background:var(--red);padding:4px 10px;border-radius:100px;margin-bottom:12px;
  }
  .month-badge{
    display:inline-block;font-size:9px;font-weight:800;letter-spacing:0.08em;
    text-transform:uppercase;color:var(--ink);background:var(--gold);
    padding:3px 8px;border-radius:100px;margin-bottom:12px;margin-left:6px;
  }

  .question{font-size:13px;color:var(--red-dim);margin-bottom:6px;letter-spacing:0.02em;font-weight:700;}
  .question-word{font-family:'Nunito',sans-serif;font-size:23px;font-weight:700;margin-bottom:20px;line-height:1.35;}

  .options{display:flex;flex-direction:column;gap:10px;}
  .opt{
    text-align:left;background:#FFFFFF;border:1px solid var(--line);
    color:var(--ink);padding:13px 16px;border-radius:10px;font-size:14.5px;cursor:pointer;
    font-family:'Nunito',sans-serif;font-weight:600;display:flex;align-items:center;gap:12px;
    transition: border-color 0.15s, background 0.15s, transform 0.1s;
  }
  .opt .letter{
    font-size:12px;font-weight:800;color:var(--red-dim);
    border:1px solid var(--line);border-radius:6px;width:22px;height:22px;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .opt:hover:not(:disabled){border-color:var(--gold);background:#FFFCF2;}
  .opt:active:not(:disabled){transform:scale(0.99);}
  .opt:disabled{cursor:default;}
  .opt.correct{border-color:var(--green);background:rgba(63,145,66,0.12);}
  .opt.correct .letter{background:var(--green);color:#fff;border-color:var(--green);}
  .opt.wrong{border-color:var(--red);background:rgba(226,63,53,0.12);}
  .opt.wrong .letter{background:var(--red);color:#fff;border-color:var(--red);}

  .center-stack{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;}
  h1.intro-title{font-family:'Nunito',sans-serif;font-size:23px;font-weight:800;margin:0;}
  .intro-desc{color:var(--red-dim);font-size:13px;line-height:1.7;max-width:420px;font-weight:600;}
  .stat-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:8px 0 4px;}
  .stat{background:#FFFFFF;border:1px solid var(--line);border-radius:10px;padding:10px 16px;min-width:90px;}
  .stat .num{font-family:'Nunito',sans-serif;font-size:22px;font-weight:800;color:var(--red);}
  .stat .lab{font-size:10px;letter-spacing:0.1em;color:var(--red-dim);text-transform:uppercase;margin-top:2px;font-weight:700;}

  .btn{
    font-weight:800;letter-spacing:0.04em;
    text-transform:uppercase;font-size:13px;background:var(--red);color:#FFF9EC;
    border:none;padding:13px 26px;border-radius:10px;cursor:pointer;margin-top:6px;
    transition: transform 0.1s, opacity 0.15s;
  }
  .btn:hover{opacity:0.92;}
  .btn:active{transform:scale(0.98);}
  .btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);}

  .mode-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:4px;}
  .mode-btn{
    font-size:12px;font-weight:800;letter-spacing:0.02em;
    background:#FFFFFF;color:var(--red-dim);border:1px solid var(--line);
    padding:9px 14px;border-radius:100px;cursor:pointer;
    transition:border-color 0.15s, background 0.15s, color 0.15s;
  }
  .mode-btn.active{background:var(--red);color:#FFF9EC;border-color:var(--red);}
  .mode-btn:hover:not(.active){border-color:var(--red-dim);}
  .mode-btn.month-btn.active{background:var(--blue);border-color:var(--blue);}

  /* per-day picker */
  .day-grid{
    display:grid;grid-template-columns:repeat(2,1fr);gap:8px;
    margin-top:12px;width:100%;
    max-height:280px;overflow-y:auto;padding-right:2px;
  }
  .day-btn{
    background:#FFFFFF;border:1px solid var(--line);border-radius:10px;
    padding:10px 12px;text-align:left;cursor:pointer;
    font-family:'Nunito',sans-serif;
    transition:border-color .15s, background .15s;
  }
  .day-btn:hover{border-color:var(--gold);}
  .day-btn .dnum{font-weight:800;font-size:10.5px;color:var(--red-dim);letter-spacing:0.08em;text-transform:uppercase;}
  .day-btn .dtitle{font-weight:700;font-size:13px;margin-top:2px;color:var(--ink);}
  .day-btn .dcount{font-size:11px;color:rgba(36,27,18,0.55);margin-top:2px;font-weight:600;}
  .day-btn.active{border-color:var(--red);background:rgba(226,63,53,0.08);}
  .day-btn.active .dnum{color:var(--red);}

  .match-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:2px;}
  .match-col{display:flex;flex-direction:column;gap:8px;}
  .match-item{
    background:#FFFFFF;
    border:1px solid var(--line);
    color:var(--text);
    padding:11px 10px;
    border-radius:9px;
    font-size:12.5px;
    font-weight:600;
    font-family:'Nunito',sans-serif;
    cursor:pointer;
    text-align:left;
    line-height:1.35;
    transition:border-color .15s, background .15s, opacity .15s;
  }
  .match-item:hover:not(:disabled){border-color:var(--accent-dim);}
  .match-item.selected{border-color:var(--accent);background:color-mix(in srgb, var(--accent) 14%, transparent);}
  .match-item.correct{border-color:var(--green);background:color-mix(in srgb, var(--green) 18%, transparent);}
  .match-item.wrong{border-color:var(--red);background:color-mix(in srgb, var(--red) 18%, transparent);}
  .match-item:disabled{cursor:default;opacity:0.55;}

  .essay-wrap{display:flex;flex-direction:column;gap:10px;margin-top:2px;}
  .essay-input{
    width:100%;
    background:#FFFFFF;
    border:1px solid var(--line);
    color:var(--text);
    padding:13px 16px;
    border-radius:10px;
    font-size:16px;
    font-family:'Nunito',sans-serif;
    outline:none;
  }
  .essay-input:focus{border-color:var(--accent-dim);}
  .essay-input.correct{border-color:var(--green);background:color-mix(in srgb, var(--green) 14%, transparent);}
  .essay-input.wrong{border-color:var(--red);background:color-mix(in srgb, var(--red) 14%, transparent);}
  .essay-feedback{
    font-size:13px;font-weight:700;padding:10px 14px;border-radius:10px;margin-top:8px;
  }
  .essay-feedback.correct{color:var(--green);background:color-mix(in srgb, var(--green) 14%, transparent);border:1px solid var(--green);}
  .essay-feedback.wrong{color:var(--red);background:color-mix(in srgb, var(--red) 14%, transparent);border:1px solid var(--red);}

  .missed-list{
    text-align:left;width:100%;margin-top:6px;display:flex;flex-direction:column;gap:8px;
    max-height:220px;overflow-y:auto;padding-right:4px;
  }
  .missed-item{
    background:rgba(226,63,53,0.07);border:1px solid rgba(226,63,53,0.28);border-radius:8px;
    padding:9px 12px;font-size:12px;font-weight:600;
    display:flex;justify-content:space-between;gap:10px;
  }
  .missed-item .id{color:var(--red-dim);}
  .missed-item .ans{color:var(--green);font-weight:800;}

  .reset-row{display:flex;justify-content:flex-end;margin-bottom:8px;}
  .reset-btn{
    font-size:11px;font-weight:800;letter-spacing:0.02em;
    background:transparent;color:var(--accent-dim);
    border:1px solid var(--line);
    padding:5px 11px;border-radius:100px;cursor:pointer;
    transition:border-color .15s, color .15s, background .15s;
  }
  .reset-btn:hover{border-color:var(--accent-dim);color:var(--accent);background:rgba(226,63,53,0.06);}

  .credit-footer{
    display:flex;align-items:center;gap:10px;
    padding:12px 16px;margin-top:2px;
    background:var(--ink);border-radius:0 0 16px 16px;
    border-top:1px solid rgba(255,249,236,0.08);
  }
  .credit-avatar{
    width:38px;height:38px;border-radius:50%;object-fit:cover;
    border:2px solid var(--gold);flex-shrink:0;
  }
  .credit-text{text-align:left;line-height:1.4;}
  .credit-name{font-size:11px;font-weight:800;color:#FFF9EC;}
  .credit-sub{font-size:10.5px;font-weight:600;color:rgba(255,249,236,0.65);}
  .credit-sub a{color:var(--gold);text-decoration:none;font-weight:800;}
  .credit-sub a:hover{text-decoration:underline;}
  .credit-sub .dot{margin:0 5px;opacity:0.6;}

  .credit-box{
    margin-top:18px;padding-top:16px;border-top:1px dashed var(--line);
    display:flex;align-items:center;gap:12px;text-align:left;width:100%;
  }
  .credit-avatar{
    width:46px;height:46px;border-radius:50%;object-fit:cover;flex-shrink:0;
    border:2px solid var(--gold);
  }
  .credit-text{display:flex;flex-direction:column;gap:2px;}
  .credit-name{font-size:12.5px;font-weight:800;color:var(--ink);}
  .credit-ig{font-size:11.5px;font-weight:700;color:var(--red-dim);text-decoration:none;}
  .credit-ig:hover{text-decoration:underline;}
  .credit-source{font-size:10.5px;color:rgba(36,27,18,0.6);font-weight:600;}

  @media (prefers-reduced-motion: reduce){ *{transition:none !important;} }

  /* ---- name gate & presence panel ---- */
  .name-gate-input{
    width:100%;background:#FFFFFF;border:1px solid var(--line);color:var(--text);
    padding:13px 16px;border-radius:10px;font-size:16px;font-family:'Nunito',sans-serif;
    font-weight:600;text-align:center;
  }
  .name-gate-input:focus{outline:none;border-color:var(--gold);}
  .presence-bar{
    background:var(--ink);color:#FFF9EC;padding:9px 20px;font-size:12px;font-weight:700;
    display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;
    border-top:1px solid rgba(255,249,236,0.08);
  }
  .presence-dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex-shrink:0;
    box-shadow:0 0 0 3px rgba(63,145,66,0.25);}
  .presence-text{flex:1;}
  .presence-chevron{font-size:10px;opacity:0.6;transition:transform .15s;}
  .presence-chevron.open{transform:rotate(180deg);}
  .presence-list{
    background:#1a130c;padding:0 20px;max-height:0;overflow:hidden;
    transition:max-height .2s ease, padding .2s ease;
  }
  .presence-list.open{max-height:220px;overflow-y:auto;padding:10px 20px;}
  .presence-item{
    font-size:12.5px;color:#FFF9EC;padding:6px 0;border-bottom:1px solid rgba(255,249,236,0.08);
    display:flex;align-items:center;gap:8px;font-weight:600;
  }
  .presence-item:last-child{border-bottom:none;}
  .presence-empty{font-size:12px;color:rgba(255,249,236,0.5);padding:8px 0;font-weight:600;}
  .lb-item-light{
    font-size:13px;color:var(--ink);padding:8px 10px;border-bottom:1px solid var(--line);
    display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:700;
    background:#fff;border-radius:8px;margin-bottom:6px;border:1px solid var(--line);
  }
  .lb-empty-light{font-size:12px;color:rgba(36,27,18,0.55);padding:8px 0;font-weight:600;}
  .name-badge{
    display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;font-weight:800;
    color:var(--red-dim);background:rgba(226,63,53,0.08);border:2px solid var(--red-dim);
    padding:13px 18px;border-radius:10px;margin-top:6px;cursor:pointer;width:100%;
    transition:opacity .15s, transform .1s;
  }
  .name-badge:active{transform:scale(0.98);}
</style>
</head>

/* ---------------- helpers ---------------- */
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function buildOptions(correctItem, pool){
  const distractorPool = pool.filter(p => p.en !== correctItem.en);
  const wrongs = shuffle(distractorPool).slice(0,3).map(p=>p.en);
  const options = shuffle([correctItem.en, ...wrongs]);
  return options;
}

  };

/* ---------------- PRESENCE (siapa sedang mengerjakan) ---------------- */
let myPresenceRef = null;
let myPresenceKey = null;
let heartbeatTimer = null;
const PRESENCE_TTL_MS = 45000; // dianggap aktif jika update < 45 detik lalu

function sanitizeNameForKey(name){
  return name.replace(/[.#$\[\]\/]/g, '_').trim();
}

function getDeviceLabel(){
  const ua = navigator.userAgent;
  let device = 'Perangkat Lain';
  if(/iPhone/i.test(ua)) device = 'iPhone';
  else if(/iPad/i.test(ua)) device = 'iPad';
  else if(/Android/i.test(ua)) device = 'Android';
  else if(/Windows/i.test(ua)) device = 'Windows PC';
  else if(/Macintosh/i.test(ua)) device = 'Mac';
  else if(/Linux/i.test(ua)) device = 'Linux PC';

  let browser = '';
  if(/Edg\//i.test(ua)) browser = 'Edge';
  else if(/Chrome\//i.test(ua)) browser = 'Chrome';
  else if(/CriOS\//i.test(ua)) browser = 'Chrome';
  else if(/Firefox\//i.test(ua)) browser = 'Firefox';
  else if(/Safari\//i.test(ua)) browser = 'Safari';

  return browser ? `${device} · ${browser}` : device;
}

function logLoginEvent(name){
  const device = getDeviceLabel();
  fetch('https://ipapi.co/json/')
    .then(res => res.json())
    .then(data => {
      const location = [data.city, data.region, data.country_name].filter(Boolean).join(', ') || 'Tidak diketahui';
      db.ref('loginHistory').push({ name: name, timestamp: firebase.database.ServerValue.TIMESTAMP, device: device, location: location });
    })
    .catch(()=>{
      db.ref('loginHistory').push({ name: name, timestamp: firebase.database.ServerValue.TIMESTAMP, device: device, location: 'Tidak diketahui' });
    });
}

function startPresence(name){
  const rand = Math.random().toString(36).slice(2, 8);
  myPresenceKey = sanitizeNameForKey(name) + '_' + rand;
  myPresenceRef = db.ref('presence/' + myPresenceKey);
  myPresenceRef.set({ name: name, updatedAt: firebase.database.ServerValue.TIMESTAMP, status: 'idle' });
  myPresenceRef.onDisconnect().remove();

  logLoginEvent(name);

  clearInterval(heartbeatTimer);
  heartbeatTimer = setInterval(()=>{
    myPresenceRef.update({ updatedAt: firebase.database.ServerValue.TIMESTAMP });
  }, 20000);

  window.addEventListener('beforeunload', ()=>{
    if(myPresenceRef) myPresenceRef.remove();
  });
}

function stopPresence(){
  clearInterval(heartbeatTimer);
  if(myPresenceRef) myPresenceRef.remove();
  myPresenceRef = null;
}

function setPresenceStatus(status){
  if(myPresenceRef){ myPresenceRef.update({ status: status }); }
}

const presenceText = document.getElementById('presenceText');
const presenceChevron = document.getElementById('presenceChevron');
const presenceList = document.getElementById('presenceList');

presenceBar.addEventListener('click', ()=>{

const STATUS_DOT = { idle: '🔴', in_progress: '🔵', done: '🟢' };

function renderPresencePanel(users){
  if(users.length === 0){
    presenceText.textContent = 'Belum ada yang online';
    presenceList.innerHTML = '<div class="presence-empty">Belum ada peserta aktif.</div>';
    return;
  }
  const workingCount = users.filter(u => u.status === 'in_progress').length;
  presenceText.textContent = `${users.length} online · ${workingCount} sedang mengerjakan`;
  presenceList.innerHTML = users.map(u => `<div class="presence-item">${STATUS_DOT[u.status] || '🔴'} ${u.name}</div>`).join('');
}

db.ref('presence').on('value', (snapshot)=>{
  const data = snapshot.val() || {};
  const now = Date.now();
  const activeUsers = Object.values(data)
    .filter(u => u && u.updatedAt && (now - u.updatedAt) < PRESENCE_TTL_MS)
    .map(u => ({ name: u.name, status: u.status || 'idle' }));
  renderPresencePanel(activeUsers);

function renderQuestion(){
  clearTimer();
  answered = false;
  if(idx >= queue.length){ finishRound(startRetryRound); return; }
  const item = queue[idx];
  const options = buildOptions(item, activePool);
  timeLeft = 10;

  const dotsHtml = queue.map((_,i)=>{
    let cls = 'dot';
    if(i < idx) cls += ' done';
    else if(i === idx) cls += ' current';
    return `<span class="${cls}"></span>`;
  }).join('');

  card.innerHTML = `
    <div class="reset-row"><button class="reset-btn" id="resetBtn">↺ Reset</button></div>
    <div class="progress-row">
      <span>${roundNumber===0 ? 'SOAL' : 'ULANGI'} ${idx+1} / ${queue.length}</span>
      <div class="dots">${dotsHtml}</div>
    </div>
    ${timedMode ? `
    <div class="timer-wrap">
      <div class="flap mono" id="flapTime">${timeLeft}</div>
      <div class="timer-bar-bg"><div class="timer-bar" id="timerBar"></div></div>
    </div>` : ''}
    <div class="section-tag">${item.tag}</div>${monthBadgeHtml(item)}
    <div class="question">Terjemahkan ke Bahasa Inggris:</div>
    <div class="question-word">"${item.id}"</div>
    <div class="options" id="optionsWrap">
      ${options.map((opt,i)=>`
        <button class="opt" data-val="${opt.replace(/"/g,'&quot;')}">
          <span class="letter">${String.fromCharCode(65+i)}</span>
          <span>${opt}</span>
        </button>
      `).join('')}
    </div>
  `;

  document.getElementById('resetBtn').onclick = ()=>{ clearTimer(); renderIntro(); };

  document.querySelectorAll('#optionsWrap .opt').forEach(btn=>{
    btn.addEventListener('click', ()=> handleAnswer(btn.dataset.val, item));
  });

  if(timedMode){ startTimer(()=> handleAnswer(null, item)); }
}

function startTimer(onTimeout){
  const flap = document.getElementById('flapTime');
  const bar = document.getElementById('timerBar');
  timerInterval = setInterval(()=>{
    timeLeft -= 1;
    if(flap) flap.textContent = timeLeft;
    if(bar) bar.style.width = (timeLeft/10*100)+'%';
    if(timeLeft <= 3){
      if(flap) flap.classList.add('low');
      if(bar) bar.classList.add('low');
    }
    if(timeLeft <= 0){
      clearTimer();
      onTimeout();
    }
  },1000);
}

function handleAnswer(selected, item){
  if(answered) return;
  answered = true;
  clearTimer();

  const isCorrect = selected === item.en;
  document.querySelectorAll('#optionsWrap .opt').forEach(btn=>{
    btn.disabled = true;
    if(btn.dataset.val === item.en){
      btn.classList.add('correct');
    } else if(btn.dataset.val === selected && !isCorrect){
      btn.classList.add('wrong');
    }
  });

  if(!isCorrect){ roundMissed.push(item); }

  setTimeout(()=>{
    idx += 1;
    renderQuestion();
  }, 900);
}

function finishRound(retryFn){
  clearTimer();
  if(roundNumber === 0){ totalMissedFirstPass = roundMissed.length; }

  if(roundMissed.length === 0){ renderAllCorrect(); return; }

  const missedCount = roundMissed.length;
  statusVal.textContent = "REVISIT";
  card.innerHTML = `
    <div class="center-stack">
      <div class="section-tag" style="background:var(--red);color:#FFF9EC;">${missedCount} SALAH</div>

      <button class="btn" id="retryBtn">Ulangi Soal yang Salah →</button>
    </div>
  `;
  document.getElementById('retryBtn').onclick = ()=> retryFn(roundMissed);
}

  examIdx = 0;
  examScore = 0;
  examTotal = examQueue.length;
  examStartedAt = Date.now();
  statusVal.textContent = "UJIAN";
  setPresenceStatus('in_progress');
  renderExamQuestion();
}

function renderExamQuestion(){
  clearTimer();
  answered = false;
  if(examIdx >= examQueue.length){ finishExam(); return; }
  const { item, qType } = examQueue[examIdx];
  timeLeft = 10;

  const dotsHtml = examQueue.map((_,i)=>{
    let cls = 'dot';
    if(i < examIdx) cls += ' done';
    else if(i === examIdx) cls += ' current';
    return `<span class="${cls}"></span>`;
  }).join('');

  if(qType === 'mc'){
    const options = buildOptions(item, ALL);
    card.innerHTML = `
      <div class="progress-row">
        <span>UJIAN ${examIdx+1} / ${examQueue.length}</span>
        <div class="dots">${dotsHtml}</div>
      </div>
      <div class="timer-wrap">
        <div class="flap mono" id="flapTime">${timeLeft}</div>
        <div class="timer-bar-bg"><div class="timer-bar" id="timerBar"></div></div>
      </div>
      <div class="section-tag">${item.tag}</div>${monthBadgeHtml(item)}
      <div class="question">Terjemahkan ke Bahasa Inggris:</div>
      <div class="question-word">"${item.id}"</div>
      <div class="options" id="optionsWrap">
        ${options.map((opt,i)=>`
          <button class="opt" data-val="${opt.replace(/"/g,'&quot;')}">
            <span class="letter">${String.fromCharCode(65+i)}</span>
            <span>${opt}</span>
          </button>
        `).join('')}
      </div>
    `;
    document.querySelectorAll('#optionsWrap .opt').forEach(btn=>{
      btn.addEventListener('click', ()=> handleExamMcAnswer(btn.dataset.val, item));
    });
    startTimer(()=> handleExamMcAnswer(null, item));
  } else {
    card.innerHTML = `
      <div class="progress-row">
        <span>UJIAN ${examIdx+1} / ${examQueue.length}</span>
        <div class="dots">${dotsHtml}</div>
      </div>
      <div class="section-tag">${item.tag}</div>${monthBadgeHtml(item)}
      <div class="question">Ketik terjemahan Bahasa Inggris:</div>
      <div class="question-word">"${item.id}"</div>
      <div class="essay-wrap">
        <input type="text" id="essayInput" class="essay-input" placeholder="Ketik jawabanmu di sini..." autocomplete="off" autocapitalize="off" spellcheck="false" />
        <button class="btn" id="essaySubmitBtn" style="width:100%;">Kirim Jawaban →</button>
        <div id="essayFeedback"></div>
      </div>
    `;
    const input = document.getElementById('essayInput');
    input.focus();
    input.addEventListener('keydown', (e)=>{ if(e.key === 'Enter'){ e.preventDefault(); handleExamEssayAnswer(item); } });
    document.getElementById('essaySubmitBtn').addEventListener('click', ()=> handleExamEssayAnswer(item));
  }
}

function handleExamMcAnswer(selected, item){
  if(answered) return;
  answered = true;
  clearTimer();

  const isCorrect = selected === item.en;
  document.querySelectorAll('#optionsWrap .opt').forEach(btn=>{
    btn.disabled = true;
    if(btn.dataset.val === item.en){
      btn.classList.add('correct');
    } else if(btn.dataset.val === selected && !isCorrect){
      btn.classList.add('wrong');
    }
  });

  if(isCorrect){ examScore += 1; }

  setTimeout(()=>{
    examIdx += 1;
    renderExamQuestion();
  }, 900);
}

function handleExamEssayAnswer(item){
  if(answered) return;
  answered = true;

  const input = document.getElementById('essayInput');
  const rawVal = input ? input.value : '';
  const isCorrect = normalizeAnswer(rawVal).length > 0 && normalizeAnswer(rawVal) === normalizeAnswer(item.en);

  if(input){ input.disabled = true; input.classList.add(isCorrect ? 'correct' : 'wrong'); }
  const submitBtn = document.getElementById('essaySubmitBtn');
  if(submitBtn) submitBtn.disabled = true;

  const feedback = document.getElementById('essayFeedback');
  if(feedback){
    feedback.innerHTML = isCorrect
      ? `<div class="essay-feedback correct">✓ Benar! — ${item.en}</div>`
      : `<div class="essay-feedback wrong">✕ Kurang tepat. Jawaban: <b>${item.en}</b></div>`;
  }

  if(isCorrect){ examScore += 1; }

  setTimeout(()=>{
    examIdx += 1;
    renderExamQuestion();
  }, 1200);
}

function finishExam(){
  clearTimer();
  setPresenceStatus('done');
  statusVal.textContent = "UJIAN SELESAI";
  const name = getSavedName();
  const key = sanitizeNameForKey(name) + '_' + Math.random().toString(36).slice(2,8);
  const durationMs = examStartedAt ? (Date.now() - examStartedAt) : null;
  db.ref('examScores/' + key).set({
    name: name,
    score: examScore,
    total: examTotal,
    durationMs: durationMs,
    finishedAt: firebase.database.ServerValue.TIMESTAMP
  });
  setExamLockData({ signature: examConfigSignature(), score: examScore, total: examTotal });
  renderExamResult();
}

function escapeHtmlIdx(str){
  return String(str).replace(/[&<>"']/g, (c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function formatDuration(ms){
  if(ms === null || ms === undefined) return '-';
  const totalSec = Math.round(ms/1000);
  const m = Math.floor(totalSec/60);
  const s = totalSec%60;
  return m > 0 ? `${m}m ${s}d` : `${s}d`;
}

const RANK_MEDAL = { 0: '🥇', 1: '🥈', 2: '🥉' };
function sortLeaderboard(arr){
  return arr.slice().sort((a,b)=>{
    if(b.score !== a.score) return b.score - a.score; // skor benar dulu
    const da = (a.durationMs === null || a.durationMs === undefined) ? Infinity : a.durationMs;
    const db_ = (b.durationMs === null || b.durationMs === undefined) ? Infinity : b.durationMs;
    return da - db_; // lalu yang paling cepat
  });
}
function renderExamLeaderboardInto(elId){
  if(examLeaderboardRef){ examLeaderboardRef.off(); }
  examLeaderboardRef = db.ref('examScores');
  examLeaderboardRef.on('value', (snapshot)=>{
    const data = snapshot.val() || {};
    const arr = sortLeaderboard(Object.values(data).filter(u=>u && u.name));
    const lbEl = document.getElementById(elId);
    if(!lbEl) return;
    if(arr.length === 0){
      lbEl.innerHTML = '<div class="lb-empty-light">Belum ada skor.</div>';
      return;
    }
    lbEl.innerHTML = arr.map((u,i)=>{
      const displayName = (u.name === getSavedName()) ? 'Anda' : escapeHtmlIdx(u.name);
      return `<div class="lb-item-light"><span>${RANK_MEDAL[i] || (i+1)+'.'} ${displayName}</span><span>${u.score}/${u.total} · ⏱ ${formatDuration(u.durationMs)}</span></div>`;
    }).join('');
  });
}

function renderExamResult(){
  card.innerHTML = `
    <div class="center-stack">
      <div class="section-tag" style="background:var(--green);color:#fff;">UJIAN SELESAI</div>
      <h1 class="intro-title">Skormu: ${examScore} / ${examTotal}</h1>
      <p class="intro-desc" style="font-size:12px;">Halaman ini terkunci — kamu tidak bisa mengulang ujian sampai admin mengganti ke Mode Biasa.</p>
      <div class="presence-title" style="text-align:left;font-size:12px;font-weight:800;color:#8a7a5c;text-transform:uppercase;letter-spacing:0.5px;margin:14px 0 8px;">Papan Skor (Semua Peserta · benar dulu, lalu tercepat)</div>
      <div id="examLeaderboard" style="text-align:left;"><div class="lb-empty-light">Memuat papan skor...</div></div>
    </div>
  `;
  renderExamLeaderboardInto('examLeaderboard');
}

/* ---------------- MATCHING MODE ---------------- */
function buildMatchBatches(items){
  const shuffled = shuffle(items);
  const batches = [];
  for(let i=0;i<shuffled.length;i+=BATCH_SIZE){
    batches.push(shuffled.slice(i, i+BATCH_SIZE));
  }
  return batches;
}

function startMatchQuiz(pool){
  activePool = pool;
  matchBatches = buildMatchBatches(pool);
  matchBatchIndex = 0;
  matchRoundMissedIds = new Set();
  roundNumber = 0;
  statusVal.textContent = "OPEN BOOK";
  setPresenceStatus('in_progress');
  renderMatchBatch();
}

function startMatchRetry(missedItems){
  matchBatches = buildMatchBatches(missedItems);
  matchBatchIndex = 0;
  matchRoundMissedIds = new Set();
  roundNumber += 1;
  statusVal.textContent = "REVIEW " + roundNumber;
  renderMatchBatch();
}

function renderMatchBatch(){
  if(matchBatchIndex >= matchBatches.length){
    finishMatchRound();
    return;
  }
  const batch = matchBatches[matchBatchIndex];
  matchLeft = batch;
  matchRight = shuffle(batch);
  matchedIds = new Set();
  selectedLeftIdx = null;
  renderMatchUI();
}

function matchButtonHtml(item, side, i){
  const label = side==='left' ? item.id : item.en;
  return `<button class="match-item" data-side="${side}" data-idx="${i}">${label}</button>`;
}

function renderMatchUI(){
  card.innerHTML = `
    <div class="reset-row"><button class="reset-btn" id="resetBtn">↺ Reset</button></div>
    <div class="progress-row">
      <span>${roundNumber===0 ? 'BABAK' : 'ULANGI'} ${matchBatchIndex+1} / ${matchBatches.length}</span>
      <span class="mono">${matchedIds.size}/${matchLeft.length} cocok</span>
    </div>
    <div class="section-tag">PENJODOHAN</div>
    <div class="question">Cocokkan Bahasa Indonesia dengan Bahasa Inggris:</div>
    <div class="question-word" style="font-size:15px;font-weight:600;margin-bottom:14px;color:var(--accent-dim);font-family:'Nunito',sans-serif;">Pilih satu kata di kiri, lalu pasangannya di kanan.</div>
    <div class="match-grid">
      <div class="match-col">${matchLeft.map((it,i)=>matchButtonHtml(it,'left',i)).join('')}</div>
      <div class="match-col">${matchRight.map((it,i)=>matchButtonHtml(it,'right',i)).join('')}</div>
    </div>
  `;
  document.getElementById('resetBtn').onclick = ()=>{ clearTimer(); renderIntro(); };
  document.querySelectorAll('.match-item').forEach(btn=>{
    btn.addEventListener('click', ()=> handleMatchClick(btn));
  });
}

function handleMatchClick(btn){
  const side = btn.dataset.side;
  const i = parseInt(btn.dataset.idx, 10);

  if(side === 'left'){
    if(btn.disabled) return;
    document.querySelectorAll('.match-item[data-side="left"]').forEach(b=>b.classList.remove('selected'));
    selectedLeftIdx = i;
    btn.classList.add('selected');
    return;
  }

  if(btn.disabled) return;
  if(selectedLeftIdx === null) return;

  const leftItem = matchLeft[selectedLeftIdx];
  const rightItem = matchRight[i];
  const leftBtn = document.querySelector(`.match-item[data-side="left"][data-idx="${selectedLeftIdx}"]`);

  if(leftItem.en === rightItem.en){
    matchedIds.add(leftItem.id);
    if(leftBtn){ leftBtn.classList.remove('selected'); leftBtn.classList.add('correct'); leftBtn.disabled = true; }
    btn.classList.add('correct'); btn.disabled = true;
    selectedLeftIdx = null;
    const progressEl = document.querySelector('.progress-row .mono');
    if(progressEl) progressEl.textContent = `${matchedIds.size}/${matchLeft.length} cocok`;
    if(matchedIds.size === matchLeft.length){
      setTimeout(()=>{ matchBatchIndex += 1; renderMatchBatch(); }, 550);
    }
  } else {
    matchRoundMissedIds.add(leftItem.id);
    if(leftBtn) leftBtn.classList.add('wrong');
    btn.classList.add('wrong');
    setTimeout(()=>{
      if(leftBtn) leftBtn.classList.remove('wrong','selected');
      btn.classList.remove('wrong');
      selectedLeftIdx = null;
    }, 550);
  }
}

function finishMatchRound(){
  if(roundNumber === 0){ totalMissedFirstPass = matchRoundMissedIds.size; }

  if(matchRoundMissedIds.size === 0){ renderAllCorrect(); return; }

  const missedItems = activePool.filter(it => matchRoundMissedIds.has(it.id));
  const missedCount = missedItems.length;
  statusVal.textContent = "REVISIT";
  card.innerHTML = `
    <div class="center-stack">
      <div class="section-tag" style="background:var(--red);color:#FFF9EC;">${missedCount} SALAH</div>
      <h1 class="intro-title">Hampir khatam!</h1>
      <p class="intro-desc">Kamu salah <b>${missedCount}</b> pasangan. Kamu akan diberi <b>${missedCount} kesempatan ulang</b> (khusus soal yang salah) sampai semua benar.</p>
      <div class="missed-list">
        ${missedItems.map(m=>`<div class="missed-item"><span class="id">${m.id}</span><span class="ans">${m.en}</span></div>`).join('')}
      </div>
      <button class="btn" id="retryBtn">Ulangi Soal yang Salah →</button>
    </div>
  `;
  document.getElementById('retryBtn').onclick = ()=> startMatchRetry(missedItems);
}

/* ---------------- ESSAY MODE ---------------- */
function normalizeAnswer(s){
  return s
    .toLowerCase()
    .trim()
    .replace(/[.,!?;:'"]/g, '')
    .replace(/\s+/g, ' ');
}

function startEssayQuiz(pool){
  activePool = pool;
  queue = shuffle(pool);
  roundMissed = [];
  idx = 0;
  roundNumber = 0;
  statusVal.textContent = "OPEN BOOK";
  setPresenceStatus('in_progress');
  renderEssayQuestion();
}

function startEssayRetry(missedItems){
  queue = shuffle(missedItems);
  roundMissed = [];
  idx = 0;
  roundNumber += 1;
  statusVal.textContent = "REVIEW " + roundNumber;
  renderEssayQuestion();
}

function renderEssayQuestion(){
  clearTimer();
  answered = false;
  if(idx >= queue.length){
    finishRound(startEssayRetry);
    return;
  }
  const item = queue[idx];
  timeLeft = 10;

  const dotsHtml = queue.map((_,i)=>{
    let cls = 'dot';
    if(i < idx) cls += ' done';
    else if(i === idx) cls += ' current';
    return `<span class="${cls}"></span>`;
  }).join('');

  card.innerHTML = `
    <div class="reset-row"><button class="reset-btn" id="resetBtn">↺ Reset</button></div>
    <div class="progress-row">
      <span>${roundNumber===0 ? 'SOAL' : 'ULANGI'} ${idx+1} / ${queue.length}</span>
      <div class="dots">${dotsHtml}</div>
    </div>
    ${timedMode ? `
    <div class="timer-wrap">
      <div class="flap mono" id="flapTime">${timeLeft}</div>
      <div class="timer-bar-bg"><div class="timer-bar" id="timerBar"></div></div>
    </div>` : ''}
    <div class="section-tag">${item.tag}</div>${monthBadgeHtml(item)}
    <div class="question">Ketik terjemahan Bahasa Inggris:</div>
    <div class="question-word">"${item.id}"</div>
    <div class="essay-wrap">
      <input type="text" id="essayInput" class="essay-input" placeholder="Ketik jawabanmu di sini..." autocomplete="off" autocapitalize="off" spellcheck="false" />
      <button class="btn" id="essaySubmitBtn" style="width:100%;">Kirim Jawaban →</button>
      <div id="essayFeedback"></div>
    </div>
  `;

  document.getElementById('resetBtn').onclick = ()=>{ clearTimer(); renderIntro(); };

  const input = document.getElementById('essayInput');
  input.focus();
  input.addEventListener('keydown', (e)=>{
    if(e.key === 'Enter'){ e.preventDefault(); submitEssay(item, false); }
  });
  document.getElementById('essaySubmitBtn').addEventListener('click', ()=> submitEssay(item, false));

  if(timedMode){ startTimer(()=> submitEssay(item, true)); }
}

function submitEssay(item, isTimeout){
  if(answered) return;
  answered = true;
  clearTimer();

  const input = document.getElementById('essayInput');
  const rawVal = isTimeout ? '' : (input ? input.value : '');
  const isCorrect = !isTimeout && normalizeAnswer(rawVal).length > 0 && normalizeAnswer(rawVal) === normalizeAnswer(item.en);

  if(input){ input.disabled = true; input.classList.add(isCorrect ? 'correct' : 'wrong'); }
  const submitBtn = document.getElementById('essaySubmitBtn');
  if(submitBtn) submitBtn.disabled = true;

  const feedback = document.getElementById('essayFeedback');
  if(feedback){
    feedback.innerHTML = isCorrect
      ? `<div class="essay-feedback correct">✓ Benar! — ${item.en}</div>`
      : `<div class="essay-feedback wrong">✕ ${isTimeout ? 'Waktu habis.' : 'Kurang tepat.'} Jawaban: <b>${item.en}</b></div>`;
  }

  if(!isCorrect){ roundMissed.push(item); }

  setTimeout(()=>{
    idx += 1;
    renderEssayQuestion();
  }, 1200);
}

// initApp() dipanggil otomatis lewat listener status gate di atas
</script>
